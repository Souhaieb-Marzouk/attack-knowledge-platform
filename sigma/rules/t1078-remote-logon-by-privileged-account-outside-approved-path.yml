title: Remote Logon by Privileged Account Outside Approved Path
id: d6e85a63-96e1-4d91-a8c6-b9e2f9f13c28
status: experimental
description: 'Detects a network (type 3) or remote interactive (type 10) logon where the target account is privileged. Privilege is known in two ways: an account name suffix convention (-adm / _admin), or a daily SIEM enrichment lookup that adds IsPrivilegedAccount from group membership. Privileged accounts should log in from jump hosts, not from arbitrary remote sources.'
references:
- https://attack.mitre.org/techniques/T1078/
- https://attack.mitre.org/techniques/T1078/003/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1078
- attack.t1078.003
- attack.initial_access
- attack.persistence
- attack.privilege_escalation
- attack.defense_evasion
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType:
    - 3
    - 10
  selection_suffix:
    TargetUserName|endswith:
    - -adm
    - _admin
  selection_enriched:
    IsPrivilegedAccount: 'true'
  condition: selection_logon and (selection_suffix or selection_enriched)
fields:
- EventID
- TargetUserName
- TargetSid
- LogonType
- IpAddress
- WorkstationName
- Computer
falsepositives:
- Documented break-glass logons of built-in admin accounts
- Administrative work from approved jump hosts that match the suffix
level: critical

