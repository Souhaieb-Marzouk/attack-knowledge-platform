title: Remote Thread Started at Unbacked Address
id: 50d0f2d7-de01-47be-adcb-50b25864dddf
status: experimental
description: Detects a remote thread whose start address is not backed by any loaded module (Sysmon Event ID 8 with empty StartModule or StartFunction). This is a strong sign of portable executable injection, reflective loading, or shellcode execution.
references:
- https://attack.mitre.org/techniques/T1055/002/
- https://github.com/SigmaHQ/sigma
- https://learn.microsoft.com/sysinternals/downloads/sysmon
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.002
- attack.t1620
logsource:
  product: windows
  service: sysmon
detection:
  selection_module:
    EventID: 8
    StartModule:
    - '-'
    - ''
  selection_function:
    EventID: 8
    StartFunction:
    - '-'
    - ''
  condition: 1 of selection_*
fields:
- UtcTime
- SourceImage
- TargetImage
- StartModule
- StartFunction
falsepositives:
- Just-in-time compiled .NET code can briefly report an empty StartModule
- Legitimate debugging and profiling tools that create threads in unbacked memory
level: high

