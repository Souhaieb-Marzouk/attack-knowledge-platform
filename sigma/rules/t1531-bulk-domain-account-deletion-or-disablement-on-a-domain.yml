title: Bulk Domain Account Deletion or Disablement on a Domain Controller
id: 3f6b1a42-9d51-4c77-a2e8-0b7f34e91d26
status: experimental
description: Detects bursts of account deletions (Event 4726) or disables (Event 4725) on domain controllers within ten minutes.
  Bulk removal by one subject matches documented ransomware behavior such as Akira, which deletes admin accounts before encryption.
references:
- https://attack.mitre.org/techniques/T1531/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: security
  product: windows
  service: security
detection:
  selection_deletion:
    EventID: 4726
  selection_disable:
    EventID: 4725
  timeframe: 10m
  condition: 1 of selection_*
fields:
- EventID
- TargetUserName
- SubjectUserName
- SubjectDomainName
- WorkstationName
falsepositives:
- Bulk deprovisioning during a documented offboarding campaign
- Identity governance tooling running a lifecycle cleanup job
level: critical
tags:
- attack.t1531
