title: Suspicious UPDATE on High-Value Database Tables
id: 3f7a1c92-8d54-4e6b-9a21-5c8f0d34ab01
status: experimental
description: Detects UPDATE statements that change balance, amount, or status columns on business tables from a user that
  is not on the approved writer list. This matches fraudulent transaction injection and stored record manipulation, including
  behavior reported for FIN13 and Elephant Beetle.
references:
- https://attack.mitre.org/techniques/T1565/
- https://attack.mitre.org/techniques/T1565/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: database
  product: mysql
detection:
  selection_update:
    query|contains|all:
    - 'UPDATE '
    - ' accounts'
  selection_columns:
    query|re: (?i)(balance|amount|status)\s*=
  filter_writers:
    user:
    - appsvc
    - dba_admin
    - batch_recon
  condition: selection_update and selection_columns and not filter_writers
fields:
- user
- host
- db
- query
- rows_affected
falsepositives:
- Approved batch jobs that recalculate balances; add their users to filter_writers
- DBA migrations inside a change window
level: critical
tags:
- attack.t1565
