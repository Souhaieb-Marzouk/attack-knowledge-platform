title: Webserver SQL Injection Probe or Scripted CMS Admin Access
id: 7c1a3d92-6f4b-4c15-9a28-3d5e8b10c4f2
status: experimental
description: Detects SQL injection probes against CMS query parameters and administrative POST requests made with scripted
  user agents. This is the dominant entry path (TH-01) that ends in external defacement (T1491.002) after exploitation of
  a public-facing application.
references:
- https://attack.mitre.org/techniques/T1491/002/
- https://attack.mitre.org/techniques/T1190/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: webserver
detection:
  selection_sqli:
    cs_uri_query|re: (?i)(union(%20|\+|%|\s)+select|information_schema|load_file|sleep\s*\()
  selection_admin_tool:
    cs_method: POST
    cs_uri_stem|contains:
    - /administrator/index.php
    - /wp-login.php
    - /wp-admin/admin-ajax.php
    User_Agent|contains:
    - sqlmap
    - python-requests
    - curl/
  condition: selection_sqli or selection_admin_tool
fields:
- c-ip
- cs_method
- cs_uri_stem
- cs_uri_query
- sc_status
- User_Agent
falsepositives:
- Authorized vulnerability scanning and load testing from documented sources.
- Legitimate scripted integrations that call CMS endpoints; allowlist their user agents.
level: critical
tags:
- attack.t1491.002
