title: Mobile Device Opens Parcel or Pickup Themed Link
id: 70328ca4-ef91-4e57-8d2e-8d2e3f4a5b67
status: experimental
description: Detects a corporate device fetching a parcel, pickup, or delivery themed page from a mobile browser. Smishing campaigns use these exact words to move staff off email and onto phones.
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/003/
author: Souhaieb Marzouk
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.t1566.003
logsource:
  product: fortigate
  service: traffic
  definition: FortiGate forward traffic logs with web filtering fields
detection:
  selection_agent:
    agent|contains: Mobile
  selection_url:
    url|contains:
    - pickup
    - parcel
    - delivery
    - depot
  filter_carriers:
    hostname|endswith:
    - .dhl.com
    - .ups.com
    - .fedex.com
    - .dpd.com
  condition: selection_agent and selection_url and not filter_carriers
falsepositives:
- Staff using real carrier websites; the carrier filter excludes the big ones, extend it to your region.
- Logistics teams whose daily work matches these words — route their ranges to a separate policy.
level: medium

