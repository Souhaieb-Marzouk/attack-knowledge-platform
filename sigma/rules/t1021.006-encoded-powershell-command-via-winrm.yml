title: Encoded PowerShell Command via WinRM
id: 9abdd8d0-231c-446d-88ef-8f1a4213ae2c
status: stable
description: Detects PowerShell script blocks that carry an encoded command, seen in event 4104 or on
  the command line in event 4688. Attackers encode payloads with -EncodedCommand or FromBase64String to
  hide them from plain-text rules. The 4104 event records the decoded content, so the rule leads straight
  to the payload.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.006
- attack.t1059.001
logsource:
  product: windows
  service: powershell
detection:
  selection_encoded:
    EventID: 4104
    ScriptBlockText|contains:
    - -enc
    - -EncodedCommand
    - FromBase64String
  condition: selection_encoded
falsepositives:
- Approved deployment scripts that encode long payloads on purpose
level: high
