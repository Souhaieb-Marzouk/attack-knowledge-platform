title: Direct Root SSH Login Accepted
id: a9b1c4d7-2e83-4f56-b0a9-3c5d8e1f2b64
status: experimental
description: Detects any successful SSH login as root with a key or a password. Hardened baselines set PermitRootLogin no, so every hit is a configuration break or an attacker with direct root access.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Souhaieb Marzouk
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1078.003
logsource:
  product: linux
  service: auth
detection:
  selection_pub:
    message|contains: Accepted publickey for root
  selection_pass:
    message|contains: Accepted password for root
  condition: 1 of selection_*
falsepositives:
- A legacy appliance that still uses direct root SSH (move it to the exception list and fix it)
level: high

