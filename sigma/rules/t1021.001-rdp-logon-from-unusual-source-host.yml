title: RDP Logon from Unusual Source Host
id: 7e2b1c04-9a3d-4f61-b8c8-2f5e0a9d4c11
status: experimental
description: Detects an interactive RDP logon (Logon Type 10) from a source IP that is not an approved jump server. Attackers use RDP to move between Windows machines after stealing valid credentials.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 10
  filter_known_jump:
    IpAddress:
    - 10.0.20.11
    - 10.0.20.12
  condition: selection and not filter_known_jump
falsepositives:
- Administrators connecting from new workstations during planned maintenance
- New jump servers that are not on the allow list yet
level: medium

