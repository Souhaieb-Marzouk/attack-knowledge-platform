title: PowerShell Download Cradle with Invoke-Expression
id: c2e8d5a1-9b47-4f3a-8d6c-3e1b7f9a2c02
status: stable
description: Detects PowerShell processes combining download methods with expression invocation, typical of download-and-execute cradles used to fetch second-stage payloads.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: "Souhaieb Marzouk"
date: 2026-09-26
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_cmdline:
    CommandLine|contains|all:
      - 'DownloadString'
      - 'IEX'
  condition: selection_that_does_not_exist
falsepositives:
  - Administrative or deployment scripts that legitimately use Invoke-Expression
level: high