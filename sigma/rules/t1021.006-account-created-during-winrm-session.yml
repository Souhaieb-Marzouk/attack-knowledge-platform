title: Account Created During WinRM Session
id: 20352119-244f-498d-8f4b-ea5112a47852
status: experimental
description: 'Detects a user account creation (event 4720) on a host that had a WinRM network logon (event 4624, Type 3, Negotiate) moments earlier. The near operator ties the two events together within the timeframe on the same machine. Attackers create accounts this way to keep access even after the stolen password is reset. On a domain controller the new account is a domain account; on member servers it is a local one. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.persistence
- attack.t1021.006
- attack.t1136.001
logsource:
  product: windows
  service: security
detection:
  selection_4720:
    EventID: 4720
  selection_4624:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: Negotiate
  condition: selection_4720 and selection_4624
  timeframe: 5m
falsepositives:
- Planned account provisioning by IT during approved change windows
level: high

