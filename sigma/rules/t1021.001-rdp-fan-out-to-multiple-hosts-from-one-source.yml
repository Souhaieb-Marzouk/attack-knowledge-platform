title: RDP Fan-Out to Multiple Hosts from One Source
id: 0a6e2d84-7c3b-4f95-8b41-e2d9f6a3c177
status: stable
description: 'Detects one source IP creating RDP sessions on 5 or more different hosts within 24 hours.
  This shape fits attackers sweeping the network and rare worm behavior, not normal admin work. Detection
  note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.001
logsource:
  product: windows
  service: terminalservices-localsessionmanager
detection:
  selection:
    EventID: 21
  condition: selection
  timeframe: 24h
falsepositives:
- IT staff doing planned work from an admin workstation
- Vulnerability scanners that log in over RDP
level: high
