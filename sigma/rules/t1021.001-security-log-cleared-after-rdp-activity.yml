title: Security Log Cleared After RDP Activity
id: 7b95ad66-b286-490b-bdea-801d137c5735
status: stable
description: Detects a cleared Security log (Event 1102). Attackers often clear logs after RDP sessions
  to hide lateral movement. Correlate this event with the Type 10 logons that came before it on the same
  host.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.001
- attack.t1070.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
- Approved log rotation or an administrator cleaning up after a test
level: high
