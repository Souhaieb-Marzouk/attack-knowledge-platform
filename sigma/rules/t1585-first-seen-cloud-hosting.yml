title: Cloud Hosting Domain Access
id: 6611bb76-0726-4ff0-b86a-a9bd82434b41
status: experimental
description: Looks for users opening pages on low-cost cloud hosting domains often used for phishing kits. Check the page before blocking the whole host.
references:
- https://attack.mitre.org/techniques/T1585/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1585
logsource:
  category: proxy
detection:
  selection_hosts:
    url_host|endswith:
    - .workers.dev
    - .pages.dev
    - .netlify.app
    - .vercel.app
    - .web.core.windows.net
    - .blob.core.windows.net
    - .storage.googleapis.com
    - .herokuapp.com
  filter_known:
    url_host|endswith:
    - .company-sanctioned.workers.dev
  condition: selection_hosts and not filter_known
fields:
- url_host
falsepositives:
- Approved internal apps hosted on workers.dev
- Developers testing a static site
level: medium

