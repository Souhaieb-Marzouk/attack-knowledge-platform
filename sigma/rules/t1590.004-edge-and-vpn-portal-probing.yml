title: Edge and VPN Portal Probing
id: 5e8a1c37-9b42-4d7f-a613-2f9c8b04d7e5
status: stable
description: 'Detects one source requesting many VPN, webmail, or admin portal paths on public web servers
  within ten minutes. This is how an attacker profiles a discovered portal before trying credentials against
  it. Detection note: this is the event-level half. Apply the SIEM threshold count(clientip) > 20 within
  5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/004/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.004
logsource:
  category: webserver
  product: apache
detection:
  selection:
    method: GET
    uri_path|contains:
    - /remote/login
    - /remote/portal
    - /webmail
    - /admin
  condition: selection
falsepositives:
- Your own uptime monitor checking the portal pages
- Security teams testing the login page after a change
level: high
