title: Finance Meeting from External Domain
id: 3dfdcdaa-60e2-4095-80fe-0d8fe59fb322
status: experimental
description: Looks for a finance-themed meeting created by an external organizer. Verify the meeting through a known internal contact before joining.
references:
- https://attack.mitre.org/techniques/T1683/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1683.002
logsource:
  category: application
  product: zoom
detection:
  selection_created:
    event:
    - MeetingCreated
    - MeetingScheduled
  selection_theme:
    meeting_subject|contains:
    - confidential
    - acquisition
    - treasury
    - wire
    - urgent payment
    - funding
  filter_internal_org:
    organizer_domain|endswith: yourcompany.com
  filter_partner:
    organizer_domain|endswith:
    - auditor-partner.com
    - bank-partner.com
  condition: selection_created and selection_theme and not filter_internal_org and not filter_partner
fields:
- event
- meeting_subject
- organizer_domain
falsepositives:
- External auditor or bank meeting
- M&A advisor using a new domain
- Customer finance review
level: medium

