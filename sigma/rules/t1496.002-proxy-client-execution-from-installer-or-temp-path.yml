title: Proxy Client Execution from Installer or Temp Path
id: 401931f4-2f7a-4933-84f8-63dab38a9de6
status: experimental
description: Detects execution of residential proxy client binaries, including the Ngioweb name and the svhost masquerade,
  and common SOCKS proxy flags. Proxyware is often bundled with cracked software or fake VPN apps. Maps to ATT&CK T1496.002,
  detection strategy DET0028, analytics AN0080 and AN0081.
references:
- https://attack.mitre.org/techniques/T1496/
- https://attack.mitre.org/techniques/T1496/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    Image|endswith:
    - \ngioweb.exe
    - \svhost.exe
  selection_flag:
    CommandLine|contains:
    - socks5
    - -l 0.0.0.0
    - -p 1080
  selection_temp_proxy:
    Image|contains:
    - \AppData\Local\Temp\
    - \Users\Public\
    CommandLine|contains: proxy
  condition: 1 of selection_*
fields:
- Image
- CommandLine
- ParentImage
- User
- Hashes
falsepositives:
- Rare utilities genuinely named svhost.exe; validate path and signature
- Developer tunnel tools on documented build hosts
level: high
tags:
- attack.t1496.002
