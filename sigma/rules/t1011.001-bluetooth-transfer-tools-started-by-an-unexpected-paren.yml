title: Bluetooth Transfer Tools Started by an Unexpected Parent
id: 3f5a9c1e-8b2d-4c47-9e6a-71d0b4c8f2a3
status: experimental
description: Detects the start of the Windows Bluetooth file transfer wizard (fsquirt.exe) or the Bluetooth settings panel
  (bthpropscpl.exe) when the parent process is not the usual user shell. Attackers drive these tools from scripts to push
  staged files over OBEX, the Object Exchange Bluetooth file-push profile. This rule covers threat 1 of the T1011.001 ranking.
references:
- https://attack.mitre.org/techniques/T1011/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
  definition: Sysmon event 1 (process creation) or any EDR process event mapped to Image, CommandLine, ParentImage, User,
    Computer.
detection:
  selection:
    Image|endswith:
    - \fsquirt.exe
    - \bthpropscpl.exe
  filter_expected:
    ParentImage|endswith:
    - \explorer.exe
  condition: selection and not filter_expected
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Users pushing their own photos or files to a personal phone from a launcher other than explorer
- IT staff running Bluetooth troubleshooting scripts
- Software deployments that surface the transfer wizard during setup
level: high
tags:
- attack.t1011.001
