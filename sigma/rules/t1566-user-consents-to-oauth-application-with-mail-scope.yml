title: User Consents to OAuth Application with Mail Scope
id: 3c9e4f60-ab5d-4a13-be4c-7f8a9b0c1d23
status: experimental
description: Detects a user-level OAuth consent grant in the Microsoft 365 Unified Audit Log. Consent phishing needs exactly this event; scopes with Mail.Read and offline_access hand the attacker a lasting token.
references:
- https://attack.mitre.org/techniques/T1566/
- https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-illicit-consent-grants
author: Souhaieb Marzouk
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.collection
- attack.t1114
- attack.t1566.003
logsource:
  product: m365
  service: audit
  definition: Microsoft 365 Unified Audit Log (AzureActiveDirectory workload)
detection:
  selection_operation:
    Operation|startswith: Consent to application
  selection_success:
    ResultStatus: Success
  filter_admin:
    IsAdminConsent: true
  condition: selection_operation and selection_success and not filter_admin
falsepositives:
- Staff consenting to approved business applications; keep an allowlist of app ObjectIds.
- Legitimate SaaS tools that request mail scopes for calendar or booking features.
level: high

