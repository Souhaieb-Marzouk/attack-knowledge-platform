title: Tor Client or Pluggable Transport Process Creation
id: 7d3e2a41-9c58-4b6f-8a2d-1f0e5c93b7d4
status: experimental
description: Detects the creation of a Tor client process or a Tor pluggable transport helper on a Windows endpoint. Attackers
  bundle Tor with an implant so that command and control can reach a hidden service over a multi-hop proxy chain. A Tor process
  on a managed endpoint is a strong signal of covert C2 activity.
references:
- https://attack.mitre.org/techniques/T1090/003/
- https://community.torproject.org/onion-services/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
    - \tor.exe
    - \obfs4proxy.exe
    - \lyrebird.exe
    - \meek-client.exe
    - \snowflake-client.exe
  selection_torbrowser:
    Image|contains: \Tor Browser\
  selection_cmdline:
    CommandLine|contains:
    - --SocksPort
    - HiddenServicePort
  condition: 1 of selection_*
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Approved security research on dedicated lab systems
- A packaged application that bundles Tor and has a signed exception record
level: critical
tags:
- attack.t1090.003
