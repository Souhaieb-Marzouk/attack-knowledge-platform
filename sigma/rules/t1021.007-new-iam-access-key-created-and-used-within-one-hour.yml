title: New IAM Access Key Created and Used Within One Hour
id: d9b6f1a4-47e0-4c83-a5f2-8c1d6b9e2a05
status: experimental
description: 'Correlates an IAM CreateAccessKey event with follow-up API activity by the same principal within one hour. Shows a freshly minted key that is already being used - the persistence step seen in cloud intrusion campaigns. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.persistence
- attack.lateral-movement
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  key_created:
    eventName: CreateAccessKey
    eventSource: iam.amazonaws.com
  key_used:
    eventName:
    - GetCallerIdentity
    - ListBuckets
    - DescribeInstances
  condition: key_created and key_used
  timeframe: 1h
falsepositives:
- Onboarding automation that creates a key and immediately configures it
level: critical

