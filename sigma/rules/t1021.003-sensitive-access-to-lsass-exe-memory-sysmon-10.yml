title: Sensitive Access to lsass.exe Memory (Sysmon 10)
id: 3f7b1c92-8a54-4e6d-9b2f-71c0d5e8a413
status: stable
description: Detects a process requesting access to lsass.exe with rights that allow reading memory. After
  a DCOM pivot, attackers dump credential material this way to reach the next hop, often with comsvcs.dll
  MiniDump.
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
- attack.t1003.001
logsource:
  product: windows
  category: process_access
  service: sysmon
detection:
  selection_target:
    TargetImage|endswith: \lsass.exe
  selection_rights:
    GrantedAccess|contains:
    - '0x1010'
    - '0x143a'
  condition: selection_target and selection_rights
falsepositives:
- Antivirus and EDR agents that read process memory during scans
level: high
