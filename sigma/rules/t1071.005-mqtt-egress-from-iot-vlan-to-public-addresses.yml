title: MQTT Egress from IoT VLAN to Public Addresses
id: 3f6c9a12-7b4e-4d21-9c58-1e0a52d3b7f4
status: experimental
description: Detects outbound MQTT connections on ports 1883 or 8883 from the IoT VLAN to addresses outside the approved broker
  list. Publish and subscribe brokers are a known command and control channel for IoT malware such as Muhstik.
references:
- https://attack.mitre.org/techniques/T1071/005/
- https://blog.trendmicro.com/trendlabs-security-intelligence/muhstik-botnet-attacks-linux-servers-iot-devices-with-cryptomining-and-ddos/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network
  product: zeek
  service: conn
detection:
  selection_port:
    id.resp_p:
    - 1883
    - 8883
  selection_src:
    id.orig_h|startswith: 192.168.8.
  filter_approved:
    id.resp_h:
    - 10.10.0.40
  condition: selection_port and selection_src and not filter_approved
fields:
- id.orig_h
- id.resp_h
- id.resp_p
- service
- duration
- orig_bytes
falsepositives:
- An approved broker that is missing from the filter list
- A lab scanner that probes MQTT ports from the IoT VLAN
level: high
tags:
- attack.t1071.005
