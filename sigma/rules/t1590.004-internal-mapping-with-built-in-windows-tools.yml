title: Internal Mapping with Built-in Windows Tools
id: b7d2f948-16c3-4e5a-9f80-3a1c6e2b95d4
status: stable
description: 'Detects bursts of nltest, net view, and nbtstat launches on Windows servers. These commands
  map domains, shares, and NetBIOS names from inside. This is the post-compromise mapping stage, which
  MITRE tracks under the Discovery tactic. Detection note: this is the event-level half. Apply the SIEM
  threshold count(User) > 3 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/004/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_nltest:
    Image|endswith: \nltest.exe
  selection_nbtstat:
    Image|endswith: \nbtstat.exe
  selection_net:
    Image|endswith: \net.exe
    CommandLine|contains: net view
  condition: 1 of selection_*
falsepositives:
- Administrators on known admin machines
- Inventory or audit scripts that run the same commands on a schedule
level: medium
