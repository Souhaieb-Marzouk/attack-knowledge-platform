title: Reverse DNS (PTR) Sweep
id: 2f6d9a17-3c84-4e5b-8d29-6a1f4c7e92b3
status: stable
description: 'Detects a single source issuing many PTR queries in a short window. Walking PTR records
  across an address block maps server names without touching any system directly. Detection note: this
  is the event-level half. Apply the SIEM threshold count(id.orig_h) > 30 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/002/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.002
logsource:
  category: dns
  product: zeek
  service: dns
detection:
  selection:
    qtype_name: PTR
  timeframe: 10m
  condition: selection
falsepositives:
- Mail servers doing routine PTR checks on their connections
- Monitoring probes that verify reverse records
level: medium
