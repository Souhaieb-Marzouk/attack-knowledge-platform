title: Admin Share Access Following Network Logon from Same Host
id: f0d9a7c2-64b8-4e13-b5a9-8d3e6c0f27b1
status: stable
description: 'Detects a read of the C$ or ADMIN$ admin share that follows a Type 3 network logon from
  the same source host within 10 minutes. After DCOM execution, attackers fetch command output or copy
  tools this way. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json
  before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: security
detection:
  selection_share:
    EventID: 5145
    ShareName|endswith:
    - \C$
    - \ADMIN$
  selection_logon:
    EventID: 4624
    LogonType: 3
  condition: selection_share and selection_logon
  timeframe: 10m
falsepositives:
- Software deployment tools that log on and copy files in one flow
level: high
