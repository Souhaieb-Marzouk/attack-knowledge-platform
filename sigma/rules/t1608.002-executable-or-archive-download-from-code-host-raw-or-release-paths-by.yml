title: Executable or Archive Download from Code-Host Raw or Release Paths by Non-Developer Subnet
id: 27b4fabd-1e26-4d12-b563-c252175c9bfc
status: experimental
description: Detects a host outside the developer subnets downloading executable or archive content from raw or release paths of code-hosting platforms. Attackers stage tools this way for implants to pull later (ATT&CK T1608.002), and such a pull from a server or office host is almost never legitimate.
references:
- https://attack.mitre.org/techniques/T1608/002/
- https://attack.mitre.org/techniques/T1105/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608.002
- attack.command_and_control
- attack.t1105
logsource:
  category: proxy
detection:
  selection_hosts:
    cs-host|endswith:
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - codeload.github.com
    - gitlab.com
    - assets.gitlab-static.net
  selection_file:
    cs-method: GET
    c-uri-extension|contains:
    - exe
    - dll
    - zip
    - 7z
    - bin
    - ps1
  filter_dev:
    src_ip|cidr:
    - 10.20.0.0/16
    - 10.21.0.0/16
  filter_mirror:
    cs-host|endswith: github-internal.example
  condition: selection_hosts and selection_file and not 1 of filter_*
fields:
- src_ip
- user
- cs-host
- c-uri
- c-uri-extension
- sc-bytes
- c-useragent
falsepositives:
- Engineering systems outside the assumed developer ranges that fetch releases.
- Approved mirror or caching services that re-host release content.
level: high

