title: Ptrace Attach or Cross-Process Memory Write Targeting a Resident Daemon
id: 6916ccc1-7d36-4b95-9cac-71e7ada22522
status: experimental
description: Detects successful ptrace, process_vm_writev, or process_vm_readv calls that did not come from a known debug tool. VDSO hijacking needs an existing memory-write primitive inside the victim process, and this is how attackers get one. The daemon-target refinement is applied in the SPL via an asset list.
references:
- https://attack.mitre.org/techniques/T1055/014/
- https://attack.mitre.org/techniques/T1055/008/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.014
logsource:
  product: linux
  service: auditd
detection:
  selection_syscall:
    syscall:
    - ptrace
    - process_vm_writev
    - process_vm_readv
  selection_success:
    exit: '0'
  filter_debug_tools:
    exe|startswith:
    - /usr/bin/gdb
    - /usr/bin/strace
    - /usr/bin/perf
    - /usr/bin/ltrace
    - /usr/bin/valgrind
  condition: selection_syscall and selection_success and not filter_debug_tools
fields:
- syscall
- proc.name
- exe
- auid
- uid
- exit
falsepositives:
- Debuggers, profilers, and tracing tools used by engineers
- Crash handlers and performance agents that use ptrace legitimately
level: high

