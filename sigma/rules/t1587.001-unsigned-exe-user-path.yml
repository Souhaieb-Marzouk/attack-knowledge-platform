title: Unsigned Executable from User Folder
id: 010b785f-21cf-42b9-8730-3e56808bbf12
status: experimental
description: Detects an unsigned executable running from Temp, Public, or Downloads. Malware often starts this way, but installers and portable apps can also match.
references:
- https://attack.mitre.org/techniques/T1587/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 1
    Signed: 'false'
    Image|contains:
    - \AppData\Local\Temp\
    - \Users\Public\
    - \Downloads\
  filter_known:
    Company:
    - Microsoft Corporation
    - Google LLC
  condition: selection and not filter_known
fields:
- Company
- EventID
- Image
- Signed
falsepositives:
- Portable apps and installers
- Unsigned internal tools
- Game launchers
level: medium

