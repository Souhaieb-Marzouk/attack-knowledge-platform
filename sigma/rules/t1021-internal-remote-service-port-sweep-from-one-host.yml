title: Internal Remote Service Port Sweep from One Host
id: dbcc7b6d-8938-404f-aa48-051561f11904
status: experimental
description: 'Detects one internal host connecting to 20 or more different hosts on remote-service ports (SSH 22, SMB 445, RDP 3389, WinRM 5985) within 10 minutes. This is the recon step attackers run before choosing a service to move with, and it is also how ransomware worms find their next target. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.discovery
- attack.t1021
- attack.t1046
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationPort:
    - 22
    - 445
    - 3389
    - 5985
  condition: selection
falsepositives:
- Vulnerability scanners and patch-management servers (allow list them)
- Heavy file servers during scheduled replication jobs
level: medium

