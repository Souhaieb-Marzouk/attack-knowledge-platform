title: Wide-Structure Beacons to Versioned API Path with Binary Body
id: 3f8a1c42-9d27-4e5a-b1c8-6f2d90ae4b17
status: experimental
description: Detects HTTP POST beacons to a versioned API path that carry an octet-stream body, the stable structure left
  behind when an implant pads check-ins with junk data. Sigma cannot compute variance, so this rule matches structure and
  the paired SPL query adds the size-spread check.
references:
- https://attack.mitre.org/techniques/T1001/001/
- https://attack.mitre.org/software/S0559/
- https://attack.mitre.org/software/S1020/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  selection_method:
    cs-method: POST
  selection_uri:
    c-uri|startswith: /api/v
  selection_type:
    cs-content-type: application/octet-stream
  condition: selection_method and selection_uri and selection_type
fields:
- c-ip
- c-uri
- cs-bytes
- cs-user-agent
falsepositives:
- File upload APIs that send binary bodies
- Backup and telemetry agents polling API endpoints
level: medium
tags:
- attack.t1001.001
