title: DCOM Lateral Movement via MMC20.Application (PowerShell 4104)
id: 9c4d2f18-6a3e-4b7d-8f21-5c9e1d0a4b77
status: stable
description: Detects PowerShell script blocks that create the MMC20.Application COM object on a remote
  computer and call ExecuteShellCommand. This is the classic DCOM lateral movement pattern published by
  enigma0x3 in 2017.
references:
- https://attack.mitre.org/techniques/T1021/003/
- https://enigma0x3.net/2017/01/05/lateral-movement-using-the-mmc20-application-com-object/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: powershell
detection:
  selection:
    EventID: 4104
    ScriptBlockText|contains: MMC20.Application
  condition: selection
falsepositives:
- Authorized remote administration that intentionally automates MMC20
level: high
