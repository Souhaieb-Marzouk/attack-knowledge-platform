title: Repeated Identical Application Crash of the Same Module (Windows Event ID 1000)
id: da0acf6c-9245-42e3-97cf-c468aeee2560
status: experimental
description: 'Detects three or more Application Error events (Event ID 1000) sharing the same faulting module on one computer
  within 30 minutes. Repeating identical crash signatures are the fingerprint of exploitation-based denial of service (T1499.004):
  crafted input keeps killing the same process while the watchdog keeps restarting it.'
references:
- https://attack.mitre.org/techniques/T1499/004/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: application
detection:
  selection:
    Provider_Name: Application Error
    EventID: 1000
  timeframe: 30m
  condition: selection
fields:
- EventID
- FaultingApplicationName
- FaultingModuleName
- ExceptionCode
- FaultingOffset
- Computer
falsepositives:
- A genuinely buggy application that crashes repeatedly without attacker input.
- Planned load or fuzz testing that crashes a test build on a lab host.
level: high
tags:
- attack.t1499.004
