title: One Source Logs Into Many Hosts with Public Keys
id: b6f1d3a9-58c2-4e70-9a34-c0d7e2b5f841
status: experimental
description: 'Detects one source IP and account accepting public key logins on 3 or more distinct destination hosts within 24 hours. This fan-out pattern matches a stolen deploy or admin key used to walk the estate. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Souhaieb Marzouk
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
logsource:
  product: linux
  service: auth
detection:
  selection:
    message|contains: Accepted publickey
  condition: selection
  timeframe: 24h
falsepositives:
- Ansible or CI accounts that legitimately fan out (keep them on a separate account name)
- Backup and orchestration servers that connect to their fleet by design
level: high

