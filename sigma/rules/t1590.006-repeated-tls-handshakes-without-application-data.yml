title: Repeated TLS Handshakes without Application Data
id: 8d2b57e1-4c93-4f68-b1a4-3e57c90af402
status: test
description: 'Detects one source opening many TLS sessions to edge appliances with almost no payload,
  typical for banner and version probing (T1590.006). Detection note: this is the event-level half. Apply
  the SIEM threshold count(id.orig_h) > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.006
logsource:
  category: network
  product: zeek
  service: conn
detection:
  sel_handshake:
    service: ssl
    orig_bytes: 0
  condition: sel_handshake
falsepositives:
- Health checks and load balancer probes
- Approved network inventory scanners
level: medium
