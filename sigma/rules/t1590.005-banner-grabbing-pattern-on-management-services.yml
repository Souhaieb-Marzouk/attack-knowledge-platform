title: Banner Grabbing Pattern on Management Services
id: 2c6f8a1d-5e7b-4c3a-9f2d-4b6e8d1c5a05
status: test
description: 'Detects many short connections that open a management port, receive a small answer and close
  at once (Zeek connection state RSTO). This is how attackers grab banners from services they found in
  the range (MITRE ATT&CK T1590.005). Detection note: this is the event-level half. Apply the SIEM threshold
  count(id.orig_h) > 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/005/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.005
logsource:
  category: network
  product: zeek
  service: connection
detection:
  selection:
    connection_state: RSTO
    id.resp_p:
    - 21
    - 22
    - 23
    - 3389
  timeframe: 10m
  condition: selection
falsepositives:
- admin workstations that open and close sessions quickly
- approved configuration checks on management ports
level: medium
