title: SCP or SFTP Client Connecting to a Public IP
id: 3f7a1c2e-8b4d-4e29-9c6a-5d1f0e8b7a21
status: experimental
description: Detects scp, sftp, pscp, or psftp client processes opening a network connection to a public address. Bulk copies
  with these tools are a common T1048.002 pattern. Join with Sysmon Event ID 1 (see the matching SPL query) to see the command
  line that started the transfer.
references:
- https://attack.mitre.org/techniques/T1048/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_connection
  product: windows
  definition: Sysmon Event ID 3
detection:
  selection_client:
    EventID: 3
    Image|endswith:
    - \scp.exe
    - \sftp.exe
    - \pscp.exe
    - \psftp.exe
  filter_private:
    DestinationIp|startswith:
    - '10.'
    - '127.'
    - 169.254.
    - 172.16.
    - 172.17.
    - 172.18.
    - 172.19.
    - 172.20.
    - 172.21.
    - 172.22.
    - 172.23.
    - 172.24.
    - 172.25.
    - 172.26.
    - 172.27.
    - 172.28.
    - 172.29.
    - 172.30.
    - 172.31.
    - 192.168.
    - ::1
    - 'fe80:'
    - fc
    - fd
  condition: selection_client and not filter_private
fields:
- Image
- User
- DestinationIp
- DestinationPort
- ProcessGuid
falsepositives:
- Administrators copying files to approved hosts with scp or sftp
- Backup or sync jobs that use pscp or psftp
level: high
tags:
- attack.t1048.002
