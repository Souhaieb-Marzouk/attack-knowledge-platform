title: TFTP Client Network Activity on a Windows Server
id: 3f7b1c2a-9d4e-4b8a-b1c3-5e7f9a2d4c6e
status: experimental
description: Detects the built-in Windows TFTP client opening network connections. Servers should not fetch files with TFTP.
  Intruders use it for fast, unauthenticated tool staging, as in threat THR-01 on this page.
references:
- https://attack.mitre.org/techniques/T1071/002/
- https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_connection
  product: windows
  service: sysmon
detection:
  selection:
    EventCode: 3
    Image|endswith: \tftp.exe
  condition: selection
fields:
- EventCode
- Image
- DestinationIp
- DestinationPort
- User
- Computer
falsepositives:
- Approved imaging or firmware jobs that fetch with TFTP from servers
- A short, ticketed test by an administrator
level: high
tags:
- attack.t1071.002
