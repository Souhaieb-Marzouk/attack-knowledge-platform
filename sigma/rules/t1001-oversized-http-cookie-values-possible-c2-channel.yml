title: Oversized HTTP Cookie Values Possible C2 Channel
id: 7d1a4c2e-93f8-4a11-b6d2-0e5c8f7a9b31
status: experimental
description: Detects HTTP sessions where Cookie or Set-Cookie values are unusually long or high-entropy. Okrum has hidden
  actual C2 messages in Cookie and Set-Cookie headers (T1001).
references:
- https://attack.mitre.org/techniques/T1001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  selection_method:
    http.method:
    - GET
    - POST
  selection_cookie:
    c-cookie|re: '[A-Za-z0-9+/=]{400,}'
  condition: selection_method and selection_cookie
fields:
- c-uri
- c-hostname
- http.method
- c-cookie
falsepositives:
- Large but legitimate session cookies from identity providers
- Advertising and analytics platforms with long tracking cookies
level: high
tags:
- attack.t1001
