title: SQL Injection Probes Against Public Web Application (Defacement Pre-Stage)
id: 7c1f2a34-9e5b-4d8c-a1d2-3f4b5c6d7e8f
status: experimental
description: Detects SQL injection syntax in query strings and known injection tool user agents in web server traffic. This
  is the primary access path that leads to external defacement (threat TH-01).
references:
- https://attack.mitre.org/techniques/T1491/
- https://attack.mitre.org/techniques/T1190/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: webserver
detection:
  selection_sqli:
    cs-uri-query|re: (?i)(union(\s|\+|%20)+select|(\s|%20)or(\s|%20)1(=|%3d)1|sleep\(|benchmark\(|information_schema)
  selection_tools:
    User-Agent|contains:
    - sqlmap
    - nikto
    - w3af
    - havij
  condition: selection_sqli or selection_tools
fields:
- c-ip
- cs-method
- cs-uri-stem
- cs-uri-query
- sc-status
- User-Agent
falsepositives:
- Approved security scanners run by your own team or an external test provider
- Legitimate application URLs that contain words such as select or benchmark
level: critical
tags:
- attack.t1491
