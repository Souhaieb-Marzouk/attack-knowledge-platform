title: Lookalike Domain Resolution Inside the Network
id: a63b8e52-1d94-4c07-b2f6-5e9a0c7d4813
status: experimental
description: Detects Sysmon Event ID 22 DNS queries where the requested name matches known lookalike patterns for the brand. A resolution from inside the network often means a phishing click on a lookalike domain. This covers threat 1 of section 5.3. Update the pattern list from brand monitoring.
references:
- https://attack.mitre.org/techniques/T1590/001/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.001
logsource:
  category: dns
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 22
    QueryName|contains:
    - examp1e
    - example-login
    - example-support
    - example-secure
  condition: selection
falsepositives:
- Legitimate partner or customer domains that contain these patterns
- Security team tests of the rule
level: high

