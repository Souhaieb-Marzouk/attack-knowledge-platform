title: PostgreSQL Slow-Query Flood Possible Application Exhaustion
id: d41179b8-f8f3-4325-99a1-e10d5cd04ae7
status: experimental
description: Many PostgreSQL statements slower than 10 seconds within a short window, consistent with an expensive-parameter
  application exhaustion flood (T1499.003).
references:
- https://attack.mitre.org/techniques/T1499/003/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: postgresql
  service: postgresql
detection:
  selection_duration:
    message|re: duration:\s*\d{5,}\.\d+ ms
  selection_statement:
    message|contains: 'statement:'
  timeframe: 15m
  condition: selection_duration and selection_statement
fields:
- host
- message
falsepositives:
- Legitimate heavy reporting or batch jobs
- Missing indexes after schema changes
level: high
tags:
- attack.t1499.003
