title: Cisco ASA Threat Detection Drop for TCP SYN Flood
id: 676f21cb-780a-472a-998e-3328c5d6a96f
status: experimental
description: Detects Cisco ASA threat-detection messages (733100) that report dropped packets because a rate threshold was
  exceeded, commonly a TCP SYN flood against one exposed host. Matches endpoint resource exhaustion floods.
references:
- https://attack.mitre.org/techniques/T1499/
- https://attack.mitre.org/techniques/T1499/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: cisco
  service: asa
detection:
  sel_asa:
    message|contains: '%ASA-4-733100'
  sel_syn:
    message|contains: SYN-flood
  condition: sel_asa and sel_syn
fields:
- src_ip
- dst_ip
- dst_port
- action
falsepositives:
- Legitimate traffic bursts, such as a marketing event or a large download, that exceed the configured threat-detection rate.
- Internal load tests that traverse the firewall.
level: high
tags:
- attack.t1499
