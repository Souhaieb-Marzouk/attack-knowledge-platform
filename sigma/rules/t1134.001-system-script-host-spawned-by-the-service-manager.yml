title: SYSTEM Script Host Spawned by the Service Manager
id: 3f1e8a2c-0006-4b6d-9c2e-5a7f8d9e0a06
status: test
description: services.exe starting cmd, PowerShell, or script hosts as SYSTEM is a common pattern in service
  and token abuse chains. Known management agents must be filtered.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \services.exe
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
    User|endswith: SYSTEM
  filter:
    Image|startswith:
    - C:\Program Files\
    - C:\ProgramData\
  condition: selection and not filter
falsepositives:
- Management and monitoring agents, such as SCCM clients, that run scripts as SYSTEM
level: medium
tags:
- attack.privilege-escalation
- attack.t1134.001
