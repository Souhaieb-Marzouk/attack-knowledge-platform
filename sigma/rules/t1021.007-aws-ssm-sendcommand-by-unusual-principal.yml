title: AWS SSM SendCommand by Unusual Principal
id: a3f7c2d1-8b46-4e52-9c31-7d0e5f8a6b12
status: stable
description: Detects the SendCommand API call made by a principal that is not one of the approved automation
  roles. Attackers with stolen credentials use SendCommand to run shell commands on virtual machines without
  any SSH or console login.
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: SendCommand
    eventSource: ssm.amazonaws.com
  filter_admin:
    userIdentity.arn|endswith:
    - :role/AutomationAdmin
    - :role/svc-ssm-operator
  condition: selection and not filter_admin
falsepositives:
- New automation roles that run approved patching or deployment jobs
- Engineers running a documented break-fix command with change approval
level: high
