title: Built-in Administrator (RID 500) RDP Logon from a User Workstation
id: 3bbfd16a-d0d2-46a1-b53e-31ee3a7ae457
status: experimental
description: Detects an RDP (LogonType 10) logon with the built-in Administrator account by SID -500, excluding approved jump hosts by client workstation name. Matching by SID keeps the rule working after the account is renamed.
references:
- https://attack.mitre.org/techniques/T1078/003/
- https://learn.microsoft.com/en-us/windows/security/identity-protection/local-accounts
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1078.003
- attack.persistence
- attack.privilege_escalation
- attack.defense_evasion
logsource:
  product: windows
  service: security
detection:
  selection_rid500_rdp:
    EventID: 4624
    LogonType: 10
    TargetSid|endswith: '-500'
  filter_jump_hosts:
    WorkstationName|contains:
    - JUMP
    - BASTION
    - RDGATE
  filter_local_console:
    IpAddress: '-'
  condition: selection_rid500_rdp and not 1 of filter_*
fields:
- EventID
- TargetUserName
- TargetSid
- LogonType
- IpAddress
- WorkstationName
- Computer
falsepositives:
- A documented break-glass workstation that is missing from the allowlist
- Vendor support sessions routed through an unlisted management host
level: high

