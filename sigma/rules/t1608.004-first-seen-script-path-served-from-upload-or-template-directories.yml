title: First-Seen Script Path Served from Upload or Template Directories
id: 38a48689-472e-4739-9976-613f0c6edad8
status: experimental
description: Detects HTTP requests for script files inside upload or template directories of your own web estate. Attackers staging a drive-by target (T1608.004) drop an obfuscated loader into these folders and every visitor then fetches it. Alert on first-seen paths and on unusual visitor counts per path.
references:
- https://attack.mitre.org/techniques/T1608/004/
- https://attack.mitre.org/techniques/T1190/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.004
- attack.t1190
logsource:
  category: webserver
detection:
  selection_paths:
    uri|re: /(wp-content/uploads|wp-content/themes|sites/default/files|uploads|media|static/templates)/[^ ]+\.(js|mjs)$
  filter_healthcheck:
    user_agent|contains: healthcheck
  condition: selection_paths and not filter_healthcheck
fields:
- uri
- status
- clientip
- user_agent
- bytes
falsepositives:
- Legitimate bundles or build artifacts published into upload folders by design.
- Static asset pipelines that push versioned scripts into media paths.
level: medium

