title: Repeated Identical GET to Public Content Page with Non-Browser User Agent
id: 7c3a1f20-5b8e-4c2d-9a41-8f6e2d5b3c10
status: experimental
description: A single source host repeatedly requests the exact same public content page (video page, social post, RSS item)
  with a user agent that does not belong to a browser. Malware families such as LURK and PIXSTEAM pulled tasking from video
  comment sections this way (T1102.003).
references:
- https://attack.mitre.org/techniques/T1102/003/
- https://attack.mitre.org/techniques/T1102/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
  service: proxy
detection:
  selection_method:
    cs-method: GET
  selection_uri:
    c-uri|contains:
    - /watch
    - /status/
    - /comments
    - /feed
    - /posts/
  selection_ua:
    c-useragent|contains:
    - python-requests
    - python-urllib
    - curl/
    - Wget/
    - Go-http-client
    - okhttp/
    - Java/
  filter_browser:
    c-useragent|startswith: Mozilla/
  timeframe: 1h
  condition: selection_method and selection_uri and selection_ua and not filter_browser
fields:
- cs-ip
- cs-host
- c-uri
- c-useragent
- sc-status
falsepositives:
- Uptime checks and monitoring scripts that poll one public page
- RSS readers and feed-to-mail services on shared infrastructure
- Vulnerability scanners and research crawlers with custom agents
level: high
tags:
- attack.t1102.003
