title: Executable Staged in User-Writable Path by Browser or Mail Client
id: 4c1d3196-5ec1-48c9-bc4c-ff6983a6ec49
status: experimental
description: Detects executable files written by browser, mail, or archive processes into user-writable paths. This is the typical landing pattern of purchased malware and tools obtained through resource development (MITRE ATT&CK T1588, T1588.001, T1588.002).
references:
- https://attack.mitre.org/techniques/T1588/
- https://attack.mitre.org/techniques/T1588/001/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.001
- attack.t1588.002
logsource:
  product: windows
  service: sysmon
detection:
  selection_process:
    Image|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \outlook.exe
    - \winrar.exe
    - \7zFM.exe
  selection_target:
    TargetFilename|startswith:
    - C:\Users\
    TargetFilename|contains|all:
    - Downloads\
    TargetFilename|endswith:
    - .exe
    - .msi
    - .scr
    - .hta
  filter_admin_tools:
    TargetFilename|contains:
    - \Downloads\sysinternals\
    - \Downloads\wireshark
  condition: selection_process and selection_target and not 1 of filter_*
fields:
- Image
- TargetFilename
- Hashes
- User
falsepositives:
- Users downloading legitimate signed installers from known vendor sites
- Approved software deployment that uses the Downloads folder
level: high

