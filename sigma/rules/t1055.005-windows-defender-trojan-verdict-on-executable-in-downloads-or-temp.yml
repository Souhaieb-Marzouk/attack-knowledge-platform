title: Windows Defender Trojan Verdict on Executable in Downloads or Temp
id: d8d86cda-6380-40ce-a20c-5e97c754e5a5
status: experimental
description: Detects Windows Defender malware verdicts whose detection name indicates a trojan family and whose target file is an executable in a user download or temporary directory. Trojanized installers that stage code through TLS callbacks (T1055.005) typically arrive and land exactly this way.
references:
- https://attack.mitre.org/techniques/T1055/005/
- https://github.com/SigmaHQ/sigma
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.execution
- attack.t1055
- attack.t1055.005
logsource:
  product: windows
  service: windefend
detection:
  selection_event:
    EventID: 1116
  selection_trojan:
    DetectionName|contains: Trojan
  selection_path:
    FileName|endswith:
    - .exe
    - .dll
    - .scr
    PathName|contains:
    - \Downloads\
    - \Temp\
  condition: selection_event and selection_trojan and selection_path
fields:
- EventID
- DetectionName
- FileName
- PathName
- ProcessName
- FileHash
falsepositives:
- A user intentionally downloading and keeping a flagged security tool
- Red-team test files dropped during authorized exercises
level: high

