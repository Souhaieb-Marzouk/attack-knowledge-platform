title: DLL Injection Remote Thread at LoadLibrary
id: f1aaf7cf-5dfb-4083-8604-213a344fec4f
status: experimental
description: Detects Sysmon event ID 8 where a new remote thread starts in a LoadLibrary family function. This is the classic final step of dynamic-link library injection (MITRE ATT&CK T1055.001).
references:
- https://attack.mitre.org/techniques/T1055/001/
- https://github.com/SigmaHQ/sigma
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 8
    StartFunction:
    - LoadLibraryA
    - LoadLibraryW
    - LoadLibraryExA
    - LoadLibraryExW
  condition: selection
fields:
- EventID
- SourceImage
- TargetImage
- StartModule
- StartFunction
falsepositives:
- Some .NET runtimes, profilers, and debugger tooling legitimately start remote threads at LoadLibrary functions. Maintain an allowlist of known source images.
level: high

