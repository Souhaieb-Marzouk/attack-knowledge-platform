title: Lookalike Domain Lookup on Windows
id: 7e85e3e6-bc0f-4f0b-98a7-4eb3655924b4
status: experimental
description: Looks for a Windows DNS query that contains our brand but is not one of the real company domains. Good early warning for lookalike domains used in phishing.
references:
- https://attack.mitre.org/techniques/T1584/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.001
logsource:
  category: dns
  product: windows
detection:
  selection_brand:
    QueryName|contains: yourcompany
  filter_real:
    QueryName|endswith:
    - yourcompany.com
    - yourcompany.net
    - yourcompany.org
  condition: selection_brand and not filter_real
fields:
- QueryName
falsepositives:
- Partner domains that include the brand
- Old redirect domains
- Marketing URLs that are not on the main domain list
level: medium

