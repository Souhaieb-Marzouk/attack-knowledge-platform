title: Outbound WHOIS on TCP 43
id: 9b326d64-36b0-4179-9e4e-b5783a188c91
status: experimental
description: Looks for outbound WHOIS on TCP 43. WHOIS is normal during enrichment, so this is mainly useful in bulk or from odd hosts.
references:
- https://attack.mitre.org/techniques/T1596/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1596.002
logsource:
  category: network
  product: zeek
  service: conn
detection:
  selection:
    id.resp_p: 43
    proto: tcp
  filter_private:
    id.resp_h|startswith:
    - '10.'
    - 192.168.
    - 172.16.
    - 172.17.
    - 172.18.
    - 172.19.
    - 172.20.
    - 172.21.
    - 172.22.
    - 172.23.
    - 172.24.
    - 172.25.
    - 172.26.
    - 172.27.
    - 172.28.
    - 172.29.
    - 172.30.
    - 172.31.
  condition: selection and not filter_private
fields:
- id.resp_h
- id.resp_p
- proto
falsepositives:
- Security team WHOIS enrichment
- Domain management automation
- OSINT research
level: low

