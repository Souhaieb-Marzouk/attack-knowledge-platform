title: Git Push to a Non-Corporate Remote
id: 3f2c1d84-6a9e-4b7d-8f31-52c0a9d4e7b1
status: experimental
description: Detects a git client pushing to a remote that is not on the corporate allow-list. Intruders with a stolen developer
  session commonly add their own remote and run git push --all and git push --tags to move the whole repository out in one
  step.
references:
- https://attack.mitre.org/techniques/T1567/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_git:
    Image|endswith:
    - \git.exe
    - /git
  selection_push:
    CommandLine|contains|all:
    - push
    - http
  filter_corp:
    CommandLine|contains:
    - git.mycompany.internal
    - github.com/mycompany-org
    - gitlab.mycompany.com
  condition: selection_git and selection_push and not filter_corp
fields:
- User
- CommandLine
- ParentImage
- Hostname
- UtcTime
falsepositives:
- Developers pushing to approved mirror or backup remotes that are missing from the allow-list.
- CI agents pushing release tags to public repositories as part of a documented build job.
level: high
tags:
- attack.t1567.001
