title: Script Execution from Temp Path inside an SSH Session
id: 3f8a1c62-9d24-4b57-8e1a-6c0d92f4b7e8
status: stable
description: Detects a shell started by sshd that runs a script from /tmp or /dev/shm. This is the staging
  pattern of ransomware and coin-miner crews that arrive over SSH and execute their payload from a hidden
  temp folder.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Detection Engineering Team
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1059.004
logsource:
  product: linux
  service: auditd
detection:
  selection_shell:
    type: EXECVE
    a0:
    - sh
    - bash
  path_tmp:
    a1|contains: /tmp/
  path_shm:
    a1|contains: /dev/shm/
  path_tmp_c:
    a1: -c
    a2|contains: /tmp/
  path_shm_c:
    a1: -c
    a2|contains: /dev/shm/
  condition: selection_shell and 1 of path_*
falsepositives:
- Installers or build jobs that stage real scripts under /tmp (filter their accounts)
level: high
