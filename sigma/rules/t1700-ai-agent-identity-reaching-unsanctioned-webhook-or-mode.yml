title: AI Agent Identity Reaching Unsanctioned Webhook or Model API
id: 8c1f4b20-6e93-4a55-b7d1-2f0a9c4e7d01
status: experimental
description: Detects proxy traffic from an AI agent or agent service identity to generic webhook collectors or to model-API
  endpoints that are not on the approved AI egress list. This is the transfer half of AI-enabled exfiltration (T1700). Approved
  destinations form AuthorizedAIEndpoints, the list of external services an agent may talk to. Keep that list in a lookup
  and filter it before alerting.
references:
- https://attack.mitre.org/techniques/T1700/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  selection_agent:
    ruser|contains:
    - aiagent
    - ai-agent
    - agent-svc
    - ai-agent-runtime
  selection_target_webhook:
    cs_host|endswith:
    - webhook.site
    - hookb.in
    - pipedream.net
    - requestbin.com
    - interact.sh
    - oast.fun
  selection_target_body:
    c-uri-query|contains:
    - ignore_previous
    - system_prompt
    - exfil
  condition: selection_agent and 1 of selection_target_*
fields:
- ruser
- cs_host
- c-uri
- c-uri-query
- c-useragent
falsepositives:
- Sanctioned agent integrations missing from the approved endpoint lookup
- Security testing tools that use webhook collectors
level: high
tags:
- attack.exfiltration
- attack.t1567
