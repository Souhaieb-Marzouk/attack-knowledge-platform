title: Rclone Command-Line Tool Execution
id: 0f07b381-6e16-401d-a9c3-ec60c3e9f9be
status: experimental
description: Detects execution of rclone, the tool most commonly abused for bulk exfiltration to cloud storage services such
  as Mega, Google Drive or attacker-owned S3 buckets. rclone activity on servers hours before ransomware encryption is a known
  pre-encryption pattern (see ATT&CK C0015 and leaked ransomware playbooks).
references:
- https://attack.mitre.org/techniques/T1567/002/
- https://rclone.org/docs/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \rclone.exe
  selection_original:
    OriginalFileName|endswith: rclone.exe
  condition: 1 of selection_*
fields:
- Image
- CommandLine
- OriginalFileName
- ParentImage
- User
- Hashes
falsepositives:
- Administrators running approved rclone migrations. Maintain a baseline list of known hosts and service accounts and add
  them as a filter selection.
level: high
tags:
- attack.t1567.002
