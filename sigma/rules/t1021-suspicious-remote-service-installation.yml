title: Suspicious Remote Service Installation
id: 5dfd7086-94a8-4fd1-9abe-7e65d35fceb3
status: experimental
description: Detects a service installation with a PsExec-style name or a binary path inside an admin share. Attackers copy a small service program into ADMIN$ and start it remotely to run commands as SYSTEM on the target host.
references:
- https://attack.mitre.org/techniques/T1021/
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021
- attack.t1021.002
- attack.t1569.002
logsource:
  product: windows
  service: security
detection:
  selection_psexec:
    EventID: 7045
    ServiceName|contains: PSEXESVC
  selection_adminpath:
    EventID: 7045
    ImagePath|contains: ADMIN$
  selection_4697:
    EventID: 4697
    ServiceFileName|contains: ADMIN$
  condition: 1 of selection_*
falsepositives:
- Software deployment tools that push services from admin shares
- Vulnerability scanners installing temporary services
level: high

