title: TCP SYN Flood Detected via Zeek Connection Attempt Spike
id: e5f2a7b8-3c1d-4f6a-8b9e-7d4c2a1f3e50
status: experimental
description: 'Detects a TCP SYN flood: a very large number of connection attempts that never complete, concentrated on one
  destination service within one minute. Zeek records these as conn_state S0 (attempt seen, no reply) or REJ (rejected). A
  scan spreads across ports; a flood concentrates on one.'
references:
- https://attack.mitre.org/techniques/T1498/001/
- https://attack.mitre.org/techniques/T1498/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: zeek
  service: conn
detection:
  selection:
    proto: tcp
    conn_state:
    - S0
    - REJ
  timeframe: 1m
  condition: selection
fields:
- id.orig_h
- id.resp_h
- id.resp_p
- conn_state
falsepositives:
- Aggressive internet-wide vulnerability scanners
- A broken load-balancer health check that probes one service hard
- Batch clients with incorrect retry logic hammering a closed port
level: critical
tags:
- attack.t1498.001
