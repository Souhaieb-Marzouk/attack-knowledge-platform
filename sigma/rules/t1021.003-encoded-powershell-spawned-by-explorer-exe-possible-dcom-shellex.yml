title: Encoded PowerShell Spawned by explorer.exe (Possible DCOM ShellExecute)
id: e2a9f7b4-58d1-4c3e-8b6f-19d0c7a25e84
status: stable
description: Detects PowerShell started with an encoded command by explorer.exe. The ShellWindows and
  ShellBrowserWindow DCOM objects use a hidden Explorer window to ShellExecute programs on the target,
  so a server showing this pair means a remote activation just ran.
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
  service: sysmon
detection:
  selection:
    ParentImage|endswith: \explorer.exe
    CommandLine|contains: ' -enc '
  condition: selection
falsepositives:
- User-launched scripts on workstations; filter by server host groups
level: high
