title: Teams Call with Internal-Looking Caller ID
id: 5951bbc5-934d-43c6-8bdd-da3d09abc7b5
status: experimental
description: Detects a Teams PSTN call with a caller ID that starts with our number range. Voice phishing often spoofs an internal-looking number.
references:
- https://attack.mitre.org/techniques/T1598/004/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1598.004
logsource:
  product: m365
  service: teams
detection:
  selection_direction:
    CallDirection: Inbound
  selection_type:
    CallType: P2P
  selection_spoof:
    CallerId|startswith: '+1425555'
  condition: all of selection_*
fields:
- CallDirection
- CallType
- CallerId
falsepositives:
- Branch office sharing the range
- Telephony provider test
- Legitimate call from a company number
level: high

