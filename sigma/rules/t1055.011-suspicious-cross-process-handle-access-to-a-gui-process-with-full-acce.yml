title: Suspicious Cross-Process Handle Access to a GUI Process with Full Access Rights
id: f3bab4ae-7c99-4e20-a6d6-4048e21f9ad3
status: experimental
description: Detects a non-system process requesting full access rights (for example 0x1F0FFF) to a well-known benign GUI application process. Extra Window Memory Injection (T1055.011) needs cross-process window access before it writes to the extra window memory and swaps the window procedure. Check the call trace and the source process for follow-up.
references:
- https://attack.mitre.org/techniques/T1055/011/
- https://learn.microsoft.com/windows/win32/api/winuser/nf-winuser-setwindowlongptrw
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.011
logsource:
  product: windows
  service: sysmon
  definition: Sysmon Event ID 10 (ProcessAccess) with process-access logging enabled.
detection:
  selection_target:
    EventID: 10
    TargetImage|endswith:
    - \explorer.exe
    - \notepad.exe
    - \mspaint.exe
    - \wordpad.exe
    - \winver.exe
    - \calc.exe
    GrantedAccess:
    - '0x1F0FFF'
    - '0x1FFFFF'
    - '0x143A'
    - '0x1410'
    - '0x1010'
  filter_expected:
    SourceImage|endswith:
    - \explorer.exe
    - \svchost.exe
    - \csrss.exe
    - \dwm.exe
    - \winlogon.exe
  condition: selection_target and not filter_expected
fields:
- EventID
- SourceImage
- TargetImage
- GrantedAccess
- CallTrace
- SourceUser
- TargetUser
falsepositives:
- Remote support and RMM tools that automate the UI on the target host
- UI automation and accessibility frameworks such as UIA-based test runners
- Input remappers and IME software that touch window handles
level: high

