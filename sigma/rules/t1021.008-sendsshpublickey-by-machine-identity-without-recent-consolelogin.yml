title: SendSSHPublicKey by Machine Identity Without Recent ConsoleLogin
id: b1d6e9f3-4c8a-4e27-b5a9-3d7f1e6c8a24
status: experimental
description: Detects a temporary SSH key push by a machine identity (userIdentity.type AssumedRole, the identity a program or role session uses). Humans normally log in to the console first; robot roles should not behave like people. The classic rule below matches the machine-identity part. The Splunk search adds the true 24-hour ConsoleLogin lookback with a subsearch.
references:
- https://attack.mitre.org/techniques/T1021/008/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: SendSSHPublicKey
    userIdentity.type: AssumedRole
  condition: selection
falsepositives:
- Deployment pipelines that push keys as part of normal deployment work
level: medium

