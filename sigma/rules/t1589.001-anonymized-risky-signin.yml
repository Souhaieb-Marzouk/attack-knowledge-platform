title: Sign-In from Anonymizer or New Risky Device
id: ac7fd03d-abb9-4bfb-976d-45f6457fd308
status: experimental
description: Looks for a successful sign-in from an anonymizer or a new risky device. Useful after credential leaks or phishing-for-information campaigns.
references:
- https://attack.mitre.org/techniques/T1589/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1589.001
logsource:
  product: azure
  service: signinlogs
detection:
  selection_success:
    ResultType: '0'
  selection_risky_new_device:
    RiskLevelAggregated:
    - medium
    - high
    IsNewDevice: 'true'
  selection_anonymizer:
    RiskEventTypes_v2|contains: anonymizedIPAddress
  condition: selection_success and (selection_risky_new_device or selection_anonymizer)
fields:
- IsNewDevice
- ResultType
- RiskEventTypes_v2
- RiskLevelAggregated
falsepositives:
- Approved privacy VPN
- New laptop during onboarding
- Pen-test identity
level: high

