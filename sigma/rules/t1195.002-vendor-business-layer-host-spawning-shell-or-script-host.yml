title: Vendor Business Layer Host Spawning Shell or Script Host
id: 5ea55b93-32b7-428a-93ff-70c108176e2c
status: experimental
description: 'Detects a fleet-deployed vendor business layer service starting command shells, scripting hosts, or certificate utilities. This is the SolarWinds SUNBURST pattern: a trusted, signed service process acting as the parent of attacker commands.'
references:
- https://attack.mitre.org/techniques/T1195/002/
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-352a
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.execution
- attack.t1059
- attack.discovery
- attack.t1087
- attack.initial_access
- attack.t1195.002
logsource:
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith:
    - \VendorOps.BusinessLayerHost.exe
    - \SolarWinds.BusinessLayerHost.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \certutil.exe
  filter_support:
    CommandLine|contains: VendorOps.Support.Diagnostics.exe
  condition: selection_parent and selection_child and not filter_support
fields:
- ParentImage
- Image
- CommandLine
- User
- Computer
falsepositives:
- Documented vendor support sessions; verify each against a support ticket.
level: critical

