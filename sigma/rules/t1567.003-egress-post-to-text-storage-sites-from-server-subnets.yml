title: Egress POST to Text Storage Sites from Server Subnets
id: 7d4c9a31-8f2b-4e6a-9c15-3ab8e21d7f04
status: experimental
description: Detects HTTP POST requests to well-known paste and text storage domains from addresses classified as servers
  or infrastructure. A server that posts to a paste site is a strong T1567.003 exfiltration signal regardless of request size.
references:
- https://attack.mitre.org/techniques/T1567/003/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  sel_method:
    cs-method: POST
  sel_hosts:
    r-dns|endswith:
    - .pastebin.com
    - .paste.ee
    - .dpaste.org
    - .hastebin.com
    - .termbin.com
    - .gist.github.com
  filter_workstations:
    src_asset_class: workstation
  condition: sel_method and sel_hosts and not filter_workstations
fields:
- clientIp
- r-dns
- c-uri
- cs-method
- cs-bytes
- cs-User-Agent
falsepositives:
- Approved automation that posts release notes or status text to an approved paste service
- Documented administrator scripts covered by a change ticket
level: high
tags:
- attack.t1567.003
