title: Cryptocurrency Miner Started by Web Server or From Temp Path
id: 106b5cde-cc21-4784-9da3-5320163abbf3
status: experimental
description: Detects Linux process creation where the image name, temp-file path, or command line matches cryptocurrency miner
  patterns. Covers miners renamed and started by web-server processes, as seen in 8220 Gang and Kinsing campaigns. Maps to
  ATT&CK T1496.001 and analytic AN1490 of detection strategy DET0540.
references:
- https://attack.mitre.org/techniques/T1496/001/
- https://attack.mitre.org/techniques/T1496/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: linux
detection:
  selection_miner_name:
    Image|endswith:
    - /xmrig
    - /minerd
    - /cpuminer
    - /kinsing
    - /kdevtmpfsi
    - /kswapd0
  selection_pool_arg:
    CommandLine|contains:
    - stratum+tcp://
    - stratum+ssl://
    - --donate-level
    - -o pool.
  selection_web_parent:
    Image|startswith:
    - /tmp/
    - /var/tmp/
    - /dev/shm/
    ParentImage|endswith:
    - /httpd
    - /apache2
    - /nginx
    - /java
    - /php-fpm
  condition: 1 of selection_*
fields:
- Image
- CommandLine
- ParentImage
- User
- uid
falsepositives:
- Approved mining-research hosts (tag and exclude them)
- Build tools unpacked into /tmp by CI jobs
level: critical
tags:
- attack.t1496.001
