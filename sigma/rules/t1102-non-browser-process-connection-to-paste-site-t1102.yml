title: Non-Browser Process Connection to Paste Site (T1102)
id: 7f3c9a2e-4b1d-4e8f-9a2b-3c5d6e7f8a9b
status: experimental
description: Detects a Windows process that is not a web browser opening an outbound connection to a public paste site. Malware
  uses paste raw pages as a dead drop resolver (T1102.001) or as a low-profile command channel (parent T1102).
references:
- https://attack.mitre.org/techniques/T1102/
- https://attack.mitre.org/techniques/T1102/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_connection
  product: windows
detection:
  selection_process:
    Image|endswith:
    - \powershell.exe
    - \cmd.exe
    - \curl.exe
    - \wget.exe
    - \certutil.exe
    - \mshta.exe
    - \rundll32.exe
    Initiated: 'true'
  selection_destination:
    DestinationHostname|endswith:
    - .pastebin.com
    - .paste.ee
    - .ghostbin.com
    - .hastebin.com
    - .gist.githubusercontent.com
  condition: selection_process and selection_destination
fields:
- Image
- User
- DestinationHostname
- DestinationIp
- DestinationPort
falsepositives:
- Admin or CI scripts that download public text files for automation
- Approved monitoring tools that check public status or change pages
level: critical
tags:
- attack.t1102
