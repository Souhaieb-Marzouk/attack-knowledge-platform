title: DNS Name Resolved to Many Distinct IPs in One Hour (Fast Flux)
id: 9c1f7a2e-3d54-4b8a-9f6e-1c2d3e4f5a6b
status: experimental
description: Detects a single DNS name that returned more than 20 different IP addresses within one hour. Fast flux domains
  rotate A records very fast so that one name always points to a live relay. Content delivery networks behave in a similar
  way, so keep an allow list of known CDN names and network owners.
references:
- https://attack.mitre.org/techniques/T1568/001/
- The Honeynet Project research paper on Fast-Flux Service Networks
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: dns
  product: zeek
detection:
  selection_ok:
    rcode_name: NOERROR
  condition: selection_ok
  timeframe: 1h
fields:
- id.orig_h
- query
- answers
- TTLs
falsepositives:
- Large content delivery networks and round-robin load balancers
- Big mail providers with many A and MX records
level: high
tags:
- attack.t1568.001
