title: Repeated Calls to a Vendor Update Endpoint from an Unexpected Server
id: 9b3e6a12-47f5-4d0c-8e29-1c6b0d8a4104
status: experimental
description: 'Detects many HTTP calls to a vendor update path from one source in a short window. A trusted update channel that repeats on a fixed schedule can hide a beacon from a trojanized update. Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) > 12 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.003
logsource:
  category: network
  product: zeek
  service: http
detection:
  selection:
    host: update.vendorco.example
    uri|startswith: /update/
  filter_approved_relay:
    src_ip: 192.0.2.10
  condition: selection and not filter_approved_relay
  timeframe: 6h
falsepositives:
- A licensed local update mirror or proxy server that was never added to the allowlist
- A mass patch rollout during a change window
level: high

