title: Outbound TLS Session with Self-Signed Server Certificate
id: 7f3c2a91-4b8e-4d2a-9c65-8e1f0a53b7d4
status: experimental
description: Detects outbound TLS handshakes where the presented server certificate fails validation because it is self-signed.
  Attacker-run command and control servers often use their own public-key infrastructure, so a self-signed certificate on
  an internal client is a strong early signal for T1573.002.
references:
- https://attack.mitre.org/techniques/T1573/002/
- https://attack.mitre.org/techniques/T1573/
- Zeek ssl.log field reference (Corelight documentation)
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_connection
  product: zeek
  service: ssl
detection:
  selection:
    validation_status|contains: self signed
  filter_appliances:
    id.orig_h|startswith:
    - 10.99.
    - 10.98.
  condition: selection and not filter_appliances
fields:
- id.orig_h
- id.resp_h
- id.resp_p
- server_name
- subject
- issuer
- validation_status
falsepositives:
- Internal appliances, printers and lab devices with self-signed certificates
- Developer tools reaching local registries or test endpoints
level: medium
tags:
- attack.t1573.002
