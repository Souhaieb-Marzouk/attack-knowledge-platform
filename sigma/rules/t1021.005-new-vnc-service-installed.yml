title: New VNC Service Installed
id: d91b7f24-3e86-4a52-b1c7-8f0a5d3e6c74
status: stable
description: Detects the installation of a new Windows service with a VNC-related name. Attackers install
  VNC as a service for persistent full-desktop access on servers and point-of-sale terminals.
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Detection Engineering Team
date: '2026-10-27'
tags:
- attack.persistence
- attack.lateral-movement
- attack.t1021.005
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
    ServiceName|contains:
    - VNC
    - uvnc
    - tightvnc
    - tigervnc
    - winvnc
  condition: selection
falsepositives:
- A planned VNC rollout — match the hit against change tickets
level: high
