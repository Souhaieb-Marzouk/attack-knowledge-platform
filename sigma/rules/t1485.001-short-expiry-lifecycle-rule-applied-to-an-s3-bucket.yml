title: Short-Expiry Lifecycle Rule Applied to an S3 Bucket
id: 7c3e1a90-52b4-4f8e-9d61-3a0c8f5b21e4
status: experimental
description: Detects PutBucketLifecycleConfiguration calls that enable object expiration after one day or less. An attacker
  with the PutLifecycleConfiguration permission can use this to destroy all objects in a bucket on a timer, per MITRE ATT&CK
  T1485.001.
references:
- https://attack.mitre.org/techniques/T1485/001/
- https://www.cisa.gov/stopransomware
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: PutBucketLifecycleConfiguration
  short_expiry:
    requestParameters.LifecycleConfiguration.Rules[*].Expiration.Days|lte: 1
  condition: selection and short_expiry
fields:
- eventName
- requestParameters.bucketName
- userIdentity.arn
- sourceIPAddress
- userAgent
- awsRegion
falsepositives:
- Genuine cleanup jobs that expire short-lived test data after one day
- Approved storage automation rewriting lifecycle rules inside a change window
level: critical
tags:
- attack.t1485.001
