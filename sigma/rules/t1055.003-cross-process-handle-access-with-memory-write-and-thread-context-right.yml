title: Cross-Process Handle Access With Memory Write and Thread Context Rights
id: c7649a8d-2e62-440f-a183-d372f1adeac8
status: experimental
description: Detects a process opening another process with access rights that permit writing to its memory and manipulating its threads. This is the core primitive of thread execution hijacking, MITRE ATT&CK T1055.003. The thread-context change itself happens on a thread handle (OpenThread with THREAD_SET_CONTEXT 0x0010), which Sysmon Event ID 10 does not log as a separate event. The companion SPL adds a cross-process check (TargetImage != SourceImage) that basic Sigma field matching cannot express.
references:
- https://attack.mitre.org/techniques/T1055/003/
- https://github.com/SigmaHQ/sigma
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.003
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    GrantedAccess:
    - '0x1FFFFF'
    - '0x1F0FFF'
    - '0x143A'
    - '0x141A'
  filter_tools:
    SourceImage|endswith:
    - \procmon.exe
    - \procmon64.exe
    - \procexp.exe
    - \procexp64.exe
    - \x64dbg.exe
    - \x32dbg.exe
    - \windbg.exe
    - \MsSense.exe
    - \MsMpEng.exe
  condition: selection and not filter_tools
fields:
- SourceImage
- TargetImage
- GrantedAccess
- CallTrace
- SourceThreadId
falsepositives:
- Debuggers and profiling tools open other processes with the same rights.
- Endpoint security products read and write process memory during scans.
level: critical

