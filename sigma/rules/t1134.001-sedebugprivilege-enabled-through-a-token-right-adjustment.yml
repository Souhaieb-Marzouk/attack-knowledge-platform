title: SeDebugPrivilege Enabled Through a Token Right Adjustment
id: 3f1e8a2c-0004-4b6d-9c2e-5a7f8d9e0a04
status: experimental
description: Event 4700 records a token right adjustment. SeDebugPrivilege allows opening protected processes, which credential and token theft tools need.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: Souhaieb Marzouk
date: '2026-09-01'
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4700
    EnabledPrivileges|contains: SeDebugPrivilege
  condition: selection
falsepositives:
- UAC elevation prompts and service installs on admin workstations
level: medium
tags:
- attack.privilege-escalation
- attack.t1134.001

