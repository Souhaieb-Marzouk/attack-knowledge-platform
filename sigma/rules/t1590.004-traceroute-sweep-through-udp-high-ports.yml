title: Traceroute Sweep Through UDP High Ports
id: 91b4f7d2-3e6a-4c58-8a71-f0d29b5c16ae
status: stable
description: 'Detects bursts of UDP probes from one external source to the classic traceroute ports (33434
  and above). Zeek logs the probes as short connections with no service. Extend the port list if your
  sensors see other traceroute styles, such as ICMP-based probes. Detection note: this is the event-level
  half. Apply the SIEM threshold count(id.orig_h) > 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/004/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.004
logsource:
  category: network
  product: zeek
detection:
  selection:
    proto: udp
    id.resp_p:
    - '33434'
    - '33435'
    - '33436'
    - '33437'
    - '33438'
  condition: selection
falsepositives:
- Path measurement by your own monitoring team
- Network research or latency probes from trusted partners
level: medium
