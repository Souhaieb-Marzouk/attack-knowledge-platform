title: External RDP Probe
id: 973b294f-46a4-4f2d-9555-19e9459811e1
status: experimental
description: Detects an external RDP probe denied by the firewall. A single event is weak; correlate with repeated attempts from the same source.
references:
- https://attack.mitre.org/techniques/T1595/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1595.001
logsource:
  category: firewall
  product: paloalto
detection:
  selection:
    dest_port: 3389
    action: deny
  condition: selection
fields:
- action
- dest_port
falsepositives:
- Authorized external pen test
- Employee using an approved RDP gateway
- Internet background noise
level: medium

