title: Raw Physical Drive Access from Untrusted Path
id: 3b8a1e52-6f4d-4c31-9a27-8d5c2f0b41e7
status: experimental
description: Detects any process opening a raw physical disk device, the signature move of structure-wipe malware such as
  NotPetya. Excludes software installed under Program Files (backup and imaging tools).
references:
- https://attack.mitre.org/techniques/T1561/002/
- https://attack.mitre.org/software/S0368/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: raw_access_thread
  product: windows
detection:
  selection:
    EventID: 9
    Device|contains: \Device\Harddisk
  filter_admin_paths:
    Image|startswith:
    - C:\Program Files\
    - C:\Program Files (x86)\
  condition: selection and not filter_admin_paths
fields:
- Computer
- Image
- Device
- ProcessGuid
falsepositives:
- Disk imaging and backup agents installed outside Program Files
- Defragmentation and storage utilities run from removable media
level: critical
tags:
- attack.t1561.002
