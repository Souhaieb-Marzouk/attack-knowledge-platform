title: Delivered Inbound Reply-Style Message (Hunt for Unknown Sender Domains)
id: 92540ec6-01b3-4a79-9f4a-9f4a5b6c7d89
status: experimental
description: 'Detects inbound delivered mail whose subject starts with RE: or FW: for analyst review. The rule itself does not check the sender, so join it with your partner-domain list to surface messages whose sender domain is not a known partner. Thread hijacking hides phishing links inside real conversations; the subject style and the new domain together break the illusion.'
references:
- https://attack.mitre.org/techniques/T1566/
- https://krebsonsecurity.com/2024/03/thread-hijacking-phishes-that-prey-on-your-curiosity/
author: Souhaieb Marzouk
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.t1566.002
logsource:
  product: m365
  service: audit
  definition: Exchange Online message trace records, normalized for SIEM ingestion
detection:
  selection_subject:
    Subject|startswith:
    - 'RE:'
    - 'FW:'
  selection_inbound:
    Direction: Inbound
    Status: Delivered
  condition: selection_subject and selection_inbound
falsepositives:
- Every genuine external reply; this rule is a hunt-and-tune worklist, not a pager alert.
- Newsletter digests that use RE: style subjects; exclude known marketing senders.
level: medium

