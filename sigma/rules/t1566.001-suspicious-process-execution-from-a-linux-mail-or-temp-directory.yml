title: Suspicious Process Execution from a Linux Mail or Temp Directory
id: 3a9f1b47-5e2d-4c38-9a61-4f7e8b9c0d10
status: experimental
description: 'Implements the Linux part of the official ATT&CK analytic AN0656: links email delivery to later process execution from mail directories. Works with Sysmon for Linux, osquery process_events, or any Linux EDR that fills the process_creation fields.'
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_exec:
    Image|endswith:
    - /bash
    - /sh
    - /zsh
    - /python3
    - /perl
    - /ruby
    - /curl
    - /wget
  selection_location:
    CurrentDirectory|contains:
    - /.thunderbird
    - /.mozilla
    - /.local/share/Trash
    - /Downloads
    - /tmp
  filter_package_tools:
    CommandLine|contains:
    - apt-get
    - dnf install
    - yum install
  condition: selection_exec and selection_location and not filter_package_tools
falsepositives:
- Users running scripts from their Downloads folder, and software installers unpacked to /tmp. Review by user and by command line.
level: medium

