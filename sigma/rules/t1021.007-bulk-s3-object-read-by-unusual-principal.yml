title: Bulk S3 Object Read by Unusual Principal
id: f6d3b9c8-15a2-4e67-8b03-9d4e7f1a3c62
status: stable
description: 'Detects 1000 or more S3 GetObject events by one principal within 30 minutes, excluding known
  backup roles. Matches the bulk exfiltration pattern of the 2024 stolen-credential data theft campaigns.
  Requires S3 data events. Detection note: this is the event-level half. Apply the SIEM threshold count(userIdentity.arn)
  >= 1000 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.collection
- attack.lateral-movement
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetObject
    eventSource: s3.amazonaws.com
  filter_backup:
    userIdentity.arn|endswith: :role/svc-backup-reader
  condition: selection and not filter_backup
  timeframe: 30m
falsepositives:
- Large data exports and analytics jobs that read whole buckets
- Backup or replication tools not yet on the filter list
level: high
