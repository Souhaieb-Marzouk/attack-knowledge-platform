title: High NXDOMAIN burst from one client
id: 3f7c2a91-6b4d-4e08-9a52-1c7d84e6f3b0
status: experimental
description: Detects a client that receives many NXDOMAIN answers for random-looking external names within five minutes. This
  fits a domain generation algorithm trying many candidate C2 names, for example ransomware searching for a live failover
  channel.
references:
- https://attack.mitre.org/techniques/T1568/
- https://attack.mitre.org/techniques/T1568/002/
- 'Practice reference: DNS analytics guides recommend watching NXDOMAIN ratios per client'
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: dns
  product: zeek
detection:
  selection:
    rcode_name: NXDOMAIN
    query|re: (?i)([a-z0-9]{8,})\.(com|net|org|info|biz|top|xyz)$
  filter_internal:
    query|endswith:
    - .internal
    - .corp
    - .local
    - .in-addr.arpa
  condition: selection and not filter_internal
  timeframe: 5m
fields:
- src_ip
- query
- rcode_name
falsepositives:
- A browser or security tool that pre-fetches many dead names
- A misconfigured application that looks up a rotating list of removed hosts
level: high
tags:
- attack.t1568
