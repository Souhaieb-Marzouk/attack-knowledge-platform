title: Proxy Beacon Periodicity to One External Host
id: 3f7a1c92-8d54-4b2e-9f61-a0b7c8d9e1f2
status: experimental
description: Detects one internal host that sends many HTTP POST requests to the same external host in a short window, with
  a stable response size. This is the classic HTTPS C2 beacon pattern used by T1071 operators.
references:
- https://attack.mitre.org/techniques/T1071/
- https://github.com/SigmaHQ/sigma
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network
  product: proxy
detection:
  selection:
    cs_method: POST
    sc_status: 200
  filter_internal:
    cs_host|endswith:
    - .corp-fin.local
    - .corp-fin.internal
  condition: selection and not filter_internal
  timeframe: 15m
fields:
- c_ip
- cs_method
- cs_host
- cs_uri_stem
- sc_status
- sc_bytes
falsepositives:
- Update and monitoring agents that poll on a fixed schedule
- Backup or sync clients uploading many similar parts
level: high
tags:
- attack.t1071
