title: Mobile User Agent Reaches Look-Alike Login Page
id: 6f217b93-de80-4d46-ac1d-ac1d2e3f4a56
status: experimental
description: Detects a mobile browser opening a login-shaped page on a host that mimics Microsoft-style sign-in naming but is not Microsoft. QR-code phishing pushes victims to exactly this flow on their phones.
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/002/
author: Souhaieb Marzouk
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.credential-access
- attack.t1555
- attack.t1566.002
logsource:
  category: proxy
  definition: Web proxy or Zeek http logs normalized with ECS field names
detection:
  selection_ua:
    c-useragent|contains:
    - iPhone
    - Android
    - Mobile/
  selection_uri:
    c-uri|contains:
    - m365-verify
    - sso-secure
    - owa-login
    - account-verify
  selection_host:
    r-dns|contains:
    - m365-verify
    - sso-secure
    - owa-login
    - account-verify
  condition: selection_ua and (selection_uri or selection_host)
falsepositives:
- Your own SSO portals if their URLs contain these tokens; exclude them first.
- Genuine Microsoft sign-in pages reached from phones; anchor the rule to your domain allowlist.
level: medium

