title: Urgent Payment Change from External Sender
id: df9cad69-7b19-479f-be90-122a4404f5b4
status: experimental
description: Looks for an external payment-change message with urgent wording. Common BEC pattern, but finance teams do get real urgent bank change requests.
references:
- https://attack.mitre.org/techniques/T1591/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1591.003
logsource:
  category: email
  product: mail_gateway
detection:
  selection_payment:
    subject|contains:
    - bank details
    - payment change
    - wire transfer
    - remittance
    - banking information
  selection_urgency:
    subject|contains:
    - urgent
    - immediately
    - today
    - asap
    - before close
  filter_internal:
    sender_domain|endswith: aureliapay.example
  condition: selection_payment and selection_urgency and not filter_internal
fields:
- sender_domain
- subject
falsepositives:
- Bank or payment provider using urgent language
- Internal finance team on an approved domain
- Vendor change notice
level: high

