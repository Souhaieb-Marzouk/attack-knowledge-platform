title: Suspicious Discord Webhook URL in Process Command Line
id: 7c1e4a2f-9b3d-4e86-a51c-0d2f6b8e4a17
status: experimental
description: Detects process creations whose command line references a Discord webhook URL, a common exfiltration channel
  for info stealers and loaders.
references:
- https://attack.mitre.org/techniques/T1567/004/
- https://discord.com/developers/docs/resources/webhook
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection:
    CommandLine|contains|all:
    - discord.com
    - /api/webhooks/
  filter_browsers:
    Image|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
  condition: selection and not filter_browsers
fields:
- Image
- CommandLine
- ParentImage
- User
- Hashes
falsepositives:
- Approved internal automation that posts build or monitor notices to a company Discord channel via a documented webhook.
- Security tooling that quarantines or analyzes malicious URLs in a command line.
level: high
tags:
- attack.t1567.004
