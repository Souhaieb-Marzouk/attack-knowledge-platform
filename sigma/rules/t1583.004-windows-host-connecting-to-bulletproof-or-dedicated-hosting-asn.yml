title: Windows Host Connecting to Bulletproof or Dedicated-Hosting ASN
id: ae012aa2-610b-4888-bae8-4a4109fbd08d
status: experimental
description: Detects an endpoint process opening a network connection whose destination IP belongs to an ASN classified as bulletproof or dedicated hosting by the intel enrichment pipeline. Such infrastructure is commonly acquired under MITRE ATT&CK T1583.004 to run C2 panels and malware repositories.
references:
- https://attack.mitre.org/techniques/T1583/004/
- https://www.spamhaus.org/sbl/
- https://cinsscore.com/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1583
- attack.t1583.004
logsource:
  category: network_connection
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationAsnClass|contains:
    - bulletproof-hosting
    - dedicated-hosting
  filter_private:
    DestinationIp|startswith:
    - '10.'
    - 192.168.
    - 172.16.
    - '127.'
  condition: selection and not filter_private
fields:
- EventID
- Image
- User
- DestinationIp
- DestinationPort
- DestinationAsnClass
falsepositives:
- Approved backup, replication, or RMM tooling that runs in the same hosting ASN
- A business partner SaaS hosted on dedicated servers without its own ASN
level: high

