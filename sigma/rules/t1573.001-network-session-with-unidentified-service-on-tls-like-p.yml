title: Network Session with Unidentified Service on TLS-Like Port
id: 7d3a2f61-9c4b-4e28-a1d5-3f86b0e91c47
status: experimental
description: Detects TCP sessions to ports that normally speak TLS where the network sensor could not identify any application
  protocol. Symmetric-key command and control channels (T1573.001) often use a custom framing protocol with no TLS handshake,
  so the service field stays empty. Requires Zeek conn logging or an equivalent sensor.
references:
- https://attack.mitre.org/techniques/T1573/001/
- https://attack.mitre.org/techniques/T1573/
- Network sensor documentation for the conn.log service field
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_connection
  product: zeek
  service: conn
detection:
  selection:
    service: '-'
    id.resp_p:
    - 443
    - 8443
    - 993
    - 995
    - 465
    orig_bytes|gte: 10000
  condition: selection
fields:
- id.orig_h
- id.resp_h
- id.resp_p
- service
- orig_bytes
- resp_bytes
- duration
- proto
falsepositives:
- Legacy or proprietary applications that speak nonstandard protocols on 443
- Internal admin tools without TLS on 8443
- Misconfigured services deployed on TLS-like ports
level: high
tags:
- attack.t1573.001
