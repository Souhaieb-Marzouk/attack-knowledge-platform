title: Linux Proc Memory File Opened With Write Access
id: 53364c16-9f33-4fda-b484-5b7b70aecadf
status: experimental
description: Detects a process opening /proc/<pid>/mem with write access (O_WRONLY or O_RDWR) and success. On Linux, /proc/<pid>/mem is the procfs view of a process memory. A successful write-flags open by a non-debugger process is the core step of T1055.009 (Proc Memory) injection and is rare in normal operations.
references:
- https://attack.mitre.org/techniques/T1055/009/
- https://man7.org/linux/man-pages/man5/proc.5.html
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.009
logsource:
  product: linux
  service: auditd
detection:
  selection_open:
    event.action:
    - open
    - openat
    - openat2
  selection_target:
    file.path|startswith: /proc/
    file.path|endswith: /mem
  selection_success:
    event.outcome: success
  filter_debuggers:
    process.name:
    - gdb
    - strace
    - lldb
  filter_profiler:
    process.name: profiler-agent
  condition: selection_open and selection_target and selection_success and not 1 of filter_*
fields:
- host.name
- process.name
- process.command_line
- user.auid
- user.uid
- user.euid
- file.path
falsepositives:
- Debuggers and tracing tools used by developers on build hosts.
- Core dump and memory forensics tooling run by incident responders.
- Profiling or APM agents that read process memory for diagnostics.
level: high

