title: Cobalt Strike Default Named Pipes or Beacon File Names
id: fb247fb2-dca9-461f-918b-eb84ce6bc680
status: experimental
description: Detects the default named pipes and default executable file names of Cobalt Strike beacons. Cracked or trial builds of the commercial framework often keep these defaults, so the rule also catches tooling obtained through resource development (MITRE ATT&CK T1588, T1588.002).
references:
- https://attack.mitre.org/techniques/T1588/002/
- https://attack.mitre.org/software/S0154/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.002
- attack.command-and-control
logsource:
  product: windows
  service: sysmon
detection:
  selection_pipe_created:
    EventID: 17
    PipeName|contains:
    - \MSSE-
    - \postex_
    - \status_
  selection_pipe_connected:
    EventID: 18
    PipeName|contains:
    - \MSSE-
    - \postex_
    - \status_
  selection_file:
    EventID: 11
    TargetFilename|endswith:
    - \beacon.exe
    - \artifact.exe
    - \artifact64.exe
  condition: 1 of selection_*
fields:
- PipeName
- Image
- TargetFilename
- Hashes
- User
falsepositives:
- Authorized penetration tests that run Cobalt Strike with its default listener profile
- Rare legitimate software that creates pipes with matching names (review the creating process)
level: critical

