title: Share Enumeration Burst from a Single Source
id: c9a3d7e1-4f82-49c6-b5d0-8a1e4f2c6b37
status: experimental
description: 'Detects one source connecting to the IPC$ share on many hosts within 10 minutes. Tools do this to map which servers expose shares. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5140
    ShareName|endswith: \IPC$
  timeframe: 10m
  condition: selection
falsepositives:
- Monitoring and patch agents that check services on many hosts
- Approved vulnerability scanners
level: medium

