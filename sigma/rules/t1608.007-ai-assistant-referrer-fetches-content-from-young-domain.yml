title: AI Assistant Referrer Fetches Content from Young Domain
id: e7373a16-9b16-45d3-af1c-ccc69db67411
status: experimental
description: Detects proxy requests where the referrer is a known AI assistant or AI search host and the destination domain is only a few days old. Public research (Netcraft, Lasso Security) shows poisoned AI citations route users exactly this way, so the referrer-plus-age join is the earliest reliable web signal for T1608.007.
references:
- https://attack.mitre.org/techniques/T1608/007/
- https://attack.mitre.org/techniques/T1608/006/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.007
logsource:
  category: proxy
detection:
  selection_referrer:
    referrer|contains:
    - assistant.
    - ai-search
    - chat.openai.com
    - perplexity.ai
    - copilot.microsoft.com
    - gemini.google.com
  selection_age:
    domain_age_days|lt: 30
  condition: all of selection_*
fields:
- site
- c-uri
- referrer
- src_ip
- user
- url_category
- domain_age_days
falsepositives:
- Users who genuinely research through AI tools and land on brand-new but legitimate sites.
level: high

