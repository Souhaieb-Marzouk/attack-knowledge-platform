title: Security Service Stopped After Remote VNC Session
id: 7c5d9e18-2b64-4a73-8c21-6d0f4b9e5a37
status: stable
description: 'Detects a security or antivirus service entering the stopped state. Correlate with an inbound
  or active session on port 5900 within the timeframe: an attacker controlling the desktop through VNC
  is the usual reason protection turns off without a change ticket.'
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Detection Engineering Team
date: '2026-10-27'
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.005
- attack.t1562.001
logsource:
  product: windows
  service: system
detection:
  selection_stop:
    EventID: 7036
    Provider_Name: Service Control Manager
    param2|contains: stopped
  selection_service:
    param1|contains:
    - avservice
    - antivirus
    - defender
    - sentinel
    - edr
  condition: selection_stop and selection_service
falsepositives:
- A documented upgrade or troubleshooting session for the security product
level: high
