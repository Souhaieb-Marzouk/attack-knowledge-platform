title: Questionnaire Attachment from External Sender
id: 63e5faaa-df07-4c46-b7f3-f048e3bcf500
status: experimental
description: Detects external mail with a questionnaire, survey, or compliance form attached. The attachment itself may be harmless; the goal is usually to get data or a click.
references:
- https://attack.mitre.org/techniques/T1598/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1598.002
logsource:
  product: m365
  service: exchange
detection:
  selection_subject:
    Subject|contains:
    - questionnaire
    - survey
    - security review
    - access review
    - compliance form
  selection_attachment:
    AttachmentData.FileType|contains:
    - pdf
    - docx
  filter_internal:
    SenderEmailAddress|endswith: '@corp.example'
  condition: selection_subject and selection_attachment and not filter_internal
fields:
- AttachmentData.FileType
- SenderEmailAddress
- Subject
falsepositives:
- Approved vendor-risk questionnaire
- Customer security review
- Internal audit sending from a shared mailbox
level: medium

