title: VNC Persistence via Registry Run Key
id: 48c2e6f9-7a13-4d85-9b04-2e6f8a1c3d92
status: stable
description: Detects a write to a Windows Run autorun key whose stored value references VNC. Rogue VNC
  servers use Run keys to restart at every login without needing a service or admin rights.
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Detection Engineering Team
date: '2026-10-27'
tags:
- attack.persistence
- attack.lateral-movement
- attack.t1021.005
- attack.t1547.001
logsource:
  product: windows
  service: sysmon
detection:
  selection_run:
    EventID: 13
    TargetObject|contains: \CurrentVersion\Run
  selection_vnc:
    Details|contains: vnc
  condition: selection_run and selection_vnc
falsepositives:
- An approved VNC installation that registers itself in Run (move it to a service and allow-list it)
level: high
