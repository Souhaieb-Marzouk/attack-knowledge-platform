title: RDP Session Hijack with Tscon
id: e47c8b02-5a19-4d3e-8f27-c0b9d4e1a855
status: stable
description: 'Detects tscon.exe called with a /dest: parameter. Attackers with SYSTEM rights use this
  to redirect another user''s active RDP session to their own screen, taking over the session without
  knowing the password.'
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.001
- attack.t1563.002
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 1
    Image|endswith: \tscon.exe
    CommandLine|contains: '/dest:'
  condition: selection
falsepositives:
- Very rare; some admin scripts that cleanly move sessions
level: high
