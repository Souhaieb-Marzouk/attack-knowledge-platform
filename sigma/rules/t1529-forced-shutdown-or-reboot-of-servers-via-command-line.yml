title: Forced Shutdown or Reboot of Servers via Command Line
id: a7e3f1b2-4c5d-4e8f-9a01-2b3c4d5e6f70
status: experimental
description: Detects forced shutdown and restart commands on servers using shutdown.exe, PowerShell, or wmic. Destructive
  malware such as APT37 tools and Black Basta use these commands to drop sessions and trigger boot-level payloads.
references:
- https://attack.mitre.org/techniques/T1529/
- https://www.cisa.gov/stopransomware
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection_shutdown_reboot:
    EventID: 1
    Image|endswith: \shutdown.exe
    CommandLine|contains: ' /r'
  selection_shutdown_poweroff:
    EventID: 1
    Image|endswith: \shutdown.exe
    CommandLine|contains: ' /s'
  selection_powershell_restart:
    EventID: 1
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains|all:
    - restart-computer
    - -force
  selection_powershell_stop:
    EventID: 1
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains|all:
    - stop-computer
    - -force
  selection_wmic:
    EventID: 1
    Image|endswith: \wbem\WMIC.exe
    CommandLine|contains|all:
    - os where
    - reboot
  condition: 1 of selection_*
fields:
- CommandLine
- ParentImage
- User
- Hostname
falsepositives:
- Administrators running planned reboots inside an approved change window
level: high
tags:
- attack.t1529
