title: Lookalike Login Certificate for Brand
id: b751ac4a-30b0-4f18-9676-857fb5b5a94c
status: experimental
description: Looks for a new certificate that contains our brand and an auth word like login, sso, vpn, or mail on a domain we do not own. Check the certificate owner before blocking.
references:
- https://attack.mitre.org/techniques/T1597/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1597
logsource:
  category: application
  product: ctlog_monitor
  service: brand_watch
detection:
  selection_brand:
    dns_names|contains: example-corp
  selection_auth:
    dns_names|contains:
    - login
    - sso
    - vpn
    - mail
    - auth
  filter_owned:
    dns_names|endswith:
    - .example-corp.com
    - .examplecorp-partner.net
  condition: selection_brand and selection_auth and not filter_owned
fields:
- dns_names
falsepositives:
- Partner certificate using the brand
- Brand migration domain
- Certificate for an approved subsidiary
level: high

