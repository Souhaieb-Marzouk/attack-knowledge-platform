title: Inbound VNC Port from Unusual Source
id: 6e1f2a34-8c05-4b7e-9a12-3f4d5c6b7e80
status: stable
description: Detects an inbound network connection to VNC ports 5900-5906 whose source is not an approved
  support network. Internet-exposed VNC servers with weak legacy passwords are a common retail and kiosk
  foothold.
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Detection Engineering Team
date: '2026-10-27'
tags:
- attack.lateral-movement
- attack.t1021.005
logsource:
  category: network_connection
  product: windows
detection:
  selection_dst:
    DestinationPort:
    - 5900
    - 5901
    - 5902
    - 5903
    - 5904
    - 5905
    - 5906
    Initiated: 'false'
  filter_support:
    SourceIp|startswith:
    - 198.51.100.
  condition: selection_dst and not 1 of filter_*
falsepositives:
- A new support vendor subnet that is not on the allow list yet
- An internal vulnerability scanner checking 5900
level: high
