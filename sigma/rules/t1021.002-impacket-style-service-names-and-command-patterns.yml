title: Impacket-Style Service Names and Command Patterns
id: 6f1c3b8e-5a29-4e04-a7d1-9b2c4e6f0a83
status: experimental
description: Detects known impacket executor service names in 7045 and the cmd.exe quiet-mode patterns those tools type into 4688.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  sel_service:
    EventID: 7045
    ServiceName|contains:
    - BTOBTO
    - enigma
  sel_cmd:
    EventID: 4688
    CommandLine|contains:
    - cmd.exe /Q /c
    - 2>&1
  condition: 1 of sel_*
falsepositives:
- Admin scripts that reuse the same quiet-mode command style
- Backup agents with short random service names
level: high

