title: Log4Shell JNDI String in Request
id: 71c3a6e1-9a26-4ceb-91d8-dd38044cabd4
status: experimental
description: Looks for a Log4Shell JNDI string in a web request. Most internet noise is opportunistic; check whether the target is vulnerable.
references:
- https://attack.mitre.org/techniques/T1595/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1595.002
logsource:
  category: webserver
  product: apache
detection:
  selection:
    cs-uri-query|contains: '${jndi:'
  condition: selection
fields:
- cs-uri-query
falsepositives:
- WAF test payload
- Authorized vuln scan
- Security training lab
level: critical

