title: Cloud Traffic Mirror Session Created or Modified
id: 8f4d2c61-9a30-4b7e-b5d1-2e6c8a94f001
status: experimental
description: Detects creation, modification, or deletion of traffic mirror resources in AWS CloudTrail. An attacker with a
  cloud network role can copy whole subnets to a mirror target they control with one API call. Azure vTap and GCP packetMirroring
  (packetMirrors.insert) are the equivalents - apply the same logic to those providers' audit logs. Maps to ATT&CK analytic
  AN1131 (mirror policy changes to unapproved destinations).
references:
- https://attack.mitre.org/techniques/T1020/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_events:
    eventName:
    - CreateTrafficMirrorSession
    - CreateTrafficMirrorTarget
    - CreateTrafficMirrorFilter
    - ModifyTrafficMirrorSession
    - DeleteTrafficMirrorSession
  filter_approved_roles:
    userIdentity.arn|contains:
    - role/netops-mirroring
    - user/packet-broker-admin
  condition: selection_events and not filter_approved_roles
fields:
- eventTime
- eventName
- userIdentity.arn
- sourceIPAddress
- requestParameters.networkInterfaceId
- requestParameters.trafficMirrorTargetId
falsepositives:
- Network team mirroring sessions created inside approved change windows
level: high
tags:
- attack.t1020.001
