title: AWS EC2 Serial Console SSH Public Key Sent
id: e7b2d9f4-6a1c-45d9-b8e3-0f4a7c2d6b91
status: stable
description: Detects a key push for the EC2 Serial Console. The serial console is a root-level recovery
  door that works even when networking is broken, so any use deserves a page to a human.
references:
- https://attack.mitre.org/techniques/T1021/008/
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-serial-console.html
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: SendSerialConsoleSSHPublicKey
  condition: selection
falsepositives:
- Documented break-glass recovery procedures with a change ticket
level: high
