title: AWS EC2 Instance Connect Endpoint Created
id: a3f6c2e1-9b4d-4e87-a1c5-6f2d8b0e7c93
status: experimental
description: Detects the creation of an EC2 Instance Connect Endpoint. This API is a direct change to the private network path of a VPC and is rare in most accounts. Attackers who hold a valid IAM role use it to reach private VMs without a public IP or VPN.
references:
- https://attack.mitre.org/techniques/T1021/008/
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-instance-connect-endpoint.html
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: CreateInstanceConnectEndpoint
  condition: selection
falsepositives:
- Approved infrastructure-as-code pipelines creating endpoints during change windows
level: critical

