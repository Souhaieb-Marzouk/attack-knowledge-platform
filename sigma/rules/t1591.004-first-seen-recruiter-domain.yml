title: New Recruiter Domain Mailing Staff
id: d949d95a-cb6a-427a-9d57-3db35bacef82
status: experimental
description: Flags a first-seen domain sending recruiter mail to staff. Recruiter pretexts are used to learn roles and reporting lines.
references:
- https://attack.mitre.org/techniques/T1591/004/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1591.004
logsource:
  category: email
  product: mail_gateway
detection:
  selection:
    subject|contains:
    - opportunity
    - recruiter
    - hiring
    - position
    disposition: delivered
    new_domain: true
  condition: selection
fields:
- disposition
- new_domain
- subject
falsepositives:
- New recruiting agency
- First contact from an industry recruiter
- Job board using a new domain
level: medium

