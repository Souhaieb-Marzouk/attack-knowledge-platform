title: Mass WinRM Network Connections from One Source
id: 3a5b7c0e-8945-489a-b581-c0360d775f1f
status: stable
description: 'Detects one machine opening WinRM connections (TCP 5985 or 5986) to five or more different
  targets within ten minutes. This is the network shape of an Invoke-Command sweep across many servers.
  Check the source against the admin tier before you judge it, because patching tools also fan out. Detection
  note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.006
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationPort:
    - 5985
    - 5986
  condition: selection
  timeframe: 10m
falsepositives:
- Patching, monitoring, and backup servers that legitimately use remoting
level: high
