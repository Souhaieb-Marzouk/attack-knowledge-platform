title: Inbound Flood of UDP DNS Replies on the Victim Edge
id: 6e1d8b3a-9c4f-4a2d-a6b8-1f7e3c5d9b20
status: experimental
description: 'Detects a DNS amplification flood from the victim''s point of view: thousands of inbound UDP packets with source
  port 53 arriving within one minute. The victim never sent matching queries, so this reply storm is unsolicited attack traffic
  generated by abused open resolvers.'
references:
- https://attack.mitre.org/techniques/T1498/002/
- https://www.cisa.gov/uscert/ncas/alerts/TA14-017A
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: firewall
detection:
  selection:
    proto: udp
    src_port: 53
  timeframe: 1m
  condition: selection
fields:
- src_ip
- dst_ip
- src_port
- rcvdbyte
falsepositives:
- Heavy legitimate DNS environments with misconfigured clients
- A shared NAT gateway aggregating many internal resolvers
level: critical
tags:
- attack.t1498.002
