title: PsExec-Style Remote Service Install
id: a7c1e4f8-2b93-4d05-8f6c-9d3e1a2b7c40
status: experimental
description: Detects the default service name of PsExec and short random service names that remote execution tools create over admin shares.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection_psexec:
    EventID: 7045
    ServiceName|contains: PSEXESVC
  selection_random:
    EventID: 7045
    ServiceName|re: (?i)^[a-z]{4,8}\d{0,2}$
  condition: 1 of selection_*
falsepositives:
- Legitimate PsExec use by administrators
- Software that installs short-named services during deployment
level: high

