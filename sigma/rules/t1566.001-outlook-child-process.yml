title: Suspicious Child Process Spawned by Outlook or Office
id: 7a3b9f2e-4c81-4d6e-9a2b-1f5c8e7d4a01
status: stable
description: Detects Office and Outlook applications spawning script or shell child processes, a common follow-up behavior after a user opens a malicious spearphishing attachment.
references:
  - https://attack.mitre.org/techniques/T1566/001/
author: "Souhaieb Marzouk"
date: 2026-09-26
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\OUTLOOK.EXE'
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate mail-merge or line-of-business automation that launches scripts from Office
level: high