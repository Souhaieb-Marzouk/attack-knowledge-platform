title: New Okta MFA Factor
id: dc04f373-e460-4df6-a99b-45440072327d
status: experimental
description: Looks for a new MFA factor being activated in Okta. Account compromise often ends with the attacker adding their own factor.
references:
- https://attack.mitre.org/techniques/T1586/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1586
logsource:
  category: application
  product: okta
  service: okta
detection:
  selection_activate:
    eventType: user.mfa.factor.activate
  condition: selection_activate
fields:
- eventType
falsepositives:
- User enrolling a replacement phone
- Help desk resetting MFA
- Approved security-key rollout
level: medium

