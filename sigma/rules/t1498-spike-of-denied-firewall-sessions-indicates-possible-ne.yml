title: Spike of Denied Firewall Sessions Indicates Possible Network Flood
id: 7c1e4a2f-9b3d-4e6f-8a5c-1d2f3a4b5c60
status: experimental
description: Detects an abnormal number of denied or blocked sessions at the network edge within a short window. A network
  denial of service sends traffic the edge must drop, so a sharp deny-count rise is a strong early indicator for T1498 and
  its sub-techniques T1498.001 and T1498.002.
references:
- https://attack.mitre.org/techniques/T1498/
- https://www.cisa.gov/uscert/ncas/alerts/TA14-017A
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: firewall
detection:
  selection:
    action|contains:
    - deny
    - block
    - drop
  timeframe: 5m
  condition: selection
fields:
- action
- src_ip
- dst_ip
- dst_port
- proto
falsepositives:
- Busy internet edges drop many packets during normal traffic peaks
- Large scheduled backup or replication jobs crossing the firewall
- Vulnerability scanners hitting many hosts at once
level: high
tags:
- attack.t1498
