title: New Sender Domain with Company Pretext
id: 3dc03b5d-4bd2-4aea-b570-6da7c4fb80b9
status: experimental
description: Flags mail from a domain registered less than 30 days ago that uses a company or job pretext. Check the domain age source before trusting the alert.
references:
- https://attack.mitre.org/techniques/T1591/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1591
logsource:
  category: email
  product: mail_gateway
detection:
  selection_age:
    sender_domain_age_days|lt: 30
  selection_pretext:
    subject|contains:
    - Grandview
    - Alvarez
    - job offer
    - interview
  selection_delivered:
    disposition: delivered
  condition: selection_age and selection_pretext and selection_delivered
fields:
- disposition
- sender_domain_age_days
- subject
falsepositives:
- New recruiting partner domain
- New subsidiary domain
- Mail from a company acquisition
level: medium

