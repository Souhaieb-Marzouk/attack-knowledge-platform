title: Executive Name from New Domain
id: ae465fdc-38b1-4fed-94fe-f3369edb27e3
status: experimental
description: Looks for a first-contact email that uses an executive display name from a new domain. Verify with the executive through a known channel.
references:
- https://attack.mitre.org/techniques/T1683/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1683
logsource:
  category: email
  product: proofpoint
  service: tap
detection:
  selection_exec:
    display_name|contains:
    - CFO
    - CEO
    - Chief Financial
    - Finance Director
    - President
  selection_first_contact:
    first_contact: 'true'
  selection_new_domain:
    domain_age_days|lt: 30
  filter_internal:
    sender_domain|endswith: yourcompany.com
  condition: selection_exec and selection_first_contact and selection_new_domain and not filter_internal
fields:
- display_name
- domain_age_days
- first_contact
- sender_domain
falsepositives:
- New executive assistant using a personal domain
- External board member
- Recruiter using an executive name
level: high

