title: DNS Probing of Infrastructure Subdomains
id: a3d84e92-6c15-4f07-9b48-e2d6a0c7f153
status: stable
description: 'One external source asks the public DNS server for many infrastructure subdomains such as
  vpn, mail, owa, and autodiscover in a short time. This is a classic sign of DNS-based network reconnaissance
  (MITRE ATT&CK T1590). Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip)
  > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590
logsource:
  category: dns
  product: bind
  service: queries
detection:
  selection_name:
    qname|startswith:
    - vpn.
    - mail.
    - owa.
    - autodiscover.
    - webmail.
    - remote.
  selection_zone:
    qname|endswith: .example.com
  filter_internal:
    src_ip|startswith:
    - '10.'
    - 172.16.
    - 192.168.
  condition: selection_name and selection_zone and not filter_internal
  timeframe: 10m
falsepositives:
- Internal monitoring hosts that check remote-access names
- Bulk mail or backup systems that resolve many names
level: medium
