title: Process Creation from Transient Location (Possible Doppelgänging Loader)
id: 3f846ca8-296b-475d-a71d-bda9ec7b8c3d
status: experimental
description: Detects process creation where the reported image sits in a user-writable or transient folder. During Process Doppelgänging the backing file is rolled back, so the on-disk path stops resolving moments later. Join this event with a file inventory or an EDR existence check to confirm that the image is gone.
references:
- https://attack.mitre.org/techniques/T1055/013/
- https://www.securelist.com/synack-ransomware-tries-its-hand-at-process-doppelganging/85181/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.013
logsource:
  product: windows
  service: sysmon
detection:
  sel_event:
    EventCode: 1
  sel_image:
    Image|contains:
    - \Users\Public\
    - \ProgramData\
    - \Windows\Temp\
    - \AppData\Local\Temp\
  filter_installer:
    Image|endswith:
    - \setup.exe
    - \installer.exe
    - \uninstall.exe
  condition: sel_event and sel_image and not filter_installer
fields:
- EventCode
- Image
- CommandLine
- ParentImage
- User
falsepositives:
- Software installers and updaters that legitimately run from temp folders
- Portable applications started from user-writable folders
- Deleted-but-running legitimate binaries after patching
level: high

