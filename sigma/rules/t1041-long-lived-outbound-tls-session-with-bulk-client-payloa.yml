title: Long-Lived Outbound TLS Session with Bulk Client Payload
id: 8c1d2e44-9a70-4f31-9d5c-1e6a02b4c701
status: experimental
description: Detects an outbound Zeek connection where one session carries 10 MB or more of client payload and stays open
  for 300 seconds or longer. Long-lived, upload-heavy sessions to a single peer are the transport shape of exfiltration over
  a C2 channel (T1041). Pair with the Splunk SPL for periodicity and ratio.
references:
- https://attack.mitre.org/techniques/T1041/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network
  product: zeek
  service: conn
detection:
  selection:
    orig_bytes|gte: 10000000
    duration|gte: 300
  filter_internal:
    id.resp_h|startswith:
    - '10.'
    - 192.168.
  filter_internal_rfc1918:
    id.resp_h|re: ^172\.(1[6-9]|2[0-9]|3[01])\.
  condition: selection and not 1 of filter_*
fields:
- ts
- id.orig_h
- id.resp_h
- orig_bytes
- resp_bytes
- duration
falsepositives:
- Sanctioned bulk uploads such as video calls, sync clients, and CI artifacts
level: high
tags:
- attack.t1041
