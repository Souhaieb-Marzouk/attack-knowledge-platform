title: Rare Cloud API Enumeration Burst by One Principal
id: 0a7e4c2f-8b35-4d21-9c86-4e1b6a9d5f73
status: experimental
description: 'Detects a single principal calling 50 or more distinct Describe*, List*, or Get* event names within 15 minutes. Shows programmatic enumeration of the account, which usually precedes execution or exfiltration steps. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.discovery
- attack.lateral-movement
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName|startswith:
    - Describe
    - List
    - Get
    eventSource|endswith: amazonaws.com
  condition: selection
  timeframe: 15m
falsepositives:
- Configuration audit tools and security scanners that inventory the account
- New deployment pipelines during initial setup
level: medium

