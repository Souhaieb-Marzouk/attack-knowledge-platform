title: Large Upload to Public AI
id: 56225dc1-6231-4adb-b81f-5bc8ed98023c
status: experimental
description: Detects a large upload to a public AI service. This can be normal work, but it can also be sensitive data leaving the company.
references:
- https://attack.mitre.org/techniques/T1682/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1682
logsource:
  category: proxy
  product: zscaler
detection:
  selection_domain:
    url_domain|endswith:
    - chatgpt.com
    - openai.com
    - claude.ai
    - gemini.google.com
    - copilot.microsoft.com
    - perplexity.ai
  selection_upload:
    method: POST
    bytes_out|gte: 100000
  condition: selection_domain and selection_upload
fields:
- bytes_out
- method
- url_domain
falsepositives:
- Approved AI assistant with a business account
- User uploading a large public document
- Developer testing an API
level: medium

