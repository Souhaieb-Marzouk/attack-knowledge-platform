title: Lookalike Domain on Cheap TLD
id: 1bba20de-b1bb-4fde-983a-6a0186796cb4
status: experimental
description: Looks for DNS queries that contain a brand name and use a cheap TLD the company does not own. Useful for catching lookalike domains before a user clicks.
references:
- https://attack.mitre.org/techniques/T1585/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1585.002
logsource:
  category: dns
detection:
  selection_brand:
    query|contains:
    - northwind
    - contoso
  selection_tld:
    query|endswith:
    - .top
    - .xyz
    - .icu
    - .cfd
    - .online
    - .shop
  filter_known:
    query|endswith:
    - northwind.com
    - contoso.com
  condition: selection_brand and selection_tld and not filter_known
fields:
- query
falsepositives:
- Partner domains using a cheap TLD
- Marketing campaign domains
- Old brand redirects
level: medium

