title: Nginx Worker Connection Exhaustion Alert
id: 6f92ef76-3581-45eb-8a71-b8d695d1a0b4
status: experimental
description: Detects the nginx alert that appears when a worker runs out of connection slots. Slow-header or connection floods
  hold every socket open until this message appears (MITRE ATT&CK T1499.002).
references:
- https://attack.mitre.org/techniques/T1499/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: nginx
  service: error
detection:
  selection:
    message|contains: worker_connections are not enough
  condition: selection
fields:
- pid
- connection_id
- client
falsepositives:
- A legitimate traffic spike that fills all worker slots.
- A worker_connections value set far below real demand.
level: high
tags:
- attack.t1499.002
