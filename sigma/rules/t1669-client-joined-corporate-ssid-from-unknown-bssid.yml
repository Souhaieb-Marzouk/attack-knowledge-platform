title: Client Joined Corporate SSID from Unknown BSSID
id: d5608ecd-0fcd-4443-aac4-496e3e95a5a5
status: experimental
description: Detects WLAN-AutoConfig connect events (8001) where clients joined the corporate SSID from a BSSID that is not part of the approved access-point inventory - the client-side signature of an evil twin.
references:
- https://attack.mitre.org/techniques/T1669/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1669
- attack.tactic.initial-access
logsource:
  product: windows
  service: wlan-autoconfig
detection:
  selection:
    EventID: 8001
    SSID|contains: Corp-Secure
  filter_ap:
    BSSID|endswith:
    - AA-01
    - BB-02
  condition: selection and not filter_ap
fields:
- BSSID
- SSID
- Authentication
falsepositives:
- New APs not yet inventoried; roaming partners with the same SSID
level: high

