title: SSH Accepted Public Key from Unusual Source Host
id: 61bf3619-178b-4cd0-985a-c2ac4372a44b
status: stable
description: Detects a successful SSH login using a public key from a source that is not an approved bastion
  or admin host. Attackers with a stolen private key need no password, so this line is often the single
  footprint of the pivot.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021
- attack.t1021.004
logsource:
  product: linux
  service: auth
detection:
  selection:
    keywords|contains: Accepted publickey
  filter_bastion:
    keywords|contains:
    - ' from 10.0.20.11 '
    - ' from 10.0.20.12 '
    - ' from 10.0.20.13 '
  condition: selection and not filter_bastion
falsepositives:
- New bastion hosts or automation runners that are not on the allow list yet
- Admins testing keys during planned maintenance
level: medium
