title: Shortened Link Click in Mail
id: 1f567317-d1be-48bf-8bb5-763c0e6a161f
status: experimental
description: Looks for a URL Click event on a public shortener. Shorteners are used to hide phishing and tracking pages, but marketing also uses them.
references:
- https://attack.mitre.org/techniques/T1598/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1598.003
logsource:
  product: m365
  service: exchange
detection:
  selection_operation:
    Operation: URL Click
  selection_shortener:
    Url|contains:
    - bit[.]ly
    - t[.]co
    - tinyurl[.]com
    - is[.]gd
    - cutt[.]ly
  condition: selection_operation and selection_shortener
fields:
- Operation
- Url
falsepositives:
- Approved marketing shortener
- Newsletter links
- Employees clicking known vendor links
level: medium

