title: Ransomware Canary File Modification (Windows)
id: 7f3c2a91-4d8e-4b6a-9c2f-1e5d8a7b3c04
status: experimental
description: Detects any write to a planted canary file under the Canary folder. Legitimate software never touches these files,
  so a single event means ransomware or a destructive tool is active on this host and response must start now.
references:
- https://attack.mitre.org/techniques/T1486/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: \Canary\
  condition: selection
fields:
- TargetFilename
- Image
- User
falsepositives:
- An administrator deliberately moving or cleaning up the canary folder
- A backup agent touching every file during a verified backup window
level: critical
tags:
- attack.t1486
