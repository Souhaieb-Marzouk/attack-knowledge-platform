title: SSH Password Brute Force Burst
id: c21a7e5f-9d40-4b83-a6d1-2f0b8e94c6a7
status: experimental
description: 'Detects 10 or more failed SSH password logons from the same source IP within 10 minutes. This pattern shows password guessing or spraying against exposed or weak-password servers. Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) >= 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Souhaieb Marzouk
date: '2026-10-26'
tags:
- attack.credential-access
- attack.lateral-movement
- attack.t1021.004
- attack.t1110
logsource:
  product: linux
  service: auth
detection:
  selection:
    message|contains: Failed password
  condition: selection
  timeframe: 10m
falsepositives:
- A broken application or cron job with an old saved password
- Penetration tests with written approval
level: high

