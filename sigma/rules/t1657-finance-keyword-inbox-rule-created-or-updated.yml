title: Finance Keyword Inbox Rule Created or Updated
id: 7c1e4a9f-2b3d-4e58-9a12-6f0d8c34e7b1
status: experimental
description: Detects creation or update of a mailbox rule that moves or deletes mail containing invoice, payment, bank or
  wire keywords. Attackers use such rules to hide BEC threads from the mailbox owner.
references:
- https://attack.mitre.org/techniques/T1657/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: cloud
  product: m365
  service: exchange_online
detection:
  selection_op:
    Operation:
    - New-InboxRule
    - UpdateInboxRules
  selection_kw:
    Parameters|contains:
    - invoice
    - payment
    - bank
    - wire
  condition: selection_op and selection_kw
fields:
- Operation
- UserId
- ClientIP
- Parameters
falsepositives:
- A finance user files real invoices into a folder manually - verify with the user, then allowlist the rule name
- A sanctioned mail-hygiene or filing add-in creates rules automatically
level: high
tags:
- attack.t1657
