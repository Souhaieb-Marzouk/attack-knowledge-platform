title: Executable or Script Written to ADMIN$ Share
id: 3f8a9c2e-7d41-4b6e-9a35-c1d84e2f7a90
status: stable
description: Detects executable files written into the hidden ADMIN$ share. Attackers stage tools there
  before running them with a remote service.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Detection Engineering Guide
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|endswith: \ADMIN$
    RelativeTargetName|endswith:
    - .exe
    - .dll
    - .ps1
    - .bat
  condition: selection
falsepositives:
- Software deployment or patch tools that push updates through ADMIN$
- Approved admin scripts that copy files to servers
level: high
