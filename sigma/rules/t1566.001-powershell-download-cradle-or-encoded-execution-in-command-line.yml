title: PowerShell Download Cradle or Encoded Execution in Command Line
id: 5d7e2f11-9a3c-4e68-b1d4-c2f5a6b7d302
status: stable
description: 'Detects PowerShell fetching and running remote content, or certutil

  used as a downloader. Common second stage after a malicious email

  attachment (T1566.001).'
references:
- https://attack.mitre.org/techniques/T1566/001/
- https://attack.mitre.org/techniques/T1105/
author: Detection Engineering Team
date: '2026-09-25'
tags:
- attack.execution
- attack.command-and-control
- attack.t1566.001
- attack.t1105
- attack.t1059.001
- attack.initial-access
logsource:
  product: windows
  category: process_creation
detection:
  selection_ps:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_keywords:
    CommandLine|contains:
    - DownloadString
    - DownloadFile
    - DownloadData
    - Invoke-WebRequest
    - Invoke-RestMethod
    - Net.WebClient
    - FromBase64String
    - Start-BitsTransfer
    - IEX(
    - 'iex '
  selection_certutil:
    Image|endswith: \certutil.exe
    CommandLine|contains: urlcache
  condition: (selection_ps and selection_keywords) or selection_certutil
falsepositives:
- Administrative scripts and software installers that download files. Allow full unique command lines,
  and require them to be documented.
level: high
