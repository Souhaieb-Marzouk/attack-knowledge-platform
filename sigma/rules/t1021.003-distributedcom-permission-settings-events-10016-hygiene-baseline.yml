title: DistributedCOM Permission Settings Events 10016 (Hygiene Baseline)
id: 7d2e94a6-1c85-4f3b-a9d7-0e58b2c6f419
status: stable
description: Counts DistributedCOM event 10016 records in the System log. These events fire on almost
  every default Windows host, so this rule is not an alert. Use it to build the inventory of hosts with
  wide COM permission settings and to find machines that missed the 2022 DCOM hardening.
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 10016
    Provider_Name: Microsoft-Windows-DistributedCOM
  condition: selection
falsepositives:
- Almost universal on default Windows installs; use for baselining, not alerting
level: low
