title: High NXDOMAIN Burst from a Single Host
id: a3c1f9e2-4b7d-4e58-9c21-7f0d63ab8e14
status: experimental
description: One host asks many different domain names in five minutes and most answers are NXDOMAIN. Malware with a domain
  generation algorithm does this while it walks its candidate list looking for the one name the attacker registered today.
references:
- https://attack.mitre.org/techniques/T1568/002/
- Public DGA research on NXDOMAIN ratio analysis
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: dns
  product: zeek
  service: dns
detection:
  selection:
    rcode_name: NXDOMAIN
  condition: selection
  timeframe: 5m
fields:
- id.orig_h
- query
- rcode_name
falsepositives:
- A broken application that retries dead internal names again and again
- A vulnerability scanner that checks many parked domains
level: high
tags:
- attack.t1568.002
