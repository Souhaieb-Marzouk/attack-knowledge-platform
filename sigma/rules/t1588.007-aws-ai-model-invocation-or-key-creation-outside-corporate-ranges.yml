title: AWS AI Model Invocation or Key Creation Outside Corporate Ranges
id: d43cad2a-f373-4659-a7b9-7b86ecd83765
status: experimental
description: Detects Amazon Bedrock model invocations and new IAM access key creation that originate from infrastructure outside corporate ranges. Anomalous AI API usage, fresh API keys, and dormant identities suddenly calling models are the cloud-side footprint of obtaining access to generative AI tools (MITRE ATT&CK T1588.007).
references:
- https://attack.mitre.org/techniques/T1588/
- https://attack.mitre.org/techniques/T1588/007/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.007
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_ai:
    eventSource: bedrock.amazonaws.com
    eventName:
    - InvokeModel
    - InvokeModelWithResponseStream
    - Converse
    - ConverseStream
  selection_keys:
    eventSource: iam.amazonaws.com
    eventName:
    - CreateAccessKey
    - CreateLoginProfile
    userIdentity.type: IAMUser
  filter_corp:
    sourceIPAddress|startswith:
    - '10.'
    - 192.168.
  condition: (selection_ai or selection_keys) and not filter_corp
fields:
- userIdentity.userName
- eventSource
- eventName
- sourceIPAddress
- userAgent
falsepositives:
- Remote workers or cloud development environments that call AI services from non-corporate ranges by design
- Approved automation that creates access keys during service onboarding
level: high

