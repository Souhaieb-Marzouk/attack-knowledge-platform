title: Remote Access and Management Port Probe Burst
id: 9e4b6d2f-3a5c-4e8f-8d1a-7c2b4e6f8a04
status: stable
description: 'Detects one external source sending many denied probes to remote access and management ports
  such as SSH (22), VPN (1194) and RDP (3389). Attackers use this to find remote access doors inside a
  scanned range (MITRE ATT&CK T1590.005). Detection note: this is the event-level half. Apply the SIEM
  threshold count(src_ip) > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/005/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.005
logsource:
  category: firewall
  product: pfsense
detection:
  selection:
    action: block
    dest_port:
    - 22
    - 1194
    - 3389
  timeframe: 5m
  condition: selection
falsepositives:
- a branch office that shares one egress address
- an approved external scan of the same ports
level: high
