title: Server Utility Connecting to Cloud IP
id: 9fa992da-36d0-41a1-b1fc-f8e08d072e70
status: experimental
description: Detects built-in Windows utilities connecting to public cloud ranges. These utilities are used for payload download and C2, but also by admins for certificate work.
references:
- https://attack.mitre.org/techniques/T1585/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1585.003
logsource:
  category: network_connection
  product: windows
detection:
  selection_dest:
    DestinationIp|startswith:
    - '20.'
    - '13.'
    - '3.'
    - '52.'
    - '34.'
    - '35.'
    - '104.'
  selection_process:
    Image|endswith:
    - \rundll32.exe
    - \regsvr32.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \mshta.exe
  condition: selection_dest and selection_process
fields:
- DestinationIp
- Image
falsepositives:
- Admin scripts using certutil for certificate enrollment
- Software deployment using bitsadmin
- Cloud backup agents
level: medium

