title: Search Crawler Fetching Sensitive File
id: 5f2eb66b-05b4-4288-b24a-2044b18196c7
status: experimental
description: Flags a search-engine crawler fetching a sensitive file. Indexed secrets and backups are a common open-web finding.
references:
- https://attack.mitre.org/techniques/T1593/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1593.002
logsource:
  category: webserver
detection:
  selection_path:
    cs-uri-stem|contains:
    - /.env
    - /.git/
    - /backup/
    - /admin
  selection_status:
    sc-status: 200
  selection_agent:
    cs(User-Agent)|contains:
    - Googlebot
    - bingbot
  condition: selection_path and selection_status and selection_agent
fields:
- cs(User-Agent)
- cs-uri-stem
- sc-status
falsepositives:
- Crawler verification test
- Public documentation path
- Search engine indexing an approved file
level: high

