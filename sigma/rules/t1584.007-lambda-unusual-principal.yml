title: Lambda Change Outside Deployment Pipeline
id: f96e9831-8229-428b-89c5-efc217558a1e
status: experimental
description: Alerts when a Lambda function is created or changed by a principal outside the deployment pipeline. Could be a break-glass change, so check the ticket.
references:
- https://attack.mitre.org/techniques/T1584/007/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_events:
    eventName:
    - CreateFunction20150331
    - UpdateFunctionCode20150331
    - UpdateFunctionConfiguration20150331
  filter_pipeline:
    userIdentity.arn|contains:
    - role/ci-
    - role/deploy
    - assumed-role/DeploymentRole
  condition: selection_events and not filter_pipeline
fields:
- eventName
- userIdentity.arn
falsepositives:
- Break-glass admin deployment
- New CI role not in the filter yet
- Infrastructure test account
level: high

