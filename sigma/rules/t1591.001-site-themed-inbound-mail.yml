title: Inbound Mail About Sites or Facilities
id: e77c77cf-ef32-4a45-ba8f-01d3e0f2c123
status: experimental
description: Looks for inbound mail that talks about sites, depots, warehouses, or gate passes, or comes from a site-themed domain. Site details are useful for physical targeting.
references:
- https://attack.mitre.org/techniques/T1591/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1591.001
logsource:
  category: email
  product: mail_gateway
detection:
  selection_gateway:
    direction: inbound
  selection_subject:
    subject|contains:
    - site visit
    - site tour
    - depot
    - warehouse
    - loading dock
    - gate pass
  selection_domain:
    sender_domain|contains:
    - hq
    - depot
    - plant
    - campus
  condition: selection_gateway and (selection_subject or selection_domain)
fields:
- direction
- sender_domain
- subject
falsepositives:
- Facilities team discussing site visits
- Logistics partner
- Employee travel booking
level: medium

