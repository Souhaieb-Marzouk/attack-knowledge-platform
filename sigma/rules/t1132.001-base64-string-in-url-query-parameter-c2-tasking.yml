title: Base64 String in URL Query Parameter (C2 Tasking)
id: 3f1c8a52-9b4e-4d2a-8f6c-1e7d5b9a0341
status: experimental
description: Detects long Base64-shaped values in URL query parameters. Implants commonly carry command-and-control tasking
  this way (MITRE ATT&CK T1132.001).
references:
- https://attack.mitre.org/techniques/T1132/001/
- https://www.rfc-editor.org/rfc/rfc4648
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
  product: zeek
detection:
  selection_method:
    method:
    - GET
    - POST
  selection_b64:
    uri|re: '[?&][A-Za-z0-9_]{1,12}=[A-Za-z0-9+/]{40,}={0,2}'
  condition: selection_method and selection_b64
fields:
- id.orig_h
- host
- uri
- method
- user_agent
falsepositives:
- Backup and sync tools that pass binary tokens as query values
- Signed API request parameters from known SaaS platforms
level: high
tags:
- attack.t1132.001
