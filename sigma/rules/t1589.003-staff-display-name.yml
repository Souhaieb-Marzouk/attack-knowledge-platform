title: External Mail Using Staff or Help Desk Name
id: 4c90400f-ef28-4e05-889c-15a265cdd60d
status: experimental
description: Looks for external mail using a staff or help desk display name. This is a common pretext after employee-name reconnaissance.
references:
- https://attack.mitre.org/techniques/T1589/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1589.003
logsource:
  category: email
  product: mail_gateway
detection:
  selection_display:
    DisplayName|contains:
    - IT Service Desk
    - Dana Wells
    - Maya Okafor
  filter_internal:
    SenderDomain|endswith: aureliapay.example
  condition: selection_display and not filter_internal
fields:
- DisplayName
- SenderDomain
falsepositives:
- External help desk vendor
- Employee sending from a personal account
- Partner using a shared support name
level: high

