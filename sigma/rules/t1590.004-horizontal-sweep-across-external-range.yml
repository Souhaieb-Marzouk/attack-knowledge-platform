title: Horizontal Sweep Across External Range
id: 7f3d2c91-4a58-4b6e-9d21-8c05a1e4f7b3
status: stable
description: 'Detects a single external source denied on many different destination IPs at the firewall
  boundary in a short window. This is the classic echo of topology mapping before an intrusion. Detection
  note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/004/
author: Detection Engineering Team
