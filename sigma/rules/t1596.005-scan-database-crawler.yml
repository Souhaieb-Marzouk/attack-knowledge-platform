title: Shodan or Censys Crawler
id: e8932677-518b-441b-a01e-246abcf8c153
status: experimental
description: Detects known scan-database crawlers such as Shodan, Censys, zgrab, or masscan. Public scan data can expose services without direct exploitation.
references:
- https://attack.mitre.org/techniques/T1596/005/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1596.005
logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|contains:
    - Shodan
    - CensysInspect
    - zgrab
    - masscan
  condition: selection
fields:
- cs-user-agent
falsepositives:
- Approved external attack-surface scan
- Search engine crawler
- Security research
level: medium

