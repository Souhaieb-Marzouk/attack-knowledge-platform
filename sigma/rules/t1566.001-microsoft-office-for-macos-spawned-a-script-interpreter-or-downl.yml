title: Microsoft Office for macOS Spawned a Script Interpreter or Download Tool
id: 7f2d9e54-8c3a-4b61-96b7-c1d2e3f4a508
status: stable
description: 'Detects Microsoft Office applications on macOS starting shells,

  scripting tools, or downloaders - the macOS version of macro payload

  execution after a phishing attachment (T1566.001).'
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Engineering Team
date: '2026-09-25'
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- attack.t1059.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_parent:
    ParentImage|endswith:
    - /Microsoft Word
    - /Microsoft Excel
    - /Microsoft PowerPoint
    - /Microsoft Outlook
  selection_child:
    Image|endswith:
    - /sh
    - /zsh
    - /bash
    - /osascript
    - /curl
    - /python3
    - /ruby
    - /perl
  condition: selection_parent and selection_child
falsepositives:
- Some mail or document plugins call system tools. Review command lines; allow specific parent-child pairs
  only.
level: high
