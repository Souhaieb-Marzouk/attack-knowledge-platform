title: Successful Logon with the Built-in Windows Guest Account
id: 021c3b69-c60d-4eac-b20b-901500637fb9
status: experimental
description: Detects a successful logon (Windows Security event 4624) with the built-in Guest account. Guest has no daily-work role and is disabled in hardened images, so any success means untracked local access, or a golden image that silently re-enables the account.
references:
- https://attack.mitre.org/techniques/T1078/001/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1078.001
- attack.initial_access
- attack.defense_evasion
logsource:
  product: windows
  service: security
detection:
  selection_id:
    EventID: 4624
  selection_user:
    TargetUserName: Guest
  filter_anonymous:
    TargetUserName|contains: ANONYMOUS
  condition: selection_id and selection_user and not filter_anonymous
fields:
- EventID
- TargetUserName
- TargetDomainName
- LogonType
- IpAddress
- WorkstationName
falsepositives:
- Approved kiosk or shared-device images that intentionally run as Guest
- Legacy applications configured to map anonymous access onto Guest
level: medium

