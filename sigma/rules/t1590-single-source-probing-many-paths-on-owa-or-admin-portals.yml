title: Single Source Probing Many Paths on OWA or Admin Portals
id: 7e91c4b2-3d58-4a96-b0e4-1f6d82c9a530
status: test
description: 'One external source requests many different paths under mail and admin portals such as /owa,
  /ecp, /autodiscover, and /admin in a short window. This path walk often precedes exploitation of public-facing
  servers (MITRE ATT&CK T1590). Detection note: this is the event-level half. Apply the SIEM threshold
  count(c-ip) > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590
logsource:
  category: webserver
  product: apache
detection:
  selection_method:
    cs-method:
    - GET
    - HEAD
    - POST
  selection_path:
    cs-uri-stem|startswith:
    - /owa
    - /ecp
    - /autodiscover
    - /admin
    - /vpn
    - /aspnet_client
  condition: selection_method and selection_path
  timeframe: 5m
falsepositives:
- A monitoring crawler that checks the portals on a schedule
- Mobile devices with old cached portal paths
level: high
