title: Raw Disk Access to PhysicalDrive by Unknown Process
id: b47a2d90-5c13-4f8e-a6d7-92e0c5b14f38
status: experimental
description: Detects Sysmon RawAccessRead events where a process opens a physical drive device path such as \\.\PhysicalDrive0,
  which destructive tools use to reach and corrupt boot records and file system structures.
references:
- https://attack.mitre.org/techniques/T1561/
- https://attack.mitre.org/techniques/T1561/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 9
    TargetObject|startswith: \\.\PhysicalDrive
  filter_imaging:
    Image|endswith:
    - \disk2vhd.exe
    - \dd.exe
    - \clonedisk.exe
  filter_backupagent:
    Company|endswith: BackupSoftwareExample
  condition: selection and not 1 of filter_*
fields:
- Computer
- User
- Image
- TargetObject
- EventID
falsepositives:
- Disk imaging, cloning, and forensic acquisition tools run by administrators
- Backup software that reads volumes at the block level
level: critical
tags:
- attack.t1561
