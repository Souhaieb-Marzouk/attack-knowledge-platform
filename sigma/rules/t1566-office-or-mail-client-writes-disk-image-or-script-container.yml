title: Office or Mail Client Writes Disk Image or Script Container
id: 5e106a82-cd7f-4c35-9b0c-9b0c1d2e3f45
status: stable
description: Detects Outlook or Office applications creating ISO, IMG, LNK, HTA, or CHM files on disk.
  Attackers wrap payloads in these containers to slip past macro blocks; a mail client has no reason to
  produce them.
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Guide Team
date: '2025-11-18'
tags:
- attack.initial-access.t1566
- attack.execution.t1204
- attack.t1566.001
- attack.t1566
- attack.initial-access
logsource:
  category: file_event
  product: windows
  definition: Sysmon Event ID 11 or equivalent EDR file events
detection:
  selection_parent:
    Image|endswith:
    - \OUTLOOK.EXE
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
  selection_ext:
    TargetFilename|endswith:
    - .iso
    - .img
    - .lnk
    - .hta
    - .chm
    - .cpl
  condition: selection_parent and selection_ext
falsepositives:
- Users saving legitimate ISO installers received from a known software vendor by mail.
- Internal tools that mail HTML help files for documentation.
level: high
