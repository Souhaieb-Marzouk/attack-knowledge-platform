title: SendSSHPublicKey by Unusual Principal
id: 5c9e1b7a-2d8f-4b36-9e4a-c7d1f0a3b582
status: experimental
description: Detects a temporary SSH key being pushed to an EC2 instance by a principal that is not on the approved admin or pipeline allow list. A leaked CI/CD role calling this API is a strong sign of direct cloud VM access abuse.
references:
- https://attack.mitre.org/techniques/T1021/008/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: SendSSHPublicKey
  filter_approved_roles:
    userIdentity.arn:
    - arn:aws:iam::111122223333:role/platform-admin*
    - arn:aws:iam::111122223333:role/terraform_planner*
  condition: selection and not filter_approved_roles
falsepositives:
- New admin roles that were not added to the allow list yet
- One-off break-glass accounts used during an incident
level: high

