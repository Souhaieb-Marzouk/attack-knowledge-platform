title: Scheduled Task Creation Referencing Archiver or Sync Tooling
id: 3f2a91c4-8d17-4e5b-9c62-71ab04d8f301
status: experimental
description: Detects a Windows scheduled task being created (Event ID 4698) whose action line references archivers, downloaders,
  or sync/upload utilities. This is the persistence-and-staging signature of automated exfiltration (T1020). Review the creator
  account and the task trigger time.
references:
- https://attack.mitre.org/techniques/T1020/
- https://attack.mitre.org/techniques/T1053/005/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID: 4698
  selection_tools:
    TaskContent|contains:
    - rclone
    - curl
    - wget
    - scp
    - 7z
    - 7za
    - rar a
    - winrar
    - bitsadmin /transfer
    - certutil -urlcache
  filter_signed_it:
    SubjectUserName|endswith: _adm
    TaskContent|contains: C:\Program Files\
  condition: selection_event and selection_tools and not 1 of filter_*
fields:
- EventID
- TaskName
- TaskContent
- SubjectUserName
- Computer
falsepositives:
- Legitimate backup or deployment jobs that pack files and use curl or BITS
- IT automation tooling (SCCM, Ansible) creating maintenance tasks
level: high
tags:
- attack.t1020
