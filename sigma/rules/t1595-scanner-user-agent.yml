title: Scanner User-Agent in Web Logs
id: 499c7255-6cd9-494a-b616-fec9fb2a1cf5
status: experimental
description: Looks for scanner User-Agents in web logs. It is noisy on purpose; use it for triage and trend, not as a standalone block.
references:
- https://attack.mitre.org/techniques/T1595/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1595
logsource:
  category: webserver
  product: apache
detection:
  selection:
    cs-user-agent|contains:
    - masscan
    - nmap
    - gobuster
    - dirbuster
    - wfuzz
    - ffuf
    - Nikto
    - sqlmap
  condition: selection
fields:
- cs-user-agent
falsepositives:
- Authorized vulnerability scanner
- Security researcher
- Old scanner signature in logs
level: high

