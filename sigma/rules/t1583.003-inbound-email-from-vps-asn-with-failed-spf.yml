title: Inbound Email from VPS ASN with Failed SPF
id: ab340944-3a87-423b-b546-ebc6f26c0a9e
status: experimental
description: Detects inbound messages whose sending IP belongs to a hosting ASN and whose SPF validation failed. Attackers host phishing pages (MITRE ATT&CK T1583.003) on rented VPS machines and send matching lures from the same box. Correlate the sender IP with proxy visits in the next 24 hours.
references:
- https://attack.mitre.org/techniques/T1583/003/
- https://www.spamhaus.org/sbl/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1583
- attack.t1583.003
- attack.initial_access
- attack.t1566
logsource:
  category: email
  product: cisco
  service: esa
detection:
  selection_spf:
    spf_verdict: fail
  selection_vps:
    is_vps_asn: true
  filter_approved_bulk:
    header_from|endswith:
    - '@mailer.corp-mailouts.net'
    - '@notify.corp-newsroom.com'
  condition: selection_spf and selection_vps and not filter_approved_bulk
fields:
- src_ip
- header_from
- mailfrom
- subject
- recipient
falsepositives:
- Small vendors sending marketing mail from self-hosted cloud servers
- Misconfigured CRM systems that send from VPS ranges without SPF records
level: high

