title: AWS Console Login Without MFA or from New Country
id: c5a1e7b3-92d8-4f06-b7c4-6e2d9a8f3c71
status: stable
description: Detects successful console logins where MFA was not used (typical for a replayed stolen session
  cookie) or the login comes from a country outside the expected list. Covers the LAPSUS$ and Scattered
  Spider access pattern.
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    eventSource: signin.amazonaws.com
    responseElements.ConsoleLogin: Success
  filter_mfa_used:
    additionalEventData.MFAUsed: 'Yes'
  filter_known_geo:
    src_country:
    - Germany
    - United Kingdom
    - Netherlands
  condition: selection and not 1 of filter_*
falsepositives:
- Service consoles that authenticate without MFA by design (monitor tightly)
- Traveling staff; update the geo list with ticket context
level: high
