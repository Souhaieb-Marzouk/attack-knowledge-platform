title: Archiver or Splitter Started with Volume-Split Flags
id: a1f3c2d8-6b47-4e02-9d5a-3c8f01e7b210
status: experimental
description: Detects archivers or file splitters started with volume flags such as -v9m, -v5m, or split -b. Creating fixed-size
  parts is the preparation step of T1030 chunked exfiltration, and the part files are high-value disk artifacts.
references:
- https://attack.mitre.org/techniques/T1030/
- https://attack.mitre.org/techniques/T1560/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - \7z.exe
    - \7za.exe
    - \rar.exe
    - \split.exe
  selection_flags:
    CommandLine|contains:
    - -v9m
    - -v5m
    - -v1m
    - -v1024k
    - ' -v '
    - split -b
  filter_known_backup:
    ParentImage|startswith: C:\Program Files\
    CommandLine|contains: \backup\
  condition: selection_img and selection_flags and not 1 of filter_*
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Backup and imaging jobs that legitimately create multi-volume archives
- Build pipelines that split large artifacts
level: high
tags:
- attack.t1030
