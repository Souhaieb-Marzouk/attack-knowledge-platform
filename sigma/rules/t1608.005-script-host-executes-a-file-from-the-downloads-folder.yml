title: Script Host Executes a File from the Downloads Folder
id: 250d4f41-613c-450e-b196-5a0799e2ac3e
status: experimental
description: 'Endpoint half of malicious-link delivery: a browser saves content fetched through a link (often with a shortener referrer) and a Windows script host then executes a file from the user''s Downloads or Temp folder. Matches the user-execution step that follows staged payload links (T1204.001).'
references:
- https://attack.mitre.org/techniques/T1608/005/
- https://attack.mitre.org/techniques/T1204/001/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608.005
- attack.execution
- attack.t1204.001
- attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection_interpreter:
    Image|endswith:
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  selection_path:
    CommandLine|contains:
    - \Downloads\
    - \AppData\Local\Temp\
  condition: selection_interpreter and selection_path
fields:
- Image
- CommandLine
- ParentImage
- User
- Computer
falsepositives:
- Developers or students keeping and running scripts in a Downloads or Temp folder.
- Software updaters that unpack scripts to Temp (rare for script hosts).
level: high

