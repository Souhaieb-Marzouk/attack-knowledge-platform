title: SQL Injection Pattern in Web Request
id: 6b7278c9-5bd9-4740-8180-5eced9d30afa
status: experimental
description: Detects common SQL injection control tokens in web request URIs. Mass scanners and targeted exploitation both leave these patterns in access logs.
references:
- https://attack.mitre.org/techniques/T1190/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1190
- attack.tactic.initial-access
logsource:
  category: webserver
detection:
  selection_tokens:
    c-uri|re: (?i)(union(\s|%20)+select|select(\s|%20)+.+(from|information_schema)|insert(\s|%20)+into|or(\s|%20)+1=1|sleep\(|benchmark\()
  condition: selection_tokens
fields:
- client_ip
- c-uri
- status
falsepositives:
- Pages whose legitimate content contains SQL keywords in URLs (rare)
level: high

