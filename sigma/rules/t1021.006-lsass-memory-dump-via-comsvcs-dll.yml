title: LSASS Memory Dump via comsvcs.dll
id: f43f7746-7e02-4b48-a6af-2ca8aebeb034
status: experimental
description: Detects rundll32 loading comsvcs.dll with the MiniDump export against lsass.exe, or a process opening lsass with read access (Sysmon event 10, GrantedAccess 0x1010). Attackers favor this pair because rundll32 is signed and no dump tool ever lands on disk. Correlate with the WinRM session that carried the command.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.credential-access
- attack.lateral-movement
- attack.t1021.006
- attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection_rundll:
    EventID: 1
    Image|endswith: \rundll32.exe
    CommandLine|contains|all:
    - comsvcs
    - MiniDump
  selection_lsass_access:
    EventID: 10
    TargetImage|endswith: \lsass.exe
    GrantedAccess: '0x1010'
  condition: selection_rundll or selection_lsass_access
falsepositives:
- Some backup and endpoint products read lsass memory for their own features
level: critical

