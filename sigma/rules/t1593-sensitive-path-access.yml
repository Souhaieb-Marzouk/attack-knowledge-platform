title: Sensitive Path on Public Web Server
id: 89a15eda-5f06-45f1-ad4d-44c3a6487d47
status: experimental
description: Looks for a public web server returning 200 or 206 for.env,.git, backup, dump, or admin config paths. Check whether the path is supposed to be public.
references:
- https://attack.mitre.org/techniques/T1593/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1593
logsource:
  category: webserver
detection:
  selection:
    cs-method: GET
    cs-uri-stem|contains:
    - /.env
    - /.git/
    - /backup/
    - /dump/
    - /admin/config
    sc-status:
    - 200
    - 206
  condition: selection
fields:
- cs-method
- cs-uri-stem
- sc-status
falsepositives:
- Web team scanner
- Documentation path that looks sensitive
- Developer test environment
level: high

