title: Backup or Source Path Returns 200
id: 8fb0638d-495f-4c50-9e4a-87f324b804a6
status: experimental
description: Detects a backup or source path returning 200. Verify the file is not a decoy or a catch-all response.
references:
- https://attack.mitre.org/techniques/T1595/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1595.003
logsource:
  category: webserver
  product: apache
detection:
  selection_status:
    status: 200
  selection_path:
    url|re: (?i)(\.git/|\.env$|\.env\.|\.bak$|\.sql$|\.zip$|\.tar\.gz$|backup|dump)
  condition: selection_status and selection_path
fields:
- status
- url
falsepositives:
- Approved backup download endpoint
- Developer testing static files
- Catch-all route
level: high

