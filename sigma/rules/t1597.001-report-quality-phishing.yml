title: Detailed Phishing Lure for Executive
id: bd8e294f-0e14-4b84-bb71-268ad44cb90d
status: experimental
description: Detects a quarantined message with report-quality target context aimed at an executive, finance director, or HR lead. This is a high-signal but low-volume rule.
references:
- https://attack.mitre.org/techniques/T1597/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1597.001
logsource:
  category: email
  product: email_security_gateway
  service: quarantine
detection:
  selection_context:
    context_flag: report_quality
  selection_targets:
    recipient_role:
    - executive
    - finance_director
    - hr_lead
  condition: selection_context and selection_targets
fields:
- context_flag
- recipient_role
falsepositives:
- Executive protection exercise
- Due-diligence firm contacting an executive
- Red-team simulation
level: high

