title: Nmap or Scanner Running on Windows
id: 4d2a5b65-76bf-4bd2-bb5f-c15660dddc8d
status: experimental
description: Detects nmap, masscan, zmap, hping3, or a scanner-like executable running from a temp folder on Windows. Attackers and botnet operators use these to map reachable services.
references:
- https://attack.mitre.org/techniques/T1584/005/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_scan_tools:
    Image|endswith:
    - \masscan.exe
    - \nmap.exe
    - \zmap.exe
    - \hping3.exe
  selection_temp_scanner:
    Image|contains|all:
    - \Temp\
    - .exe
    CommandLine|contains:
    - ' -p'
    - --port
    - /24
  condition: selection_scan_tools or selection_temp_scanner
fields:
- CommandLine
- Image
falsepositives:
- Authorized vulnerability scanner
- IT inventory tool
- Student lab VM
level: high

