title: Rare High-Rights ProcessAccess Against Explorer (ListPlanting Write Setup)
id: ec5862a6-817c-4ebc-a9c0-490765769ff7
status: experimental
description: Flags uncommon processes requesting near-full handle access to explorer.exe. Attackers performing ListPlanting need such a handle before sending LVM window messages or copying code with another Process Injection method.
references:
- https://attack.mitre.org/techniques/T1055/015/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1055.015
- attack.t1055
- attack.defense_evasion
- attack.privilege_escalation
logsource:
  product: windows
  service: sysmon
detection:
  selection_target:
    EventID: 10
    TargetImage|endswith: \explorer.exe
    GrantedAccess|contains:
    - '0x1FFFFF'
    - '0x1F1FFF'
    - '0x143A'
  filter_known_tools:
    SourceImage|endswith:
    - \MsSense.exe
    - \MsMpEng.exe
    - \CSFalconService.exe
    - \SentinelAgent.exe
  condition: selection_target and not filter_known_tools
fields:
- SourceImage
- TargetImage
- SourceProcessId
- TargetProcessId
- GrantedAccess
falsepositives:
- Security products not in the filter list that scan explorer.exe
- Backup and RMM (Remote Monitoring and Management) agents enumerating windows
level: medium

