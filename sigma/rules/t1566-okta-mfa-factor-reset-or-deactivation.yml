title: Okta MFA Factor Reset or Deactivation
id: 4d0f5a71-bc6e-4b24-8a9b-8a9b0c1d2e34
status: experimental
description: Detects a successful reset or deactivation of a multi-factor factor in Okta. Vishing attackers call the help desk, ask for this reset, and enroll their own device minutes later. Join with the following enrollment event for high confidence.
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/004/
author: Souhaieb Marzouk
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.persistence
- attack.t1098
- attack.t1566.004
logsource:
  product: okta
  service: okta
  definition: Okta system log
detection:
  selection_event:
    eventType:
    - user.mfa.factor.reset
    - user.mfa.factor.deactivate
  selection_success:
    outcome.result: SUCCESS
  condition: selection_event and selection_success
falsepositives:
- Legitimate help desk resets for users with a verified ticket; join resets to ticket IDs.
- Scheduled offboarding automation for departing employees.
level: high

