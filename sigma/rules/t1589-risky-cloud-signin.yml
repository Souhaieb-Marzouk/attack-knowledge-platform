title: Risky Cloud Sign-In Success
id: 22a2703a-144f-45ff-b260-b959b5d85182
status: experimental
description: Detects a successful Azure sign-in with medium or high risk. This is not proof of compromise; it just means the identity engine saw something unusual.
references:
- https://attack.mitre.org/techniques/T1589/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1589
logsource:
  product: azure
  service: signinlogs
detection:
  selection_success:
    ResultType: '0'
  selection_risk:
    RiskLevelAggregated:
    - medium
    - high
  condition: selection_success and selection_risk
fields:
- ResultType
- RiskLevelAggregated
falsepositives:
- Traveling user on a new device
- Approved pen-test account
- Privacy VPN used by staff
level: high

