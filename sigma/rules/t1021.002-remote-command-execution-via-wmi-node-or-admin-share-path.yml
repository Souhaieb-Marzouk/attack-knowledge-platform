title: Remote Command Execution via WMI Node or Admin Share Path
id: 8e4f2c6d-1a95-47b3-a0c7-2d5e8f1a3b64
status: stable
description: Detects command lines that target remote systems with WMI (/node:) or that reference the
  hidden ADMIN$ share directly.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Detection Engineering Guide
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    CommandLine|contains:
    - '/node:'
    - \ADMIN$
    - smbexec
  condition: selection
falsepositives:
- Inventory and monitoring tools that query many hosts with WMI
- Approved remote-update scripts
level: high
