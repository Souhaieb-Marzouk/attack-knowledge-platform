title: Rundll32 Starting a File From Temp or Downloads (TH-01)
id: e4f7b2c1-9a3d-4e8f-b2a6-1c5d7f0e3b92
status: experimental
description: 'Detects rundll32.exe starting a module from a user-writable folder such as Temp or Downloads. Attackers that
  hide a stage inside an image file often drop the extracted file next to the picture and start it with rundll32. This rule
  is a workflow cue, not proof of steganography: correlate the same host with a recent image download before escalating.'
references:
- https://attack.mitre.org/techniques/T1001/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \rundll32.exe
    CommandLine|contains:
    - \AppData\Local\Temp\
    - \Downloads\
    - \Users\Public\
  filter_legit:
    ParentImage|endswith:
    - \msiexec.exe
    - \setup.exe
  condition: selection and not filter_legit
fields:
- Image
- CommandLine
- ParentImage
- User
falsepositives:
- Installers and update helpers that start DLL hosts from Temp folders.
- Developer tooling that unpacks resources to Temp and runs them.
level: medium
tags:
- attack.t1001.002
