title: DNS TXT Query Volume Spike from a Single Client
id: a3f7c2d1-8b4e-4f6a-9c3d-1e5a7b9d0c2f
status: experimental
description: One client sends more than 100 TXT queries within 15 minutes. That is the classic shape of DNS tunneling exfiltration,
  where stolen data rides in the subdomain labels of one external zone.
references:
- https://attack.mitre.org/techniques/T1071/004/
- https://www.rfc-editor.org/rfc/rfc1035
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: dns
  product: zeek
detection:
  selection:
    qtype_name: TXT
  condition: selection
timeframe: 15m
fields:
- id.orig_h
- query
- qtype_name
- rcode_name
falsepositives:
- Mail security appliances doing bulk SPF or DKIM TXT lookups
- Vulnerability scanners resolving many TXT records at once
level: high
tags:
- attack.t1071.004
