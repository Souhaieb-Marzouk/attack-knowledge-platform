title: ZIP Download from Long-Tail TLD Host Referred by Search Engine
id: f8cdda21-61b6-420c-b9f7-a578a06eb0e9
status: experimental
description: 'Detects the classic SEO poisoning delivery step (ATT&CK T1608.006): an internal user downloads archive content from a host on a cheap long-tail top-level domain while the HTTP referer points at a large search engine. Gootloader-style campaigns end this step in Windows Script Host execution of an obfuscated JavaScript file, so escalate any hit and check the endpoint for follow-on script activity.'
references:
- https://attack.mitre.org/techniques/T1608/006/
- https://attack.mitre.org/techniques/T1204/002/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.006
- attack.execution
- attack.t1204.002
logsource:
  category: proxy
detection:
  selection_referer:
    c-referer|contains:
    - google.com
    - bing.com
    - duckduckgo.com
    - search.yahoo.com
    - baidu.com
  selection_tld:
    cs-host|endswith:
    - .icu
    - .top
    - .click
    - .cyou
    - .xyz
    - .online
  selection_download:
    cs-method: GET
    c-uri-extension|contains:
    - zip
    - rar
    - 7z
  condition: all of selection_*
fields:
- cs-host
- c-uri
- c-referer
- src_ip
- user
- c-useragent
falsepositives:
- Users downloading legitimate archives hosted on cheap TLDs.
- Marketing teams pulling campaign assets from unusual hosts.
level: high

