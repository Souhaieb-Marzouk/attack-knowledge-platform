title: Archive Staging Followed by Copy to Removable Volume
id: 3f2b8c1a-7d4e-4c9a-b1f6-2e5a90d3a101
status: experimental
description: Detects file writes to a removable drive letter within 30 minutes after an archive was created in a user temp
  folder. This chain is the classic insider exfiltration path over physical medium (ATT&CK T1052 / T1052.001).
references:
- https://attack.mitre.org/techniques/T1052/
- https://attack.mitre.org/techniques/T1052/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection_stage:
    EventID: 11
    Image|endswith: \7z.exe
    TargetFilename|contains: \AppData\Local\Temp\
    TargetFilename|endswith:
    - .zip
    - .7z
  selection_copy:
    EventID: 11
    TargetFilename|re: ^[D-Z]:\\
  condition: selection_stage or selection_copy
  timeframe: 30m
fields:
- EventID
- Image
- User
- TargetFilename
- Hashes
falsepositives:
- Approved backup or hand-off tools that copy archives to external drives.
- Departments with a documented courier process for encrypted media.
level: high
tags:
- attack.t1052
