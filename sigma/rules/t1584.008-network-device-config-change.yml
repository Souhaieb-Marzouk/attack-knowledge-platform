title: Network Device Config Change Outside Management
id: a989c86f-11fc-4e34-a91b-14ef40e61fcc
status: experimental
description: Looks for a Cisco config change from outside the management ranges. A console change from a jump host can still be legitimate; verify the source.
references:
- https://attack.mitre.org/techniques/T1584/008/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.008
logsource:
  category: firewall
  product: cisco
detection:
  selection_config:
    message|contains: SYS-5-CONFIG_I
  filter_mgmt_src:
    src_ip|cidr:
    - 10.99.0.0/24
    - 10.99.1.0/24
  condition: selection_config and not filter_mgmt_src
fields:
- message
- src_ip
falsepositives:
- Emergency console access
- Out-of-band management appliance
- Network vendor change window
level: critical

