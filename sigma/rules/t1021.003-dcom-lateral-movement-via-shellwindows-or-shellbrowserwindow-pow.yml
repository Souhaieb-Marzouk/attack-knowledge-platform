title: DCOM Lateral Movement via ShellWindows or ShellBrowserWindow (PowerShell 4104)
id: b7e8a340-2f5c-49da-9c13-6d84f0e2a19b
status: experimental
description: Detects PowerShell script blocks that create hidden Explorer COM objects (ShellWindows or ShellBrowserWindow) and call ShellExecute, or that resolve any Shell-named ProgID together with CreateInstance; the DCOM remote execution pattern.
references:
- https://attack.mitre.org/techniques/T1021/003/
- https://enigma0x3.net/2017/01/23/lateral-movement-via-dcom-round-2/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: powershell
detection:
  selection_shellwindows:
    EventID: 4104
    ScriptBlockText|contains: ShellWindows
  selection_browserwindow:
    EventID: 4104
    ScriptBlockText|contains: ShellBrowserWindow
  selection_gettype_shell:
    EventID: 4104
    ScriptBlockText|contains|all:
    - GetTypeFromProgID
    - Shell
  condition: 1 of selection_*
falsepositives:
- Administration scripts that manage Explorer settings on a remote host
level: high

