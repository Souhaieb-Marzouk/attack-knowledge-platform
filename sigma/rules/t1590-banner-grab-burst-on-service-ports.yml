title: Banner Grab Burst on Service Ports
id: c25a6f18-9b47-4e03-8d61-a94f0b3c7e25
status: test
description: 'One external source opens many short TCP connections to service ports, transfers zero bytes,
  and ends each one with a reset. This is the typical shape of banner grabbing and service fingerprinting
  before an attack (MITRE ATT&CK T1590). Detection note: this is the event-level half. Apply the SIEM
  threshold count(id.orig_h) > 40 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590
logsource:
  category: network
  product: zeek
detection:
  selection_state:
    conn_state:
    - S0
    - REJ
    - RSTO
    - RSTR
  selection_bytes:
    orig_bytes: 0
  condition: selection_state and selection_bytes
  timeframe: 5m
falsepositives:
- Internet-wide scanning services with known source addresses
- Network monitoring probes that check service health
level: high
