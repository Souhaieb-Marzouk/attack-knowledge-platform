title: AWS SES Send Primitives Used by Unapproved Principal
id: 0dd874a5-080a-4b5e-8f66-af3dc80e67ce
status: experimental
description: Detects SES sending API calls (SendEmail, SendRawEmail, SendBulkTemplatedEmail) issued by a principal that is
  not an approved sender role. Mass phishing from a compromised identity is the core pattern of ATT&CK T1496.004. Maps to
  analytic AN0417 of detection strategy DET0147.
references:
- https://attack.mitre.org/techniques/T1496/004/
- https://news.sophos.com/en-us/2023/01/12/ses-pionage/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_send:
    eventSource:
    - email.amazonaws.com
    - ses.amazonaws.com
    eventName:
    - SendEmail
    - SendRawEmail
    - SendBulkTemplatedEmail
    - SendTemplatedEmail
  filter_approved:
    userIdentity.arn|contains:
    - assumed-role/ses-mailer
    - assumed-role/billing-mailer
    - assumed-role/ci-notifier
  condition: selection_send and not filter_approved
fields:
- eventName
- userIdentity.arn
- userIdentity.accessKeyId
- sourceIPAddress
- awsRegion
- userAgent
falsepositives:
- New sending microservices that were not added to the approved list yet
- Admins testing SES from the console during a documented change window
level: critical
tags:
- attack.t1496.004
