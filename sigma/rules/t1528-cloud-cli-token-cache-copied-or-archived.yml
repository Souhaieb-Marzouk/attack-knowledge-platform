title: Cloud CLI Token Cache Copied or Archived
id: 3c4d5e6f-7a8b-4c9d-8e0f-2a3b4c5d6e7f
status: experimental
description: An archiving, copy, or shell command touches local token caches and secret files of cloud CLIs (Azure, AWS, Google Cloud, SSH). Infostealers and hands-on attackers grab these files to reuse valid tokens (T1528.001).
references:
- https://attack.mitre.org/techniques/T1528/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.t1528.001
- attack.credential-access
- attack.t1528
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools:
    Image|endswith:
    - \7z.exe
    - \7za.exe
    - \rar.exe
    - \winrar.exe
    - \tar.exe
    - \zip.exe
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
  selection_paths:
    CommandLine|contains:
    - msal_token_cache
    - azureProfile
    - .aws\credentials
    - legacy_credentials
    - access_tokens.db
    - .ssh\id_
  condition: selection_tools and selection_paths
falsepositives:
- Backup jobs, dotfiles sync, or developer scripts that copy their own profile folders.
level: high

