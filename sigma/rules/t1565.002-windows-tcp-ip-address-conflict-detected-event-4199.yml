title: Windows TCP/IP Address Conflict Detected (Event 4199)
id: 4f1a9c2e-8b7d-4e63-9a41-6c0d5f8b2e17
status: experimental
description: Detects Microsoft-Windows-Tcpip Event ID 4199. The system logs this event when another device on the local network
  claims the same IP address. An attacker claiming the victim IP or the gateway IP with a second MAC is positioning for on-path
  traffic interception.
references:
- https://attack.mitre.org/techniques/T1565/002/
- https://attack.mitre.org/techniques/T1557/002/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 4199
    Provider_Name: Microsoft-Windows-Tcpip
  condition: selection
fields:
- EventID
- Computer
falsepositives:
- Two devices configured with the same static address by mistake
- Test equipment restored from a cloned disk image
level: high
tags:
- attack.t1565.002
