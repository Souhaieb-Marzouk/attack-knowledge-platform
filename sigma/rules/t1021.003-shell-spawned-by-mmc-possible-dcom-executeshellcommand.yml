title: Shell Spawned by MMC (Possible DCOM ExecuteShellCommand)
id: 4d1c86e5-93ab-42f7-b0d4-2a8f6e5c3d10
status: stable
description: Detects cmd, powershell, or wscript processes created by mmc.exe. MMC is a graphical console;
  it does not spawn shells on its own. A remote DCOM ExecuteShellCommand call through MMC20.Application
  does exactly this.
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  category: process_creation
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith: \mmc.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
  condition: selection_parent and selection_child
falsepositives:
- Rare admin automation that launches MMC-managed tools on purpose
level: high
