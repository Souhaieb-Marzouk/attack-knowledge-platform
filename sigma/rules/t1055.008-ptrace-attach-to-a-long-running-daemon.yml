title: Ptrace Attach to a Long-Running Daemon
id: e8caf746-81e5-46d9-baf2-5e103aab7fdb
status: experimental
description: Detects a ptrace attach request (PTRACE_ATTACH, first argument 0x10) made by a process that is not a known developer or support tool. Attackers use the attach to stop a trusted daemon and inject code into it (MITRE ATT&CK T1055.008).
references:
- https://attack.mitre.org/techniques/T1055/008/
- https://man7.org/linux/man-pages/man2/ptrace.2.html
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.008
logsource:
  product: linux
  service: auditd
detection:
  selection:
    syscall: ptrace
    a0|contains: '0x10'
  filter_known_tools:
    proc.name|endswith:
    - gdb
    - strace
    - lldb
  condition: selection and not filter_known_tools
fields:
- host.name
- proc.name
- exe
- auid
- uid
- target.pid
falsepositives:
- Developers or support engineers attaching a debugger to a service during a live incident.
- APM (Application Performance Monitoring) agents, crash handlers, or profilers that use ptrace.
level: high

