title: Large Egress After VNC Session
id: a2f83d57-6e41-4b09-93c8-5b7e2c4d1f96
status: experimental
description: 'Detects a VNC session on port 5900 that moves an unusually large volume of bytes. Remote-control visits that carry a gigabyte are usually setup for collecting and copying data out of stores, kiosks, and file servers. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Souhaieb Marzouk
date: '2026-10-27'
tags:
- attack.lateral-movement
- attack.exfiltration
- attack.t1021.005
- attack.t1041
logsource:
  category: network
  service: netflow
detection:
  selection_session:
    dst_port: 5900
  condition: selection_session
falsepositives:
- A backup or file-transfer window that overlaps support sessions
level: medium

