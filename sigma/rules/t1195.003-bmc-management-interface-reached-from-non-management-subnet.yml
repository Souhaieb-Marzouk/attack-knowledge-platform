title: BMC Management Interface Reached from Non-Management Subnet
id: cd51723e-fd8b-4144-be31-04ae3bcb3c52
status: experimental
description: Server management controllers (BMCs) must be reachable only from the dedicated management subnets. Any other source reaching them means a segmentation failure that puts server firmware within reach.
references:
- https://attack.mitre.org/techniques/T1195/003/
- https://www.cisa.gov/news-events/alerts/2013/07/26/risks-using-intelligent-platform-management-interface-ipmi
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.lateral_movement
- attack.t1021
- attack.initial_access
- attack.t1195.003
logsource:
  category: firewall
detection:
  selection_dest:
    dst_ip|cidr: 10.60.0.0/16
  selection_port:
    dst_port:
    - 443
    - 22
    - 623
  filter_mgmt_src:
    src_ip|cidr:
    - 10.61.0.0/16
    - 10.62.0.0/16
  condition: selection_dest and selection_port and not filter_mgmt_src
fields:
- src_ip
- dst_ip
- dst_port
- action
falsepositives:
- Documented admin jump paths not yet in the management range list; add them deliberately.
level: high

