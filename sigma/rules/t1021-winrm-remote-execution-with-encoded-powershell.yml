title: WinRM Remote Execution with Encoded PowerShell
id: e1c0b916-7164-46da-a859-00ccb54124f5
status: stable
description: Detects PowerShell script blocks or process creations that use encoded commands (-enc / -EncodedCommand
  / FromBase64String). Delivered through WinRM, this combination is a strong sign of attacker remote execution.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021
- attack.t1021.006
- attack.t1059.001
logsource:
  product: windows
  service: powershell
detection:
  selection_4104:
    EventID: 4104
    ScriptBlockText|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - FromBase64String
  condition: selection_4104
falsepositives:
- Rare admin or deployment scripts that wrap long commands
level: high
