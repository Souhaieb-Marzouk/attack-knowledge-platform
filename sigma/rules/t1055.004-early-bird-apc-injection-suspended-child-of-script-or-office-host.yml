title: Early Bird APC Injection - Suspended Child of Script or Office Host
id: 08fa29a3-cd8a-4932-9f46-9462786631b5
status: experimental
description: Detects the signature Early Bird pattern of T1055.004. A script or Office host creates a process with the CREATE_SUSPENDED flag, which is the usual setup step before QueueUserAPC injection. Note that legit svchost.exe children come from services.exe, so any other parent is already unusual.
references:
- https://attack.mitre.org/techniques/T1055/004/
- https://www.cybereason.com/blog/research/injecting-all-over-early-bird-injection
- https://github.com/SigmaHQ/sigma
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.004
logsource:
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
  selection_image:
    Image|endswith:
    - \rundll32.exe
    - \regsvr32.exe
    - \dllhost.exe
    - \svchost.exe
  selection_flags:
    CreationFlags|contains: '4'
  condition: selection_parent and selection_image and selection_flags
fields:
- EventID
- Image
- CommandLine
- ParentImage
- CreationFlags
- User
falsepositives:
- Installers or update tools launched from a script can create suspended children.
- CreationFlags is a bitmask. Substring matching for '4' also matches composite masks that merely include the suspended bit, so verify the value or use the bitwise SPL.
level: critical

