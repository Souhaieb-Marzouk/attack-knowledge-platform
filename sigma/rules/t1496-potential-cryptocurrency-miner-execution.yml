title: Potential Cryptocurrency Miner Execution
id: bd97cc57-7d61-449e-a2e3-6eae9b7d1ce9
status: experimental
description: Detects process creation where image name, path, or command line matches cryptocurrency miner patterns, including
  renamed miners started from temp paths by web-server processes. Maps to ATT&CK T1496 / T1496.001 and analytic AN0741.
references:
- https://attack.mitre.org/techniques/T1496/
- https://attack.mitre.org/techniques/T1496/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
detection:
  selection_miner_name:
    Image|endswith:
    - \xmrig.exe
    - \minerd.exe
    - \cpuminer.exe
    - \kinsing.exe
    - \kdevtmpfsi.exe
  selection_pool_arg:
    CommandLine|contains:
    - stratum+tcp://
    - stratum+ssl://
    - --donate-level
    - -o pool.
  selection_temp_and_webparent:
    Image|startswith:
    - C:\Temp\
    - C:\Windows\Temp\
    - C:\Users\Public\
    ParentImage|endswith:
    - \w3wp.exe
    - \httpd.exe
    - \apache.exe
    - \java.exe
  condition: 1 of selection_*
fields:
- Image
- CommandLine
- ParentImage
- User
- Hashes
falsepositives:
- Authorized mining research labs (tag and exclude those hosts)
- Software installers that legitimately unpack to Temp and spawn java.exe
level: high
tags:
- attack.t1496
