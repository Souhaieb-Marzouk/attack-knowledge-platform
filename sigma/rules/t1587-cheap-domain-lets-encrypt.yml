title: New Cheap Domain with Let's Encrypt Cert
id: b24d194f-3f53-47fd-97c1-0a99297c6ffc
status: experimental
description: Looks for a new cheap domain using a free Let's Encrypt certificate. This is normal for small sites, but also common for short-lived attack infrastructure.
references:
- https://attack.mitre.org/techniques/T1587/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1587
logsource:
  category: network
  product: zeek
  service: ssl
detection:
  selection:
    sni|endswith:
    - .top
    - .xyz
    - .live
    certificate.issuer|contains: Let's Encrypt
  condition: selection
fields:
- certificate.issuer
- sni
falsepositives:
- New small business sites
- Marketing landing pages
- Developer test domains
level: low

