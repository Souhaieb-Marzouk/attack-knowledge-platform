title: VNC Server Process from User-Writable Path
id: b3a94c71-5d28-4e0f-8f6a-19c2e7d4b351
status: stable
description: Detects a VNC-named executable running from a folder users can write to. Attackers drop small
  VNC servers into Public, Temp, or AppData folders for hidden remote-control access that survives reboots.
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Detection Engineering Team
date: '2026-10-27'
tags:
- attack.lateral-movement
- attack.persistence
- attack.t1021.005
logsource:
  product: windows
  service: sysmon
detection:
  selection_img:
    Image|endswith:
    - \winvnc.exe
    - \vncserver.exe
    - \tvnserver.exe
    - \minivnc.exe
    - \uvnc.exe
  selection_path:
    Image|contains:
    - \AppData\
    - \Temp\
    - \Users\Public\
  condition: selection_img and selection_path
falsepositives:
- A portable VNC tool an admin ran from a folder on purpose
level: high
