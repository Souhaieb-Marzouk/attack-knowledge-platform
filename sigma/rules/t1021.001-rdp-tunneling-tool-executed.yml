title: RDP Tunneling Tool Executed
id: f58d9c13-6b2a-4e4f-9a38-d1c0e5f2b966
status: stable
description: Detects the launch of well-known tunneling tools or any process in a Temp folder using reverse
  port forwarding. Attackers use these to reach internal RDP through an allowed outbound port.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.command-and-control
- attack.t1021.001
- attack.t1572
logsource:
  product: windows
  service: sysmon
detection:
  selection_tools:
    EventID: 1
    Image|endswith:
    - \plink.exe
    - \chisel.exe
    - \ngrok.exe
    - \iox.exe
    - \ew.exe
    - \socat.exe
  selection_reverse:
    EventID: 1
    Image|contains: \Temp\
    CommandLine|contains: ' -R '
  condition: 1 of selection_*
falsepositives:
- Approved admins using SSH tunnels for planned maintenance
level: critical
