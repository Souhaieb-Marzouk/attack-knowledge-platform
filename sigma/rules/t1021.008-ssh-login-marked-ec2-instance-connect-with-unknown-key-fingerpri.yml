title: SSH Login Marked ec2-instance-connect with Unknown Key Fingerprint
id: 2f8a4c6e-7d3b-4a12-8f6d-9e5b1c0a4d37
status: experimental
description: Detects an accepted SSH login on a Linux instance whose auth log message contains the provider marker ec2-instance-connect, where the key fingerprint is not one of the approved admin fingerprints. This is where the cloud event becomes a real session on the machine.
references:
- https://attack.mitre.org/techniques/T1021/008/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: authentication
  product: linux
detection:
  selection:
    message|contains: ec2-instance-connect
  filter_known_fingerprints:
    message|contains:
    - SHA256:K1ownAdminFingerprintExample00000000000000000000
    - SHA256:K2ownAdminFingerprintExample00000000000000000000
  condition: selection and not filter_known_fingerprints
falsepositives:
- Approved EC2 Instance Connect use by admins whose fingerprints are not in the list yet
level: high

