title: PTR Reverse Sweep Against the Victim Network
id: 5a8c1e3f-9d2b-4a7c-b3e5-8f1a2c4d6e03
status: experimental
description: 'Detects a burst of reverse DNS (PTR) lookups for addresses inside the victim in-addr.arpa zone. Attackers sweep PTR records to map address blocks to hostnames while staying quiet (MITRE ATT&CK T1590.005). Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/005/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.005
logsource:
  category: dns
  product: bind
detection:
  selection:
    query_type: PTR
    query|endswith: .in-addr.arpa
  timeframe: 5m
  condition: selection
falsepositives:
- mail servers and spam filters that resolve many addresses
- approved asset discovery inside your own network
level: medium

