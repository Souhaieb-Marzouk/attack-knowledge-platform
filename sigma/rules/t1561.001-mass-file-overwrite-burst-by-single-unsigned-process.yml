title: Mass File Overwrite Burst by Single Unsigned Process
id: 3f2a9c7e-5b14-4d8e-a6c9-1e7d4b2f8a10
status: experimental
description: Detects a single process creating or overwriting an extreme number of files within five minutes on a Windows
  host, the dominant pattern of a disk content wipe (MITRE ATT&CK T1561.001).
references:
- https://attack.mitre.org/techniques/T1561/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
  timeframe: 5m
  condition: selection
fields:
- Image
- CommandLine
- User
- TargetFilename
falsepositives:
- Backup or sync agents that rewrite large trees
- Build or deployment pipelines copying artifacts
level: critical
tags:
- attack.t1561.001
