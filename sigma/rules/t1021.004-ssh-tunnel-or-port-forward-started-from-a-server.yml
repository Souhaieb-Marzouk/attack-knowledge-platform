title: SSH Tunnel or Port Forward Started from a Server
id: 7c0f9a3e-45d1-4b28-8e6c-b2d4f6a91c08
status: stable
description: Detects an ssh process with dynamic (-D), remote (-R), local (-L), or tun-interface (-w)
  forwarding flags. Triage hits on servers first; admins normally run -L only from laptops.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Detection Engineering Team
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.command-and-control
- attack.exfiltration
- attack.t1021.004
- attack.t1572
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - /ssh
  selection_flags:
    CommandLine|contains:
    - ' -D '
    - ' -R '
    - ' -L '
    - ' -w '
  condition: selection_img and selection_flags
falsepositives:
- Documented admin tooling that forwards ports from servers (allow list the exact command lines)
- Monitoring agents that use SSH-based port forwarding as a backup channel
level: high
