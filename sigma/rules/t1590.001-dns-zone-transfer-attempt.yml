title: DNS Zone Transfer Attempt
id: c74a2e9f-6b31-4d58-8f02-9a1c4e7d3b60
status: stable
description: Detects AXFR zone transfer attempts in name server logs. An outside AXFR asks for a copy
  of the whole zone in one request, which is reconnaissance of the full record set. This covers threat
  3 of section 5.3. Allowlist approved secondaries by address before enabling alerting.
references:
- https://attack.mitre.org/techniques/T1590/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.001
logsource:
  category: dns
  product: linux
  service: named
detection:
  selection:
    message|contains: AXFR
  condition: selection
falsepositives:
- Approved secondary name servers syncing from new provider addresses
- Zone transfer health checks from monitoring systems
level: high
