title: Process from a User Folder Opens LSASS
id: 3f1e8a2c-0008-4b6d-9c2e-5a7f8d9e0a08
status: test
description: On a home PC, almost no legitimate program in a user-writable folder has a reason to open
  LSASS. Every hit deserves a check.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    SourceImage|startswith:
    - C:\Users\
    - C:\ProgramData\
    - C:\Windows\Temp\
  condition: selection
falsepositives:
- Almost none on a home PC; check every hit at once
level: high
tags:
- attack.privilege-escalation
- attack.t1134.001
