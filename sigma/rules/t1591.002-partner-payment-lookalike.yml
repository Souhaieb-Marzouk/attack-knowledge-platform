title: Partner Lookalike Sending Payment Mail
id: 7770128f-ef6b-43d7-93d6-07f63c34aec6
status: experimental
description: Detects a partner lookalike domain sending invoice or payment mail. Verify with the partner through a known phone number, not the reply-to.
references:
- https://attack.mitre.org/techniques/T1591/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1591.002
logsource:
  category: application
  product: mail_gateway
detection:
  selection_lookalike:
    lookalike_of|contains: partner
  selection_subject:
    subject|contains:
    - invoice
    - payment
    - bank detail
    - banking detail
    - wire transfer
  condition: selection_lookalike and selection_subject
fields:
- lookalike_of
- subject
falsepositives:
- Partner's new billing domain
- Payment processor containing partner name
- Marketing domain for a partner
level: high

