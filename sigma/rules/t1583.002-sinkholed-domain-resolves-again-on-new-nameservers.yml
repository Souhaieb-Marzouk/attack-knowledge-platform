title: Sinkholed Domain Resolves Again on New Nameservers
id: 359d2608-8efe-4daf-9a19-686dee7efdfb
status: experimental
description: A domain on the team sinkhole watchlist answers successfully again, usually on new nameservers and new IPs. Fast-flux operators re-delegate blocked domains (T1583.002) within days. Keep the watchlist fed from your own block actions and from intel reports.
references:
- https://attack.mitre.org/techniques/T1583/002/
- https://www.europol.europa.eu/media-press/newsroom/news/avalanche-network-dismantled-in-international-cyber-operation
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1583
- attack.t1583.002
logsource:
  category: network
  product: zeek
  service: dns
detection:
  selection:
    rcode_name: NOERROR
    query|endswith:
    - corp-login.net
    - cdn-update.site
    - safe-tracker.top
  filter_sinkhole:
    answers|contains: 10.10.90.90
  condition: selection and not filter_sinkhole
fields:
- id.orig_h
- query
- answers
- rcode_name
falsepositives:
- A legitimate owner re-registering an expired domain
- Your own domain migrations if a watchlist entry was added by mistake
level: medium

