title: Remote Thread Created in Business Application Process
id: 7c1e9a42-3d5b-4e68-9f02-84a6c0d13b71
status: experimental
description: Detects Sysmon EventID 8 (CreateRemoteThread) into business-critical application processes such as finance, ERP,
  or reporting tools. Attackers inject code to patch in-memory data and change what the application displays or produces (MITRE
  ATT&CK T1565.003).
references:
- https://attack.mitre.org/techniques/T1565/003/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 8
    TargetImage|endswith:
    - \finapp.exe
    - \finrep.exe
    - \erpclient.exe
    - \pos.exe
  filter_known:
    SourceImage|endswith:
    - \csagent.exe
    - \MsMpEng.exe
    - \sentinelagent.exe
  condition: selection and not filter_known
fields:
- SourceImage
- TargetImage
- StartAddress
- StartModule
- User
- CallTrace
falsepositives:
- EDR, antivirus, or APM agents not yet in the allowlist
- Vendor support tools during approved maintenance windows
level: critical
tags:
- attack.t1565.003
