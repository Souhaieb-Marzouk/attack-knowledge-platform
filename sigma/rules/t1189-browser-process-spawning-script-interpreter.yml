title: Browser Process Spawning Script Interpreter
id: 4a1b9e2c-8d73-4f56-9c21-6b0a7d4e3f18
status: experimental
description: Detects a web browser spawning command-line interpreters or script hosts. This relationship appears when drive-by
  exploits hand off to a payload, regardless of which vulnerability was used.
references:
- https://attack.mitre.org/techniques/T1189/
- https://attack.mitre.org/techniques/T1203/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \iexplore.exe
    - \brave.exe
    - \opera.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \mshta.exe
    - \rundll32.exe
    - \regsvr32.exe
    - \wscript.exe
    - \cscript.exe
    - \powershell.exe
  condition: selection_parent and selection_child
fields:
- ParentImage
- Image
- CommandLine
- User
falsepositives:
- Rare developer workflows that launch browsers via scripts (allow-list by host)
level: high
tags:
- attack.t1189
