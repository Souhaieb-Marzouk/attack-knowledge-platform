title: DCOM Activation Permission Error (Event 10036)
id: c8b25e91-3d47-4f0a-a6b3-7e9f2c1d84a5
status: experimental
description: Detects rejected COM activations in the Microsoft-Windows-DCOM Operational log. The message contains the client address. Repeated errors from a host that does not administer the target suggest DCOM probing or lateral movement attempts with wrong permissions.
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  service: microsoft-windows-dcom/operational
detection:
  selection:
    EventID: 10036
  condition: selection
falsepositives:
- Legacy applications with misconfigured launch permissions
level: medium

