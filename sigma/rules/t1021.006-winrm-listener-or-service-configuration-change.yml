title: WinRM Listener or Service Configuration Change
id: 5e8c100f-b6b0-48d7-ad40-8081b3fb933c
status: experimental
description: Detects writes to WinRM listener registry keys and changes to the WinRM service configuration key. Attackers enable or modify listeners to keep a remote channel open, or install a service named after WinRM. Pair this rule with event 7045 (new service installed) filtered on WinRM, which the matching SPL query includes.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.006
logsource:
  product: windows
  service: sysmon
detection:
  selection_listener:
    EventID: 13
    TargetObject|contains: \WSMAN\Listener
  selection_service_key:
    EventID: 13
    TargetObject|contains: \Services\WinRM
  condition: selection_listener or selection_service_key
falsepositives:
- Planned GPO changes that configure WinRM across the fleet
- The winrm quickconfig command run during approved server setup
level: medium

