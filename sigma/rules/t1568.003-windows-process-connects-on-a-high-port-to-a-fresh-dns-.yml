title: Windows Process Connects on a High Port to a Fresh DNS Answer IP
id: e3a1c8f2-4b7d-4c95-9a2e-6f1d8b3c5a70
status: experimental
description: 'Detects a Windows process opening an outbound TCP connection to a high, non-standard destination port. This
  is the per-event precursor for DNS Calculation (T1568.003): the full detection joins Sysmon Event ID 22 (DNS query) with
  Event ID 3 (network connection) on ProcessGuid and tests whether the connection port equals a calculation on the answer
  octets, exactly as the matching SPL below implements per the official analytic AN0728.'
references:
- https://attack.mitre.org/techniques/T1568/003/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationPort|gte: 1024
  filter_common:
    DestinationPort:
    - 3389
    - 5985
    - 5986
    - 8530
    - 8531
  filter_private:
    DestinationIp|startswith:
    - '10.'
    - 192.168.
    - 172.16.
    - 172.17.
    - 172.18.
  condition: selection and not 1 of filter_*
fields:
- Image
- DestinationIp
- DestinationPort
- ProcessGuid
falsepositives:
- Software with its own update channel on a custom port
- Developer tools and authorized red-team tunnels
level: medium
tags:
- attack.t1568.003
