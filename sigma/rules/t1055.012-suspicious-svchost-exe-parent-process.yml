title: Suspicious svchost.exe Parent Process
id: 576777b0-6d13-44f6-b62c-62fdfa216922
status: experimental
description: Detects svchost.exe starting with a parent that is not a known Windows service host parent. Process hollowing creates svchost.exe from a user-mode loader, so this rule catches the setup step.
references:
- https://attack.mitre.org/techniques/T1055/012/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.privilege_escalation
- attack.t1055
- attack.t1055.012
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 1
    Image|endswith: \svchost.exe
  filter_known_parents:
    ParentImage|endswith:
    - \services.exe
    - \svchost.exe
    - \wininit.exe
    - \winlogon.exe
    - \smss.exe
    - \csrss.exe
  condition: selection and not filter_known_parents
fields:
- Image
- CommandLine
- ParentImage
- ParentCommandLine
- User
- Hashes
falsepositives:
- Custom agents that legitimately start service-host style processes
- Installers that briefly spawn service hosts during setup
level: high

