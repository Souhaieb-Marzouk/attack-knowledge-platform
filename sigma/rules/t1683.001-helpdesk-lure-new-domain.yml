title: Help Desk Lure from New Domain
id: 02b41e17-6d64-4db6-9bff-bad9bdc1203f
status: experimental
description: Detects a first-contact email that pretends to be HR, payroll, or IT support from a very new domain. Check the link before the user clicks.
references:
- https://attack.mitre.org/techniques/T1683/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1683.001
logsource:
  category: email
  product: proofpoint
  service: tap
detection:
  selection_theme:
    display_name|contains:
    - 'HR '
    - Service Center
    - Helpdesk
    - Payroll
    - IT Support
  selection_first_contact:
    first_contact: 'true'
  selection_new_domain:
    domain_age_days|lt: 14
  filter_internal:
    sender_domain|endswith: yourcompany.com
  filter_partners:
    sender_domain|endswith:
    - benefits-partner.com
    - payroll-provider.com
  condition: selection_theme and selection_first_contact and selection_new_domain and not filter_internal and not filter_partners
fields:
- display_name
- domain_age_days
- first_contact
- sender_domain
falsepositives:
- New HR vendor
- Payroll provider using a new domain
- Internal IT using an external ticket system
level: high

