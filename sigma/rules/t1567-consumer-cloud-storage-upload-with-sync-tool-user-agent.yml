title: Consumer Cloud Storage Upload with Sync Tool User Agent
id: 17486468-c4f6-4204-898f-2c077c0de268
status: experimental
description: Detects uploads to consumer cloud storage with sync-tool user agents such as rclone, azcopy, or MEGAync, or direct
  uploads to known personal storage endpoints. This is the dominant pre-encryption exfiltration pattern in modern ransomware
  playbooks.
references:
- https://attack.mitre.org/techniques/T1567/002/
- https://redcanary.com/blog/rclone-mega-extortion-tooling/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  selection_tool:
    cs_user_agent|contains:
    - rclone
    - azcopy
    - MEGAync
  selection_consumer_target:
    cs_method: POST
    r_host|endswith:
    - mega.nz
    - api.mega.co.nz
  filter_corporate:
    r_host|endswith:
    - corp.example
    - mycompany.fileshare.example
  condition: selection_tool or (selection_consumer_target and not filter_corporate)
fields:
- src_ip
- user
- r_host
- cs_user_agent
- bytes_out
falsepositives:
- Managed backup or archive jobs to an approved tenant that use the same clients
- Developers syncing to a project-owned storage bucket as part of their work
level: high
tags:
- attack.t1567
