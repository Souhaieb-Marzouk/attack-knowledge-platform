title: VPN Portal Credential Stuffing Burst
id: 5a9e02c7-6f31-4a45-b8d9-2c18e47f3404
status: stable
description: 'Detects many failed VPN logins from one source in a short window, the follow-up step after
  leaked or guessed appliance credentials (T1590.006). Detection note: this is the event-level half. Apply
  the SIEM threshold count(src_ip) > 5 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.006
logsource:
  category: firewall
  product: fortios
  service: vpn
detection:
  sel_fail:
    action: login
    status: failed
  condition: sel_fail
falsepositives:
- One user who forgot a new password
- Mobile clients with stale saved passwords
level: critical
