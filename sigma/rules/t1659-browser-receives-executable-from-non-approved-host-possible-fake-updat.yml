title: Browser Receives Executable from Non-Approved Host (Possible Fake Update)
id: e4e7cb2d-2d55-420c-ab70-85f8a65ecf63
status: experimental
description: Detects a browser session receiving a Windows executable (fake update pattern) from a host that is not on the approved update source list. Upstream content injection delivers malware this way without touching your servers.
references:
- https://attack.mitre.org/techniques/T1659/
- https://www.welivesecurity.com/en/eset-research/moustachedbouncer-espionage-against-foreign-diplomats-in-belarus/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1659
- attack.tactic.initial-access
- attack.tactic.command-and-control
logsource:
  category: network
  product: zeek
  service: http
detection:
  selection_mime:
    resp_mime_types|contains: application/x-dosexec
  filter_approved:
    host|endswith:
    - windowsupdate.com
    - microsoft.com
    - msedge.akamaized.net
    - internal-software.corp.local
  condition: selection_mime and not filter_approved
fields:
- id.orig_h
- host
- uri
- resp_mime_types
- response_body_len
falsepositives:
- Approved software repositories missing from the allow list
- Internal update servers with unlisted hostnames
level: high

