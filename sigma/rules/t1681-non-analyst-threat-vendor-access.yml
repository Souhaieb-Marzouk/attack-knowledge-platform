title: Non-Analyst Threat Vendor Access
id: fae11b5a-49d1-4fc3-bd20-14c7c390e20a
status: experimental
description: Looks for users outside the intel team reaching threat-intelligence vendor sites. This is not always malicious; check whether the user has a business reason.
references:
- https://attack.mitre.org/techniques/T1681/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1681
logsource:
  category: proxy
  product: zscaler
detection:
  selection_domains:
    url_domain|endswith:
    - threatvendor.example
    - virustotal.com
    - shodan.io
    - recordedfuture.com
  filter_analysts:
    user:
    - analyst1@corp.example
    - analyst2@corp.example
    - intel-team@corp.example
  condition: selection_domains and not filter_analysts
fields:
- url_domain
- user
falsepositives:
- Security-aware users checking a file
- Incident responders outside the intel team
- Approved vendor training
level: low

