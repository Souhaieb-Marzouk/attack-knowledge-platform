title: Office Application Spawning Command Interpreter
id: 1a7c2d4e-8f3b-4e91-9c2a-5d6e7f8a9b01
status: stable
description: Detects Word, Excel, PowerPoint, or Outlook starting powershell, cmd, mshta, or the Windows
  Script Host. This is the classic macro phishing execution pattern (T1566.001 followed by user execution).
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Guide Team
date: '2025-11-18'
tags:
- attack.initial-access.t1566
- attack.execution.t1059
- attack.t1566.001
- attack.t1566
- attack.initial-access
logsource:
  category: process_creation
  product: windows
  definition: Sysmon Event ID 1 or equivalent EDR process events
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
  selection_child:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
  condition: selection_parent and selection_child
falsepositives:
- Rare in-house Office add-ins that launch helper scripts; allowlist them by hash and path.
- Security awareness simulations that intentionally run payloads on test tenants.
level: critical
