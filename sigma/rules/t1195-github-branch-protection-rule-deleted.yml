title: GitHub Branch Protection Rule Deleted
id: 06dfeaf0-44bf-4043-b794-9acd895f6d83
status: experimental
description: A branch protection rule was removed. Attackers preparing to poison a build often delete protection before pushing unreviewed code to a release branch. This also covers insider mistakes that weaken review.
references:
- https://attack.mitre.org/techniques/T1195/
- https://docs.github.com/en/organizations/keeping-your-organization-secure/reviewing-the-audit-log-for-your-organization
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.defense_evasion
- attack.t1562.001
- attack.initial_access
- attack.t1195
logsource:
  product: github
  service: github.audit
detection:
  selection:
    action: protected_branch.destroy
  condition: selection
fields:
- action
- actor
- repo
- branch
- created_at
- ip
falsepositives:
- Planned reorganization work by platform admins; verify against a change ticket.
level: high

