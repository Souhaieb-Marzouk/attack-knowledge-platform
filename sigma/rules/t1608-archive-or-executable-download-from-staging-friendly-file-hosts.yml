title: Archive or Executable Download from Staging-Friendly File Hosts
id: 25980ee1-3c42-4100-8655-731397e6c04e
status: experimental
description: Detects a user downloading archive, executable, or script content from public file-sharing or code-sharing services commonly abused to stage malware (ATT&CK T1608 / T1608.001). Combine with referer context to find search or webmail-driven delivery.
references:
- https://attack.mitre.org/techniques/T1608/
- https://attack.mitre.org/techniques/T1608/001/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.001
- attack.command_and_control
- attack.t1105
logsource:
  category: proxy
detection:
  selection_hosts:
    cs-host|endswith:
    - .anonfiles.com
    - gofile.io
    - transfer.sh
    - cdn.discordapp.com
    - raw.githubusercontent.com
    - ddownload.com
  selection_file:
    cs-method: GET
    c-uri-extension|contains:
    - zip
    - exe
    - msi
    - js
    - vbs
    - hta
  condition: selection_hosts and selection_file
fields:
- cs-host
- c-uri
- src_ip
- user
- c-useragent
falsepositives:
- Developers or IT staff legitimately fetching releases or packages.
- Approved design teams sharing large assets over these services.
level: high

