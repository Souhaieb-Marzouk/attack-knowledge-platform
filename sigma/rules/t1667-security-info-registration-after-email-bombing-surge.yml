title: Security Info Registration After Email Bombing Surge
id: 7c1e2a94-3f6d-4b8e-9a21-5d0c8f4e17b3
status: experimental
description: Detects a user registering security info (an MFA method) in Entra ID. In the T1667 email bombing pattern this
  event follows a mailbox flood and a fake IT help desk call, so pair this rule with an inbound mail-volume alert. The registration
  is often the account-takeover moment.
references:
- https://attack.mitre.org/techniques/T1667/
- https://attack.mitre.org/detectionstrategies/DET0355/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: cloud
  product: m365
  service: azure_audit
detection:
  selection:
    Operation: User registered security info
  condition: selection
fields:
- Operation
- UserId
- ClientIP
falsepositives:
- Planned MFA rollouts and device migrations
- New hires enrolling their first authenticator app
level: critical
tags:
- attack.t1667
