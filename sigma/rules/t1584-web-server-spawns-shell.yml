title: Web Server Spawning cmd or PowerShell
id: 5025e6ff-5e82-408b-ab5c-e8276059b07f
status: experimental
description: Looks for a web server worker process (w3wp, httpd, nginx, tomcat) starting cmd, PowerShell, or another script host. This is common after a web shell or upload bug, but some old admin scripts do it too.
references:
- https://attack.mitre.org/techniques/T1584/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \w3wp.exe
    - \httpd.exe
    - \nginx.exe
    - \tomcat9.exe
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \mshta.exe
  condition: selection_parent and selection_child
fields:
- Image
- ParentImage
falsepositives:
- Legacy admin scripts started by the web app
- Maintenance jobs that call PowerShell from the web server
- Application pool accounts running health checks
level: high

