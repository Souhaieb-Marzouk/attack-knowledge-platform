title: Office-Descendant Process Created Run Key or Startup Persistence
id: 9d3e5f42-6a1c-4b78-8d24-f5e6a7b8c906
status: stable
description: 'Detects Office applications or PowerShell writing to autostart

  registry locations. Malware from a phishing attachment (T1566.001)

  survives reboots this way (T1547.001).'
references:
- https://attack.mitre.org/techniques/T1566/001/
- https://attack.mitre.org/techniques/T1547/001/
author: Detection Engineering Team
date: '2026-09-25'
tags:
- attack.initial-access
- attack.persistence
- attack.t1566.001
- attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  selection_process:
    Image|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
    - \ONENOTE.EXE
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
  selection_location:
    TargetObject|contains:
    - \CurrentVersion\Run
    - \CurrentVersion\RunOnce
    - \Explorer\StartupApproved\Run
    - \CurrentVersion\Windows\Load
    - UserInitMprLogonScript
  condition: selection_process and selection_location
falsepositives:
- Very rare from Office processes. Treat every hit as malicious until the command line and file path prove
  otherwise.
level: high
