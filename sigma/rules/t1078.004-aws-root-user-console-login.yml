title: AWS Root User Console Login
id: d4bff473-cc84-4d81-9d06-8ba48b6bbc73
status: experimental
description: Detects any console sign-in performed by the AWS account root user. Root use should be limited to a documented break-glass procedure, so every login must be reviewed even when it is expected. MFAUsed equal to No raises the urgency further, because it means the root password alone opened the console.
references:
- https://attack.mitre.org/techniques/T1078/004/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1078.004
- attack.initial_access
- attack.persistence
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_root_login:
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection_root_login
fields:
- userIdentity.type
- userIdentity.accountId
- sourceIPAddress
- userAgent
- additionalEventData.MFAUsed
- additionalEventData.LoginTo
falsepositives:
- Documented break-glass logins executed exactly per the runbook
- Provider-initiated support sessions performed with explicit approval
level: high

