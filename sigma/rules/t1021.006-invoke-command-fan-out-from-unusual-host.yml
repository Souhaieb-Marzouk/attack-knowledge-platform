title: Invoke-Command Fan-Out from Unusual Host
id: 84a89ef8-c7bc-4e5f-be20-53c04296f2cd
status: stable
description: Detects PowerShell script blocks that call Invoke-Command with a list of -ComputerName targets
  from a host that is not an approved jump server. This is one command prepared to hit many servers at
  once. Hosts outside the approved jump server list are the interesting ones.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.006
- attack.t1059.001
logsource:
  product: windows
  service: powershell
detection:
  selection_invoke:
    EventID: 4104
    ScriptBlockText|contains|all:
    - Invoke-Command
    - -ComputerName
  filter_admin:
    Computer:
    - JUMP-SRV-01.corp.local
    - JUMP-SRV-02.corp.local
  condition: selection_invoke and not filter_admin
falsepositives:
- Approved automation accounts that run remoting jobs from management hosts
- Runbooks on the jump servers that are missing from the filter list
level: medium
