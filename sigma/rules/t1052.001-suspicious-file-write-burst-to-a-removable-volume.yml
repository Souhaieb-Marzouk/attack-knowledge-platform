title: Suspicious File Write Burst to a Removable Volume
id: 3f6b9d2e-8a51-4c97-b2e4-19d0c7a53f41
status: experimental
description: Detects a burst of file-create events on a removable-volume drive letter within five minutes, the signature of
  an insider bulk copy or an implant packing data onto a stick.
references:
- https://attack.mitre.org/techniques/T1052/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: file_event
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|re: ^[D-Z]:\\
  timeframe: 5m
  condition: selection
fields:
- EventID
- Computer
- User
- Image
- TargetFilename
falsepositives:
- Approved bulk transfers to encrypted corporate media
- Backup, imaging or provisioning tools writing to removable targets
level: high
tags:
- attack.t1052.001
