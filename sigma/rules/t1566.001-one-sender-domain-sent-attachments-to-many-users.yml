title: One Sender Domain Sent Attachments to Many Users
id: 1c5e8a72-9b4f-4d23-87c6-d2e3f4a5b609
status: experimental
description: 'Trend rule for mass attachment campaigns (precursor to T1566.001). Uses Sigma aggregation: count inbound mails with attachments per sender domain and alert above a threshold. The SenderDomain field must exist in your logs (most gateways add it; in Splunk we derive it from SenderAddress with eval - see the SPL below). Detection note: this is the event-level half. Apply the SIEM threshold count(SenderDomain) > 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: m365
  service: defender_for_office365
detection:
  selection:
    DeliveryAction: Delivered
    FileName: '*'
  condition: selection
falsepositives:
- Large newsletters or bulk B2B suppliers. Compare against a baseline of normal sender domains before blocking.
level: low

