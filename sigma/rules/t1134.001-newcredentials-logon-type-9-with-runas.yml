title: NewCredentials Logon (Type 9) with runas
id: 3f1e8a2c-0003-4b6d-9c2e-5a7f8d9e0a03
status: test
description: Logon type 9 means Windows received new credentials for the session. The normal source is
  runas /netonly, which attackers also abuse to act under another identity without a new interactive logon.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
  filter:
    SubjectUserName|endswith: $
  condition: selection and not filter
falsepositives:
- Documented admin use of runas /netonly
- Management tools that use NewCredentials logons
level: medium
tags:
- attack.privilege-escalation
- attack.t1134.001
