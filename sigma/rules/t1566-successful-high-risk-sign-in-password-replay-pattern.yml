title: Successful High-Risk Sign-In (Password Replay Pattern)
id: 2b8d3e5f-9a4c-4f02-ad3b-6e7f8a9b0c12
status: stable
description: Detects a successful sign-in that Microsoft Entra ID scored as high risk. Credential replay
  from a phishing kit or an anonymizing network usually arrives as a password-only, single-factor sign-in
  from a new network; enrich the alert by checking authenticationDetails for a lone Password entry and
  authenticationRequirement for singleFactorAuthentication.
references:
- https://attack.mitre.org/techniques/T1566/
- https://learn.microsoft.com/en-us/entra/id-governance/overview-risky-sign-ins
author: Detection Guide Team
date: '2025-11-18'
tags:
- attack.initial-access.t1566
- attack.defense-evasion.t1078
- attack.t1566.002
- attack.t1566
- attack.initial-access
logsource:
  product: azure
  service: signinlogs
  definition: Microsoft Entra ID (Azure AD) sign-in logs
detection:
  selection_success:
    properties.status.errorCode: 0
  selection_risk:
    properties.riskLevelDuringSignIn:
    - high
    - medium
  condition: selection_success and selection_risk
falsepositives:
- Traveling staff signing in from hotels or airports; pair the alert with a quick user confirmation.
- Shared workstations in branches that jump networks between events.
level: critical
