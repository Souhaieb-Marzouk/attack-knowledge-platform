title: sshd_config Modified
id: e2d6b8f4-71c9-4a03-9d5e-48b0c2e7d913
status: stable
description: Detects a write to /etc/ssh/sshd_config using the auditd watch with key sshd-config-watch.
  Changes can enable root login, password login, or weak algorithms, which makes every other SSH attack
  cheaper.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Detection Engineering Team
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1562.001
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: SYSCALL
    key: sshd-config-watch
    success: 'yes'
  condition: selection
falsepositives:
- Approved configuration management runs (filter the tool account and join with change tickets)
level: medium
