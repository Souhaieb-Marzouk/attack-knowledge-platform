title: Sensitive Path on Owned Website
id: 4e2c6b47-9d73-49e3-b66e-1e558f15cfe1
status: experimental
description: Detects requests for source, environment, backup, or admin paths on a public website. Check whether the file is supposed to be reachable.
references:
- https://attack.mitre.org/techniques/T1594/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1594
logsource:
  category: webserver
  product: nginx
detection:
  selection_paths:
    cs_uri_stem|contains:
    - /.git
    - /.env
    - /.svn
    - /backup
    - /.aws
    - /.ssh
    - /phpinfo
    - /admin.php
  condition: selection_paths
fields:
- cs_uri_stem
falsepositives:
- Developer testing a local path
- Authorized web scanner
- Old monitoring check
level: medium

