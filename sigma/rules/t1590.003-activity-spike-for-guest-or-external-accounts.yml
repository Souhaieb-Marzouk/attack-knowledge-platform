title: Activity Spike for Guest or External Accounts
id: c41d7f92-56a8-4e3b-9f70-8a2c4e6d7105
status: experimental
description: 'Detects many network logons (type 3) for one external, guest, or vendor account within one hour. A burst can mean an attacker is walking the trust path with a shared account. Detection note: this is the event-level half. Apply the SIEM threshold count(TargetUserName) > 15 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.003
logsource:
  category: logon_success
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    TargetUserName|contains:
    - -ext
    - guest
    - vendor
  condition: selection
  timeframe: 1h
falsepositives:
- A backup or monitoring service that runs more often during a change window
- A vendor batch job that connects many times in a short maintenance slot
level: medium

