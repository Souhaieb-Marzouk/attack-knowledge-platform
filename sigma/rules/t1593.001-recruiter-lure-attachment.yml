title: Recruiter Email with Attachment
id: 326839d6-8354-446a-806b-286f802ea08d
status: experimental
description: Detects a recruiter-themed email with an attachment from outside the known recruiting platforms. Social-media recon often supplies the role and name.
references:
- https://attack.mitre.org/techniques/T1593/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1593.001
logsource:
  product: m365
  service: exchange
detection:
  selection_subject:
    Subject|contains:
    - opportunity
    - interview
    - position
    - job offer
  selection_attach:
    AttachmentCount|gte: 1
  filter_known_hr:
    SenderAddress|endswith:
    - '@workday.com'
    - '@greenhouse.io'
    - '@lever.co'
  condition: selection_subject and selection_attach and not filter_known_hr
fields:
- AttachmentCount
- SenderAddress
- Subject
falsepositives:
- New recruiting agency
- HR forwarding a candidate
- Applicant sending a profile
level: medium

