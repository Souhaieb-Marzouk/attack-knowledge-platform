title: RDP Password Guessing Burst
id: b3f8a2d1-6c47-4e59-8a2b-1d9e3f7c5a02
status: experimental
description: 'Detects 10 or more failed RDP logons (Logon Type 10) from the same source IP within 10 minutes. This pattern shows password guessing or password spraying against exposed or internal RDP. Detection note: this is the event-level half. Apply the SIEM threshold count(IpAddress) >= 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.credential-access
- attack.lateral-movement
- attack.t1021.001
- attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    LogonType: 10
  condition: selection
  timeframe: 10m
falsepositives:
- A broken application or service with an old saved password
- Penetration tests with written approval
level: high

