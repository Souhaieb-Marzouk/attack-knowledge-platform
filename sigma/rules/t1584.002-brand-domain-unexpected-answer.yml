title: Brand Domain Answer Outside Expected Range
id: 2b3d3d10-d7f6-4298-ac1e-1d9ae412307a
status: experimental
description: Alerts when a partner domain resolves to an address outside the ranges we expect. Could be DNS hijacking, but a CDN or failover change can also explain it.
references:
- https://attack.mitre.org/techniques/T1584/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.002
logsource:
  category: dns
  product: zeek
detection:
  selection_domain:
    query|endswith:
    - .vendor-bank.com
    - .brand-supplier.com
    rcode_name: NOERROR
  filter_expected:
    answers|cidr:
    - 203.0.113.0/24
    - 198.51.100.0/24
  condition: selection_domain and not filter_expected
fields:
- answers
- query
- rcode_name
falsepositives:
- CDN or failover IP change
- Vendor migration not added to the allowlist
level: high

