title: Successful Device Code Sign-In From Unusual Country
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: A sign-in completed with the device code flow from a country your users do not use. Attackers phish employees into entering a device code so that the attacker receives a valid OAuth token (T1528.003).
references:
- https://attack.mitre.org/techniques/T1528/
- https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-sign-ins-log-schema
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.t1528.003
- attack.credential-access
- attack.t1528
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.authenticationProtocol: deviceCode
    properties.status.errorCode: 0
  filter_known_countries:
    properties.location.countryOrRegion:
    - United States
    - Germany
  condition: selection and not filter_known_countries
falsepositives:
- Legitimate device code logins on consoles, printers, smart boards, or meeting room screens.
level: high

