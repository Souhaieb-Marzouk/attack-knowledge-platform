title: Suspicious Read Access to LSASS Memory
id: 3f1e8a2c-0001-4b6d-9c2e-5a7f8d9e0a01
status: experimental
description: A process opens lsass.exe with access rights that allow reading its memory. Tools that dump credentials or steal tokens need this first.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: Souhaieb Marzouk
date: '2026-09-01'
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess|contains:
    - '0x1010'
    - '0x143a'
  filter:
    SourceImage|startswith:
    - C:\Windows\
    - C:\Program Files\
    - C:\Program Files (x86)\
  condition: selection and not filter
falsepositives:
- Antivirus, EDR, and backup agents that read process memory
level: high
tags:
- attack.privilege-escalation
- attack.t1134.001

