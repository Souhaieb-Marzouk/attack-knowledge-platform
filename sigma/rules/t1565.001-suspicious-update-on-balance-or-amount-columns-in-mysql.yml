title: Suspicious UPDATE on Balance or Amount Columns in MySQL
id: 7c1d2e58-93a4-4b6f-8d21-5f0c9ab3e101
status: experimental
description: Detects UPDATE, DELETE, or TRUNCATE statements that touch balance, amount, or status columns of finance tables,
  run by a user that is not an application service account. Direct database edits are the core move of stored data manipulation
  (T1565.001).
references:
- https://attack.mitre.org/techniques/T1565/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: database
  product: mysql
detection:
  selection_dml:
    query|re: (?i)^(UPDATE|DELETE|TRUNCATE)\s
  selection_value:
    query|re: (?i)(balance|amount|total_due|account_status)
  filter_service:
    src_user|startswith: svc_
  condition: selection_dml and selection_value and not filter_service
fields:
- src_user
- src_ip
- dest
- query
falsepositives:
- Approved DBA maintenance from jump hosts with a change ticket
- Migration jobs that legitimately rewrite value columns
level: high
tags:
- attack.t1565.001
