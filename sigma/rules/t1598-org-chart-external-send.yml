title: Org Chart Sent to Personal Mail
id: fd941b95-7baa-4922-b271-baf781098e3b
status: experimental
description: Detects an org chart, team structure, or onboarding pack sent to a personal mailbox. This is often the answer to a phishing-for-information request.
references:
- https://attack.mitre.org/techniques/T1598/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1598
logsource:
  product: m365
  service: exchange
detection:
  selection_send:
    Operation: Send
  selection_content:
    Subject|contains:
    - org chart
    - org-chart
    - team structure
    - tooling
    - onboarding pack
  filter_internal:
    Recipients|contains: '@corp.example'
  condition: selection_send and selection_content and not filter_internal
fields:
- Operation
- Recipients
- Subject
falsepositives:
- Employee sending their own document home
- Approved M&A data room
- Personal mailbox on an approved exception list
level: high

