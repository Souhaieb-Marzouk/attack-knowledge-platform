title: Admin Type 3 Logon from Non-Jump Host
id: 5d2b8f0a-9e37-4c81-b2a4-6f7c3d9e1b52
status: experimental
description: Detects a network (Type 3) logon by an admin-like account from a host outside the jump server range. Pairs with 5145 admin share access in the SIEM version of this rule.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType: 3
    TargetUserName|contains:
    - admin
    - _adm
  filter_jump:
    IpAddress|startswith:
    - 10.1.9.
  condition: selection_logon and not filter_jump
falsepositives:
- Admin tools that impersonate accounts with "admin" in the name
- New jump servers that were not added to the filter list
level: high

