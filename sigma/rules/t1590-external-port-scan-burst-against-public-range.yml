title: External Port Scan Burst Against Public Range
id: 4f2b7c31-9a5e-4d62-8b17-3c9f21e5a7d4
status: stable
description: 'Many blocked inbound connections to public-facing hosts from one external source in a short
  window. This pattern often appears during pre-attack network reconnaissance, when an intruder maps open
  services before an intrusion (MITRE ATT&CK T1590). Detection note: this is the event-level half. Apply
  the SIEM threshold count(src_ip) > 30 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590
logsource:
  category: firewall
  product: pfsense
  service: filterlog
detection:
  selection:
    action: deny
    dir: in
  condition: selection
  timeframe: 5m
falsepositives:
- Approved vulnerability scanners
- Internet-wide scanning services that probe many ports
level: medium
