title: Subdomain Brute Force (NXDOMAIN Storm)
id: 7c2e8b54-1d93-4f6a-b2c7-5e9d0a4f83b1
status: experimental
description: 'Detects a single source receiving many NXDOMAIN answers for names under one zone in a short window. Attackers brute forcing subdomains produce exactly this pattern, because most guessed names do not exist. Detection note: this is the event-level half. Apply the SIEM threshold count(id.orig_h) > 60 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/002/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.002
logsource:
  category: dns
  product: zeek
  service: dns
detection:
  selection:
    rcode_name: NXDOMAIN
    query|endswith: .example.com
  timeframe: 5m
  condition: selection
falsepositives:
- A recursive resolver serving many users at once
- Monitoring probes that check many names on purpose
level: medium

