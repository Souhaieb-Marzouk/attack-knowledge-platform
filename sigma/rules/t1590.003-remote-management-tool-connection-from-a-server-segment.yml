title: Remote Management Tool Connection from a Server Segment
id: 2e9b4d57-8c13-4f26-a0d4-6b7e5c9f2102
status: experimental
description: Detects a server in the data center range talking to a remote monitoring and management (RMM) service such as AnyDesk, TeamViewer, RustDesk, or Splashtop. Intrusion groups abuse these trusted admin tools after mapping vendor trust.
references:
- https://attack.mitre.org/techniques/T1590/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.003
logsource:
  category: network_connection
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    Initiated: 'true'
    DestinationHostname|contains:
    - .anydesk.com
    - .teamviewer.com
    - .rustdesk.com
    - .splashtop.com
  filter_admin_jump:
    SourceIp|startswith:
    - 192.0.2.200
  condition: selection and not filter_admin_jump
falsepositives:
- IT staff using an approved remote-support tool from a documented admin workstation
- A licensed RMM agent whose management domain was never baselined
level: critical

