title: Vertical Scan on Single Host
id: 2c9e7b64-8f13-46a7-b2e9-1d5c0a7f34e8
status: stable
description: 'Detects one external source denied on many ports of one destination host. This shows the
  attacker profiling a specific system, often the VPN gateway or a DMZ host. Detection note: apply the
  SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/004/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.004
logsource:
  category: firewall
  product: pfsense
detection:
  selection:
    action: block
  condition: selection
falsepositives:
- Load balancer health checks from one source
- Mail servers retrying several ports after an outage
level: medium
