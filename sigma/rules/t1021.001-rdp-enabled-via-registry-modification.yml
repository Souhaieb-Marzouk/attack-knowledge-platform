title: RDP Enabled via Registry Modification
id: d2a75e19-4f83-4c0b-b571-9e6d2c8a4b74
status: experimental
description: Detects a registry change that turns RDP on (fDenyTSConnections set to 0) or weakens RDP security settings. Malware and hands-on attackers enable RDP to keep a simple way back into a machine.
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.001
- attack.t1112
logsource:
  product: windows
  service: sysmon
detection:
  selection_enable:
    EventID: 13
    TargetObject|endswith: \Control\Terminal Server\fDenyTSConnections
    Details: DWORD (0x00000000)
  selection_port:
    EventID: 13
    TargetObject|contains: Terminal Server\WinStations\RDP-Tcp\PortNumber
  condition: 1 of selection_*
falsepositives:
- Approved IT automation tools enabling RDP on servers
level: high

