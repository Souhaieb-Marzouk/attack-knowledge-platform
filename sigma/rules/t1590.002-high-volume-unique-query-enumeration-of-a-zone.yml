title: High-Volume Unique-Query Enumeration of a Zone
id: 5d8a1f26-9e37-4b8c-bd54-7a2c6e9f31b8
status: stable
description: 'Detects a single source asking for an unusually high number of unique names under one zone
  in a short window. This is the pattern of broad record sweeps that map a zone and its cloud vendors.
  Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) > 100 within 5m
  before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/002/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.002
logsource:
  category: dns
  product: bind
  service: queries
detection:
  selection:
    query|endswith: .example.com
  timeframe: 10m
  condition: selection
falsepositives:
- A recursive resolver serving many users at once
- Large mail providers doing bulk lookups
level: low
