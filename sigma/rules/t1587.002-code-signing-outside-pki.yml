title: Code Signing Cert Outside PKI
id: 8d03c9c8-018e-425f-a3a5-f3a8f556ea17
status: experimental
description: Detects a code-signing certificate issued to someone outside the PKI or release groups. Check the request ticket before revoking anything.
references:
- https://attack.mitre.org/techniques/T1587/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1587.002
logsource:
  category: application
  product: certificate_authority
  service: issuance
detection:
  selection_template:
    TemplateName:
    - ACME-CodeSigning-OV
    - ACME-CodeSigning-EV
    - CodeSigning
  filter_pki:
    RequesterGroup:
    - PKI-Admins
    - Release-Engineering
  condition: selection_template and not 1 of filter_pki
fields:
- RequesterGroup
- TemplateName
falsepositives:
- Approved exception for a vendor
- New release team not in the group yet
- Lab certificate request
level: high

