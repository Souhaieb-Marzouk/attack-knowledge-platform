title: AWS Console Login Without MFA
id: 46951c77-0f22-464e-9406-926577fc4772
status: experimental
description: Detects a successful AWS console login without MFA for a normal user. Break-glass accounts are excluded, but they should be reviewed separately.
references:
- https://attack.mitre.org/techniques/T1586/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1586.003
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_login:
    eventName: ConsoleLogin
    responseElements.ConsoleLogin: Success
  selection_nomfa:
    additionalEventData.MFAUsed: 'No'
  filter_breakglass:
    userIdentity.userName:
    - breakglass-ops
    - emerg-admin
  condition: selection_login and selection_nomfa and not filter_breakglass
fields:
- additionalEventData.MFAUsed
- eventName
- responseElements.ConsoleLogin
- userIdentity.userName
falsepositives:
- Legacy IAM user that cannot use MFA
- New break-glass account not in the filter
- Root login during an incident
level: high

