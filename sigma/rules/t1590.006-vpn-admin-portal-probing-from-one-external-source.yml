title: VPN Admin Portal Probing from One External Source
id: 3f6a9c2e-8b14-4d27-9a5f-6c0e12b7d401
status: experimental
description: 'Detects one external source requesting many known VPN admin portal paths in a short window, a classic appliance fingerprinting step (T1590.006). Detection note: this is the event-level half. Apply the SIEM threshold count(client_ip) > 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/006/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.006
logsource:
  category: webserver
  product: apache
  service: access
detection:
  sel_portal:
    c-uri|contains:
    - /remote/login
    - /dana-na
    - /global-protect/login.esp
    - /loginsso
    - /admin
  condition: sel_portal
falsepositives:
- Your own approved vulnerability scanners
- Uptime monitors that check the login page
level: high

