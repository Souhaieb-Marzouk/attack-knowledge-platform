title: Linux Kernel Possible SYN Flooding Message
id: 12bbaa56-47e7-4550-a845-4a6db3a6631d
status: experimental
description: Detects the Linux kernel message that appears when the TCP half-open backlog overflows and SYN cookies start.
  Maps to ATT&CK T1499.001.
references:
- https://attack.mitre.org/techniques/T1499/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: linux
  service: syslog
detection:
  selection:
    message|contains|all:
    - Possible SYN flooding
    - Sending cookies
  condition: selection
fields:
- host
- message
falsepositives:
- A planned capacity test on a lab host
- A very small backlog combined with a short burst of legitimate connections
level: high
tags:
- attack.t1499.001
