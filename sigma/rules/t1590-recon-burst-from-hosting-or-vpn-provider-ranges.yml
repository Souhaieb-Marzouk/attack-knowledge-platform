title: Recon Burst from Hosting or VPN Provider Ranges
id: b83e1d47-2f96-4c5a-9a02-6d47e8b1c0f9
status: experimental
description: 'Denied inbound traffic from source addresses inside known hosting or VPN provider ranges, counted per source in a short window. Attackers rent such exits so their sources look like normal users (MITRE ATT&CK T1590). Replace the placeholder documentation ranges in selection_range with the ranges from your enriched threat feed. Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) > 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590
logsource:
  category: firewall
  product: pfsense
  service: filterlog
detection:
  selection_deny:
    action: deny
    dir: in
  selection_range:
    src_ip:
    - 198.51.100.0/24
    - 203.0.113.0/24
  condition: selection_deny and selection_range
  timeframe: 10m
falsepositives:
- Company staff using commercial VPN exits
- Your own cloud monitoring from provider addresses
level: medium

