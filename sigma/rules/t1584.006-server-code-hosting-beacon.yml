title: Service Account Posting to Paste or Code Host
id: 47e520f3-bca8-4590-b8fc-d5024a46004b
status: experimental
description: Looks for a service account posting to GitHub, Gist, or Pastebin. Attackers use these services for payload staging and small exfil jobs.
references:
- https://attack.mitre.org/techniques/T1584/006/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.006
logsource:
  category: proxy
detection:
  selection_domains:
    url_domain|endswith:
    - github.com
    - gist.github.com
    - githubusercontent.com
    - pastebin.com
  selection_servers:
    user|startswith: svc-
  condition: selection_domains and selection_servers
fields:
- url_domain
- user
falsepositives:
- Build jobs that publish artifacts
- Monitoring scripts fetching signatures
- Service account using GitHub for approved automation
level: high

