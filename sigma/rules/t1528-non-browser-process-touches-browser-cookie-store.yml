title: Non-Browser Process Touches Browser Cookie Store
id: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a80
status: test
description: A process that is not a web browser creates or writes to the cookie database of Chrome, Edge,
  or Firefox. Malware and infostealers do this to copy web session cookies and reuse them on another machine
  (T1528.004).
references:
- https://attack.mitre.org/techniques/T1528/
author: T1528 Detection Guide
date: '2026-09-25'
tags:
- attack.t1528.004
- attack.credential-access
- attack.t1528
logsource:
  category: file_event
  product: windows
detection:
  selection_cookie:
    TargetFilename|endswith:
    - \Cookies
    - \cookies.sqlite
    TargetFilename|contains:
    - \User Data\
    - \Mozilla\Firefox\Profiles\
  filter_browsers:
    Image|endswith:
    - \chrome.exe
    - \msedge.exe
    - \firefox.exe
    - \brave.exe
    - \opera.exe
    - \vivaldi.exe
  condition: selection_cookie and not filter_browsers
falsepositives:
- Browser updates, cleaning tools, backup or profile-sync software.
level: high
