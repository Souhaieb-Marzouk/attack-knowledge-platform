title: Path Traversal Token on Remote Access Gateway
id: a6c3d8e1-49f0-4b27-8e5a-2c7f1b9d4e60
status: experimental
description: Detects path traversal tokens on authentication or API paths of remote access gateways. Matches pre-auth exploitation
  patterns such as Ivanti CVE-2023-46805 against external remote services.
references:
- https://attack.mitre.org/techniques/T1133/
- https://www.mandiant.com/resources/blog/investigating-ivanti-vpn-zero-day-exploitation
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: webserver
detection:
  selection_traversal:
    c-uri|contains:
    - ../
    - ..;/
    - '%2e%2e'
  selection_gateway:
    c-uri|contains:
    - /api/
    - /rest/
    - /dana-na/
    - /remote/
    - /global-protect/
  condition: selection_traversal and selection_gateway
fields:
- client_ip
- c-uri
- status
falsepositives:
- Client applications that over-encode relative paths (rare)
level: critical
tags:
- attack.t1133
