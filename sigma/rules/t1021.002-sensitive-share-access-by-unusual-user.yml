title: Sensitive Share Access by Unusual User
id: 2b6e9f4a-3c18-4d72-9e5b-7c0a1d8f3e94
status: stable
description: Detects file access (5145) to HR or Finance shares by accounts that are not on the known
  service account allowlist.
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Detection Engineering Guide
date: '2025-04-12'
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains:
    - Finance
    - HR
  filter_users:
    SubjectUserName|endswith:
    - fin_svc
    - hr_backup
    - svc_backup
    - backup_adm
  condition: selection and not filter_users
falsepositives:
- Auditors or finance staff whose accounts are missing from the allowlist
- One-off projects that require share access
level: medium
