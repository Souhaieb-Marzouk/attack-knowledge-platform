title: WinRM Remote PowerShell Session on Non-Jump Host
id: 2b1fa62f-7044-483a-a0ee-2f558df221a1
status: stable
description: Detects wsmprovhost.exe, the process that hosts remote PowerShell commands, starting on a
  machine that is not an approved jump server. The rule also matches its children, because every remote
  command runs inside it. One hit outside the admin tier is the strongest single sign of WinRM lateral
  movement.
references:
- https://attack.mitre.org/techniques/T1021/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.006
logsource:
  product: windows
  service: sysmon
detection:
  selection_session:
    EventID: 1
    Image|endswith: \wsmprovhost.exe
  selection_children:
    EventID: 1
    ParentImage|endswith: \wsmprovhost.exe
  filter_jump:
    Computer:
    - JUMP-SRV-01.corp.local
    - JUMP-SRV-02.corp.local
  condition: (selection_session or selection_children) and not filter_jump
falsepositives:
- An approved jump server that is missing from the filter list
- Management tools that use PowerShell remoting from a monitoring host
level: high
