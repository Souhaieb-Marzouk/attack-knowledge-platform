title: Token Impersonation Tooling on the Command Line
id: 3f1e8a2c-0002-4b6d-9c2e-5a7f8d9e0a02
status: test
description: Well-known red-team and admin tooling for stealing or making Windows access tokens appears
  in a process command line.
references:
- https://attack.mitre.org/techniques/T1134/001/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
    - Invoke-TokenManipulation
    - steal_token
    - make_token
    - impersonate_token
  condition: selection
falsepositives:
- Authorized penetration tests and security training labs
level: high
tags:
- attack.privilege-escalation
- attack.t1134.001
