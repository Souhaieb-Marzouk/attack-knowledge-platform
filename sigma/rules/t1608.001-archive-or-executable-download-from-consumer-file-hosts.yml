title: Archive or Executable Download from Consumer File Hosts
id: 60d9f65f-c0ea-48bb-b7b1-e4e411fd004b
status: experimental
description: Detects a user downloading archive, executable, or script content from consumer file-hosting services that are commonly abused to stage malware (ATT&CK T1608.001). Pair with referer context to spot webmail, search, or forum-driven delivery.
references:
- https://attack.mitre.org/techniques/T1608/001/
- https://attack.mitre.org/techniques/T1608/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.001
- attack.command_and_control
- attack.t1105
logsource:
  category: proxy
detection:
  selection_hosts:
    cs-host|endswith:
    - gofile.io
    - pixeldrain.com
    - file.io
    - krakenfiles.com
    - transfer.sh
    - anonfiles.com
  selection_file:
    cs-method: GET
    c-uri-extension|contains:
    - zip
    - exe
    - msi
    - js
    - vbs
    - hta
    - rar
    - 7z
  condition: selection_hosts and selection_file
fields:
- cs-host
- c-uri
- src_ip
- user
- c-useragent
falsepositives:
- IT or design staff sharing large assets through these services.
- HR teams receiving candidate portfolios via file links.
level: high

