title: Office Process Dropped an Executable or Script into a Temp Folder
id: 8c1d4a27-3f6b-4d92-8e75-b9a0c1d2e403
status: stable
description: 'Detects Microsoft Office applications writing executable or script

  files into user-writable temp directories - payload staging after a

  malicious attachment (T1566.001).'
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Engineering Team
date: '2026-09-25'
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection_process:
    Image|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
    - \ONENOTE.EXE
  selection_target_dir:
    TargetFilename|contains:
    - \AppData\Local\Temp\
    - \Windows\Temp\
    - \AppData\Roaming\
  selection_target_type:
    TargetFilename|endswith:
    - .exe
    - .dll
    - .scr
    - .ps1
    - .vbs
    - .vbe
    - .js
    - .jse
    - .hta
    - .bat
    - .cmd
    - .lnk
  condition: selection_process and selection_target_dir and selection_target_type
falsepositives:
- Uncommon. Office normally writes only cache and autosave files, not executable types. Review each hit.
level: high
