title: HTTPS Session Where TLS SNI Differs from HTTP Host Header (Domain Fronting)
id: 590f963d-016f-4be9-aa0e-c7cac8274267
status: experimental
description: 'Detects HTTPS sessions where the TLS SNI value differs from the HTTP Host header. This is the core pattern of
  domain fronting (ATT&CK T1090.004), for example a Cobalt Strike Malleable C2 profile that beacons through a CDN. The rule
  needs a TLS-inspecting proxy that records both tls_sni and http_host, or a derived boolean sni_host_mismatch that the proxy
  or the SIEM pipeline computes per session. Zeek alternative: join ssl.log and http.log on uid and compare ssl.server_name
  with http.host.'
references:
- https://attack.mitre.org/techniques/T1090/004/
- https://attack.mitre.org/software/S0154/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
  product: tls_inspecting_proxy
detection:
  selection:
    sni_host_mismatch: 'true'
  condition: selection
fields:
- tls_sni
- http_host
- src_ip
- dest_ip
- http_method
- http_uri
falsepositives:
- A few legitimate shared-certificate CDN setups show different SNI and Host values on purpose
- Internal services pinned to a gateway name in SNI
level: critical
tags:
- attack.t1090.004
