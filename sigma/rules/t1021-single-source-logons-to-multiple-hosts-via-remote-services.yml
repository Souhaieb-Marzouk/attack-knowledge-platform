title: Single Source Logons to Multiple Hosts via Remote Services
id: 019b2047-4962-46de-a0b3-7a4c3abffe36
status: experimental
description: 'Detects one source IP creating successful logons (network Type 3 or remote interactive Type 10) on 3 or more different hosts within 10 minutes. This fan-out shape fits lateral movement with SMB, WinRM, and RDP, or a worm - it does not fit normal administration from a workstation. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021
- attack.t1021.002
- attack.t1021.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType:
    - 3
    - 10
  condition: selection
falsepositives:
- Jump servers and admin workstations that manage many hosts by design
- Software distribution or monitoring tools that log in remotely
level: high

