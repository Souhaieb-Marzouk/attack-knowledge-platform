title: AWS SSM StartSession from Unusual Principal
id: b8e4d9f2-3c57-4a61-8d92-1f3a7c5e0b44
status: experimental
description: Detects SSM Session Manager start events by principals outside the approved bastion and on-call list. A stolen cloud identity can open an interactive shell on private VMs with no SSH key and no network path to the VM.
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: StartSession
    eventSource: ssm.amazonaws.com
  filter_bastion:
    userIdentity.arn|endswith:
    - :role/HumanBastion
    - :user/sre-oncall
  condition: selection and not filter_bastion
falsepositives:
- New on-call engineers not yet added to the allow-list
- Approved break-glass sessions with an incident ticket
level: high

