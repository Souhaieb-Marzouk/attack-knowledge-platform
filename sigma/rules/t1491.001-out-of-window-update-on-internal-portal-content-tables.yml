title: Out-of-Window UPDATE on Internal Portal Content Tables
id: 8a1d4e6b-2c3f-4a9b-8e7d-5f0c2b6a1d93
status: experimental
description: Detects UPDATE statements against portal content tables from accounts outside the approved release set. Public
  reporting shows internal dashboard and intranet text is a common internal defacement target (T1491.001).
references:
- https://attack.mitre.org/techniques/T1491/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: database
  product: mssql
  service: audit
detection:
  selection_write:
    Statement|contains|all:
    - UPDATE
    - portal.
  filter_release:
    AccountName:
    - CORP\svc_cms_release
    - CORP\db_maint_app
  condition: selection_write and not filter_release
fields:
- AccountName
- ClientIp
- DatabaseName
- ObjectName
- Statement
falsepositives:
- Emergency content fixes by the communications team
- CMS jobs that run under personal accounts during incidents
level: high
tags:
- attack.t1491.001
