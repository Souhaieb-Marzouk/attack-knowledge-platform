title: SSH Client Started with Agent Forwarding
id: 9c5e7d34-2f61-4a08-b3d7-1e84c6a92f05
status: experimental
description: Detects an ssh process started with the -A (agent forwarding) flag, seen in auditd execve records. Attackers use this flag to reach the next hop with an agent socket that is not theirs, so each hit on a server should be checked.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Souhaieb Marzouk
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1552.004
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: ssh
    a1: -A
  condition: selection
falsepositives:
- Admins with a documented multi-hop workflow (allow list their accounts and the target hosts)
level: medium

