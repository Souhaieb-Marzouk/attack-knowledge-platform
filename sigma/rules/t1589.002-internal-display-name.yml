title: External Mail Using Internal Display Name
id: fff3d6de-7006-4f77-bbcd-2feb1e2db514
status: experimental
description: Detects external mail using the display name of a known employee. Attackers collect names during recon and reuse them in phishing.
references:
- https://attack.mitre.org/techniques/T1589/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1589.002
logsource:
  category: email
  product: mail_gateway
detection:
  selection_display:
    DisplayName|contains:
    - Aurelia Pay
    - Marcus Lee
  filter_internal:
    SenderDomain|endswith: aureliapay.example
  condition: selection_display and not filter_internal
fields:
- DisplayName
- SenderDomain
falsepositives:
- Contractor with the same name
- External person with a matching display name
- Mail forwarded through a third party
level: medium

