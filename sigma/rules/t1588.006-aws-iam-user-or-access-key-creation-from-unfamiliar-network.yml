title: AWS IAM User or Access Key Creation from Unfamiliar Network
id: 4a50c090-e720-4a73-85b1-91107cef48ab
status: experimental
description: Detects IAM CreateUser, CreateAccessKey, or AttachUserPolicy events from source networks outside known corporate or partner ranges. Attackers who just used an N-day weakness in a cloud-edge service often add persistence within minutes (MITRE ATT&CK T1588.006 with T1136).
references:
- https://attack.mitre.org/techniques/T1588/006/
- https://attack.mitre.org/techniques/T1136/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_event:
    eventName:
    - CreateUser
    - CreateAccessKey
    - AttachUserPolicy
  selection_src:
    sourceIPAddress|startswith:
    - 198.51.100.
    - 203.0.113.
  filter_console:
    userIdentity.type: AssumedRole
  condition: selection_event and selection_src and not 1 of filter_*
fields:
- userIdentity.userName
- eventName
- sourceIPAddress
- userAgent
- requestParameters.userName
falsepositives:
- Approved automation or CI/CD pipelines that provision identities from documented ranges
- Vendor-managed administration from documented source networks
level: high

