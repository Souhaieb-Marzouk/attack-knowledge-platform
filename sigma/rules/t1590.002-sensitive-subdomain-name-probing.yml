title: Sensitive Subdomain Name Probing
id: 9b3e5c72-8a41-4d7f-a6c3-2d8e1b5f47a9
status: stable
description: 'Detects a single external source probing several short, sensitive names such as vpn., mail.,
  citrix., jira., or staging. under the victim zone. The attacker is building a list of remote access
  doors. Detection note: this is the event-level half. Apply the SIEM threshold count(id.orig_h) > 15
  within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/002/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.002
logsource:
  category: dns
  product: zeek
  service: dns
detection:
  selection:
    query|startswith:
    - vpn.
    - mail.
    - citrix.
    - jira.
    - staging.
  timeframe: 10m
  condition: selection
falsepositives:
- Employees resolving the VPN or mail names during normal work
- Monitoring probes that check these names on purpose
level: medium
