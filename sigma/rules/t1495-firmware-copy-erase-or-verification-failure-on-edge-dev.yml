title: Firmware Copy, Erase, or Verification Failure on Edge Device
id: 3b6f2d41-9c7a-4e15-b2d8-6f1a0c4e7a93
status: experimental
description: Detects image copies to flash, flash erase commands, or firmware verification failures on network edge devices.
  Matches flash-overwrite behavior such as the VPNFilter kill stage (T1495).
references:
- https://attack.mitre.org/techniques/T1495/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network
  product: cisco
  service: syslog
detection:
  sel_erase:
    message|contains:
    - write erase
    - erase startup-config
  sel_copy:
    message|contains|all:
    - copy
    - 'flash:'
  sel_verify:
    message|contains:
    - image signature verification
    - image verification failed
    - firmware verification failed
  sel_reload:
    message|contains:
    - '%SYS-5-RELOAD'
  condition: 1 of sel_*
fields:
- host
- user
- message
falsepositives:
- Planned firmware upgrade inside an approved change window
- Engineer staging a backup image to flash during maintenance
level: high
tags:
- attack.t1495
