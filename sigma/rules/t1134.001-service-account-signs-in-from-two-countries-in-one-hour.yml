title: Service Account Signs In from Two Countries in One Hour
id: 3f1e8a2c-0007-4b6d-9c2e-5a7f8d9e0a07
status: test
description: 'A stolen cloud token is often replayed from another country or a hosting service. Watch
  for one account with successful sign-ins from more than one country in a short window. Field names follow
  the Microsoft Entra sign-in schema; adjust them to your table. Detection note: apply the SIEM aggregation
  described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1134/001/
- https://attack.mitre.org/techniques/T1528/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  product: azure
  service: SigninLogs
detection:
  selection:
    ResultType: '0'
  condition: selection
falsepositives:
- Staff who travel, VPN exits in different countries
level: medium
tags:
- attack.privilege-escalation
- attack.t1134.001
