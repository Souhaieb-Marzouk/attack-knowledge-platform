title: Regular Polling of Chat Bot API getUpdates Endpoint
id: 3f7a9c1e-8b2d-4e6a-9c41-7d5e0f2a8b31
status: experimental
description: Detects hosts repeatedly requesting a chat bot API tasking endpoint (getUpdates-style). Regular small polls are
  the inbound half of bidirectional communication over a web service (MITRE ATT&CK T1102.002).
references:
- https://attack.mitre.org/techniques/T1102/002/
- https://attack.mitre.org/techniques/T1102/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
  service: proxy
detection:
  selection_host:
    cs-host|endswith:
    - api.telegram.org
    - discord.com
  selection_poll:
    cs-method:
    - GET
    - POST
    cs-uri-query|contains:
    - getUpdates
    - getUpdates?offset=
  condition: selection_host and selection_poll
fields:
- ClientIP
- cs-host
- cs-method
- cs-uri-query
- UserAgent
falsepositives:
- Security research or monitoring tools that query bot APIs from approved hosts
- An approved integration server legitimately running a chat bot (allowlist it)
level: critical
tags:
- attack.t1102.002
