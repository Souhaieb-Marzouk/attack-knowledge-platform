title: Remote Access Tool Started from a User-Writable Folder
id: 81439db5-f0a2-4f68-be3f-be3f4a5b6c78
status: stable
description: Detects AnyDesk, TeamViewer, ScreenConnect, RemoteUtilities, or Atera starting from Temp,
  Downloads, or AppData. Callback phishing operators talk victims into running these tools; managed deployments
  come from Program Files.
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/004/
author: Detection Guide Team
date: '2025-11-18'
tags:
- attack.initial-access
- attack.t1566
- attack.command-and-control
- attack.t1219
- attack.t1566.004
logsource:
  category: process_creation
  product: windows
  definition: Sysmon Event ID 1 or equivalent EDR process events
detection:
  selection_tool:
    Image|endswith:
    - \AnyDesk.exe
    - \TeamViewer.exe
    - \TeamViewer_Service.exe
    - \ScreenConnect.ClientService.exe
    - \RemoteUtilities.exe
    - \AteraAgent.exe
  selection_path:
    Image|contains:
    - \Temp\
    - \Downloads\
    - \AppData\Local\
  condition: selection_tool and selection_path
falsepositives:
- IT staff running a portable copy of a support tool on purpose; log it as a change ticket.
- Software builds that unpack test tools into AppData on developer machines.
level: high
