title: Email Delivered with a Risky Attachment File Type
id: 6f9a0b35-4c2d-4e18-97a3-d1e2f3a4b504
status: stable
description: 'Detects inbound email carrying historically abused attachment types

  (disk images, macro documents, OneNote, shortcuts). Field names follow

  Defender for Office 365 (EmailAttachmentInfo): FileName, DeliveryAction,

  SenderAddress, RecipientAddress, Subject. For other gateways (Proofpoint,

  Mimecast, Barracuda), map these five fields once in your ingest pipeline.'
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Engineering Team
date: '2026-09-25'
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: m365
  service: defender_for_office365
detection:
  selection_direction:
    DeliveryAction: Delivered
  selection_attachment:
    FileName|endswith:
    - .iso
    - .img
    - .vhd
    - .one
    - .lnk
    - .docm
    - .xlsm
    - .rtf
    - .hta
    - .7z
  condition: selection_direction and selection_attachment
falsepositives:
- Teams that really exchange these types by email (engineering images, signed macro workbooks). Review
  with mail admins and allow per-sender.
level: high
