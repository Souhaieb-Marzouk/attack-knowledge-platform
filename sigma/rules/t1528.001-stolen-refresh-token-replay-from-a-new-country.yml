title: Possible Stolen Refresh Token - Non-Interactive Sign-In From New Country
id: 9d4e5f6a-1b2c-4d3e-8f90-a1b2c3d4e5f6
status: stable
description: A non-interactive sign-in (refresh token or cached token) succeeded from a country that your users do not normally use, with no second factor. This is a common pattern when an attacker replays a stolen token.
references:
  - https://attack.mitre.org/techniques/T1528/
author: "Souhaieb Marzouk"
date: 2026-09-27
tags:
  - attack.t1528.001
  - attack.t1528.003
  - attack.credential_access
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Category: 'NonInteractiveUserSignInLogs'
    'properties.status.errorCode': 0
    'properties.authenticationRequirement': 'singleFactorAuthentication'
  filter_home_countries:
    'properties.location.countryOrRegion':
      - 'United States'
      - 'Germany'
      - 'Canada'
  condition: selection and not filter_home_countries
falsepositives:
  - Traveling users, VPN egress in other countries, cloud services calling APIs on behalf of users.
level: high