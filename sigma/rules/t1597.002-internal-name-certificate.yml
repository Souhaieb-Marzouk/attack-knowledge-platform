title: Certificate Leaks Internal Naming
id: 72087f9a-f2ff-41b5-8f61-2f8f3667c345
status: experimental
description: Alerts when a certificate exposes an internal naming pattern. This could be a lab certificate or a migration; confirm the source.
references:
- https://attack.mitre.org/techniques/T1597/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1597.002
logsource:
  category: application
  product: ctlog_monitor
  service: own_certs
detection:
  selection_internal:
    contains_internal_pattern: true
  condition: selection_internal
fields:
- contains_internal_pattern
falsepositives:
- Public certificate for an internal service during migration
- Lab certificate in a test feed
- Vendor certificate with a similar name
level: medium

