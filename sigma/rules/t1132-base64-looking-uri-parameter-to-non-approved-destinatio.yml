title: Base64-Looking URI Parameter to Non-Approved Destination
id: 7c1f3a2e-9b4d-4e8a-b1c6-2f5d8a90e314
status: experimental
description: Detects long Base64-shaped values in HTTP URI parameters where the destination is not on the internal allow-list.
  Matches implant task retrieval over HTTP, the textbook T1132.001 pattern (threat TH-01).
references:
- https://attack.mitre.org/techniques/T1132/001/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
detection:
  selection_blob:
    uri_query|re: (?i)[?&][A-Za-z0-9_-]+=([A-Za-z0-9+/]{20,}={0,2})
  filter_internal:
    dest_host|endswith:
    - .corp.example
    - .corp.local
  condition: selection_blob and not filter_internal
fields:
- src_ip
- uri_path
- uri_query
- dest_host
- user_agent
falsepositives:
- Web apps that pass large Base64 images or JWT tokens in query strings
- File-preview, signature, and analytics services
level: high
tags:
- attack.t1132
