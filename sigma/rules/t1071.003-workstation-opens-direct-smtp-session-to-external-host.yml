title: Workstation Opens Direct SMTP Session to External Host
id: 7890599f-0f74-40a0-b1c1-bbb66c992e0e
status: experimental
description: Detects a host in the workstation subnet speaking SMTP directly to an external server. Normal mail clients hand
  messages to the corporate relay, so direct outbound SMTP from user subnets usually means a mail-protocol C2 channel or file
  exfiltration over SMTP (ATT&CK T1071.003).
references:
- https://attack.mitre.org/techniques/T1071/003/
- https://attack.mitre.org/software/S0695/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network_traffic
  product: zeek
  service: smtp
detection:
  selection_dst:
    id.resp_p:
    - 25
    - 465
    - 587
  selection_src:
    id.orig_h|startswith: 10.20.4.
  filter_relay:
    id.resp_h: 10.10.0.25
  condition: selection_dst and selection_src and not filter_relay
fields:
- id.orig_h
- id.resp_h
- id.resp_p
- host
- useragent
falsepositives:
- A roaming user whose client talks to an approved provider such as Gmail or Microsoft 365 on port 587.
- A lab host that runs a test mail client on purpose.
level: high
tags:
- attack.t1071.003
