title: High Volume Inbound SMTP Connection Wave from One Source
id: a3651fd7-12c4-4b8a-aa5b-aa5b6c7d8e9a
status: stable
description: 'Detects a burst of inbound SMTP connections from a single source within five minutes on
  a Postfix relay. Malspam campaigns produce this pattern before any filter learns the campaign. Detection
  note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1566/
- https://attack.mitre.org/techniques/T1566/001/
author: Detection Guide Team
date: '2025-11-18'
tags:
- attack.initial-access.t1566
- attack.t1566.001
- attack.t1566
- attack.initial-access
logsource:
  product: linux
  service: postfix
  definition: Postfix smtpd logs via syslog
detection:
  selection_connect:
    process: postfix/smtpd
    keywords|contains: connect from
  condition: selection_connect
falsepositives:
- Legitimate bulk senders such as newsletter providers; allowlist their sending ranges.
- Backup or migration jobs that replay large mailboxes through one relay.
level: low
