title: RPC Endpoint Mapper Sweep to Multiple Hosts
id: a6f0d3c8-71b4-4e59-9d28-3c5e7f1b0a62
status: experimental
description: 'Detects a single host connecting to TCP 135 on more than 10 different destinations within 10 minutes. This is RPC/DCOM reconnaissance before lateral movement, not normal administration from a management zone. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.discovery
- attack.lateral-movement
- attack.t1021.003
logsource:
  product: windows
  category: network_connection
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationPort: 135
  condition: selection
  timeframe: 10m
falsepositives:
- SCCM or monitoring servers that use RPC heavily; allow-list them
level: medium

