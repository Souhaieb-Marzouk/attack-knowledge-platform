title: Cloud SSO Sign-In from External Identity in a New Country
id: 5f8d2c31-9a46-4b7e-b1c8-3d05a7e4b303
status: experimental
description: Detects a successful cloud SSO sign-in for an external vendor identity from a country that is not on the approved list, often from a new device. Vendor support accounts should sign in only from known places.
references:
- https://attack.mitre.org/techniques/T1590/003/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.003
logsource:
  category: cloud
  product: azure
  service: signin
detection:
  selection:
    userPrincipalName|endswith: '@vendorco.example'
    resultSignature: Success
  filter_approved_countries:
    location:
    - US
    - CA
    - GB
  condition: selection and not filter_approved_countries
falsepositives:
- A vendor employee traveling on approved business
- A new vendor office country that was never added to the approved list
level: critical

