title: Many Special-Privilege Logons for One Account in 10 Minutes
id: 3f1e8a2c-0005-4b6d-9c2e-5a7f8d9e0a05
status: test
description: 'An account collecting special privileges on many hosts in a short window often means stolen-token
  movement between systems. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json
  before alerting.'
references:
- https://attack.mitre.org/techniques/T1134/001/
author: T1134.001 detection guide
date: '2026-09-01'
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4672
    PrivilegeList|contains: SeDebugPrivilege
  condition: selection
falsepositives:
- Admin accounts that jump between many servers as part of normal work
level: medium
tags:
- attack.privilege-escalation
- attack.t1134.001
