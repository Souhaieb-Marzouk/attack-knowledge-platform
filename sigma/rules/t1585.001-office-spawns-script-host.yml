title: Office Spawning a Script Host
id: 89f77bb4-1f77-47b4-882d-74db284c3265
status: experimental
description: Detects Word, Excel, PowerPoint, or OneNote starting PowerShell, cmd, or another script host. This is a common malware delivery chain, but some old templates do it too.
references:
- https://attack.mitre.org/techniques/T1585/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1585.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \ONENOTE.EXE
  selection_child:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  filter_help:
    CommandLine|contains: winword.exe /safe
  condition: selection_parent and selection_child and not filter_help
fields:
- CommandLine
- Image
- ParentImage
falsepositives:
- Legacy document templates with macros
- Office add-ins that call a script
- Help desk running a repair script
level: high

