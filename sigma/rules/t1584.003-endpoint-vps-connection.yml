title: Endpoint to VPS or Bulletproof IP Range
id: 3bbc596a-3b8c-479c-9c00-e512d6470e0b
status: experimental
description: Detects a Windows endpoint connecting to an IP in a known VPS or bulletproof range. These ranges are often used for payload staging or C2.
references:
- https://attack.mitre.org/techniques/T1584/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.003
logsource:
  category: network_connection
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 3
    DestinationIp|cidr:
    - 203.0.113.0/24
    - 198.51.100.0/24
  condition: selection
fields:
- DestinationIp
- EventID
falsepositives:
- Approved SaaS hosted in that range
- VPN egress in the same provider range
- Security research lab
level: medium

