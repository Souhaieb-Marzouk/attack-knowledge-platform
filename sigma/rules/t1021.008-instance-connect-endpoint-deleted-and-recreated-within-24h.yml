title: Instance Connect Endpoint Deleted and Recreated Within 24h
id: 9a3e7f1d-5b2c-46b8-a4d9-e1f8c3b6d507
status: stable
description: 'Aggregation rule: the same principal or account deletes an Instance Connect Endpoint and
  creates a new one within 24 hours. Attackers rotate endpoints to escape temporary reach or to mimic
  cleanup. Approved pipelines do this on schedule, so group by identity and compare against the change
  calendar.'
references:
- https://attack.mitre.org/techniques/T1021/008/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection_create:
    eventName: CreateInstanceConnectEndpoint
  selection_delete:
    eventName: DeleteInstanceConnectEndpoint
  timeframe: 24h
  condition: selection_create and selection_delete
falsepositives:
- Scheduled pipeline tests that create and remove endpoints on purpose
level: medium
