title: MS Office Application Spawned a Script or Shell Interpreter
id: 3b2a1c9e-8f4d-4b7a-9c21-a6e5d4c3b201
status: experimental
description: Detects a Microsoft Office application starting a command line or script interpreter. Strong sign that a macro or exploit inside an email attachment (T1566.001) is executing attacker code.
references:
- https://attack.mitre.org/techniques/T1566/001/
- https://attack.mitre.org/techniques/T1204/002/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- attack.t1204.002
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
    - \ONENOTE.EXE
    - \MSPUB.EXE
    - \MSACCESS.EXE
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
    - \rundll32.exe
    - \regsvr32.exe
  condition: selection_parent and selection_child
falsepositives:
- Rare. Some document automation tools or add-ins call command line tools from Office. Allow exact parent-child pairs after review.
level: critical

