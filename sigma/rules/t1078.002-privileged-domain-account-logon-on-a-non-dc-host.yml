title: Privileged Domain Account Logon on a Non-DC Host
id: 472df60c-7d7a-4c14-8ce9-199e99a04e0d
status: experimental
description: Detects an interactive or remote-interactive logon (types 2, 7, 10) where the target account belongs to a privileged Tier-0 domain group and the receiving host is not a domain controller. Such logons cache high-value credentials on lower-tier hosts and enable domain-wide credential theft.
references:
- https://attack.mitre.org/techniques/T1078/002/
- https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/implementing-least-privilege-administrative-models
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1078.002
- attack.t1078
- attack.privilege_escalation
- attack.defense_evasion
- attack.persistence
logsource:
  product: windows
  service: security
detection:
  selection_logon:
    EventID: 4624
    LogonType:
    - 2
    - 7
    - 10
  selection_privileged:
    TargetIsPrivileged: true
  filter_domain_controller:
    HostRole: domain_controller
  condition: selection_logon and selection_privileged and not filter_domain_controller
fields:
- EventID
- LogonType
- TargetUserName
- TargetUserSid
- Computer
- IpAddress
falsepositives:
- Documented emergency or break-glass procedures from an approved bastion host
- Migration or recovery projects where Tier-0 logons are expected and ticketed
level: critical

