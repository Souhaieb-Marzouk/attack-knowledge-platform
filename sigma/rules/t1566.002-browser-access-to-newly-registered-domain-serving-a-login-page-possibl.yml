title: Browser Access to Newly Registered Domain Serving a Login Page (Possible AiTM)
id: 5b837337-5920-4951-99fb-57e4d2a00000
status: experimental
description: Detects browser sessions to domains registered in the last 14 days that serve login-style paths. Attackers register fresh domains for credential phishing pages that proxy real SSO portals (adversary-in-the-middle).
references:
- https://attack.mitre.org/techniques/T1566/002/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.initial_access
- attack.t1566
- attack.t1566.002
logsource:
  category: proxy
detection:
  selection_new:
    domain_age_days|lt: 14
  selection_login:
    c_uri_path|contains:
    - login
    - signin
    - sso
    - auth
    - verify
  condition: selection_new and selection_login
fields:
- cs_user
- cs_host
- c_uri_path
- domain_age_days
- rs_content_type
falsepositives:
- Legitimate new vendor or marketing portals announced by IT or HR
- SaaS products launched on new domains that employees sign in to
level: high

