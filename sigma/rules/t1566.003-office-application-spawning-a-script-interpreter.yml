title: Office Application Spawning a Script Interpreter
id: c31f735f-b99a-4ec6-b515-528a5fc909c6
status: experimental
description: Detects Microsoft Office processes acting as the parent of script or shell interpreters. This is the classic post-download execution pattern for documents delivered through legitimate file-sharing services.
references:
- https://attack.mitre.org/techniques/T1566/003/
- https://attack.mitre.org/techniques/T1204/002/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.initial_access
- attack.t1566
- attack.t1566.003
- attack.execution
- attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
  selection_child:
    Image|endswith:
    - \wscript.exe
    - \cscript.exe
    - \cmd.exe
    - \powershell.exe
    - \mshta.exe
    - \curl.exe
  condition: selection_parent and selection_child
fields:
- Image
- CommandLine
- ParentImage
- ParentCommandLine
- User
- Hashes
falsepositives:
- Approved mail add-ins or internal tools that legitimately script Office (keep an allowlist)
level: high

