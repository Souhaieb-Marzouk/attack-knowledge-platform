title: RMM Agent Spawning Shell or Downloader
id: 17eddcc3-3a4e-43fc-bf65-69b4f94b8b56
status: experimental
description: Detects RMM agent processes (Kaseya, ConnectWise, ScreenConnect and similar) spawning shells or downloaders. When an RMM platform is compromised, mass exploitation flows through exactly this parent-child relationship.
references:
- https://attack.mitre.org/techniques/T1199/
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-200a
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1199
- attack.t1078
- attack.tactic.initial-access
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|contains:
    - \Kaseya\
    - \ConnectWise\
    - \ScreenConnect\
    - \Syncro\
    - \Atera\
    - \N-able\
  selection_child:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \mshta.exe
    - \certutil.exe
    - \curl.exe
    - \wscript.exe
  condition: selection_parent and selection_child
fields:
- ParentImage
- Image
- CommandLine
- User
falsepositives:
- Legitimate scripted maintenance by the MSP (require ticket references)
level: critical

