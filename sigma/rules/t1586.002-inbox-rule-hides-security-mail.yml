title: Inbox Rule Hiding Security Mail
id: 597f937a-ca90-4daa-9afa-181015024688
status: experimental
description: Detects a new inbox rule that targets security, quarantine, spam, or phishing mail. Attackers use this to hide alerts and replies after taking over a mailbox.
references:
- https://attack.mitre.org/techniques/T1586/002/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1586.002
logsource:
  product: m365
  service: exchange
detection:
  selection_operation:
    Operation: New-InboxRule
  selection_keywords:
    Parameters|contains:
    - security
    - quarantine
    - spam
    - phishing
    - junk
  condition: selection_operation and selection_keywords
fields:
- Operation
- Parameters
falsepositives:
- Users organizing security notifications into a folder
- Help desk testing a rule
- Approved mail-flow automation
level: high

