title: New Key Added to authorized_keys
id: 5d3e8b21-6f7a-4c09-8b4e-91d2c0a7f553
status: stable
description: Detects a write to an authorized_keys file that was not made by an approved CI/CD or configuration
  management account. Attackers add their own public key for persistence (T1098.004) after stealing a
  first set of credentials.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Detection Engineering Team
date: '2026-10-26'
tags:
- attack.persistence
- attack.lateral-movement
- attack.t1021.004
- attack.t1098.004
logsource:
  product: linux
  service: auditd
detection:
  selection_write:
    name|endswith: /.ssh/authorized_keys
    syscall:
    - openat
    - open
    - write
    - truncate
    success: 'yes'
  filter_pipeline:
    user|endswith: -ci
  filter_tooling:
    exe|endswith:
    - /ansible
    - /gitlab-runner
    - /jenkins
  condition: selection_write and not 1 of filter_*
falsepositives:
- A deploy pipeline account missing from the filter list
- An admin manually rotating keys during an approved change
level: high
