title: POST to Web Shell or Upload Path
id: 91e1a9d2-851a-48ec-98fa-c64092ee229d
status: experimental
description: Looks for a POST to a path that looks like a web shell, upload handler, or command endpoint and gets a 200. A 200 from a catch-all route can still be a false positive, so check the response body if possible.
references:
- https://attack.mitre.org/techniques/T1584/004/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1584.004
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: POST
  selection_uri:
    cs-uri-stem|contains:
    - shell
    - cmd
    - eval
    - filemanager
    - /uploads/
  selection_status:
    sc-status: 200
  filter_known_paths:
    cs-uri-stem|contains:
    - /wp-admin/
    - /api/v1/upload
    - /services/upload
  condition: selection_method and selection_uri and selection_status and not 1 of filter_*
fields:
- cs-method
- cs-uri-stem
- sc-status
falsepositives:
- Custom upload endpoints with command-like names
- Catch-all routes returning 200
- Authorized web app scanner
level: high

