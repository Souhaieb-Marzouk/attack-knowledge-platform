title: Remote Interactive and Network Logon from Same Unusual Source
id: 95b50df5-fe6f-44fd-93b1-18781c78acaa
status: stable
description: 'Detects the same source IP producing both a remote interactive logon (Type 10, RDP-style)
  and a network logon (Type 3, SMB/WinRM-style) on the same host within 30 minutes. This service-hopping
  pattern marks attackers mixing tools, not normal users. Detection note: apply the SIEM aggregation described
  in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021
- attack.t1021.001
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection_type10:
    EventID: 4624
    LogonType: 10
  selection_type3:
    EventID: 4624
    LogonType: 3
  condition: selection_type10 and selection_type3
falsepositives:
- Admins who log in over RDP and then map a share on the same server
- Support tools that open both a session and a file connection
level: medium
