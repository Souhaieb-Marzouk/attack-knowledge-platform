title: AWS CloudTrail Logging Stopped or Trail Deleted
id: e2c8a5b7-6d13-4b90-9e47-3f8a2c6d1b58
status: experimental
description: Detects attempts to stop or delete CloudTrail logging, including denied attempts blocked by a service control policy. A denied attempt still proves a hostile actor is active inside the account.
references:
- https://attack.mitre.org/techniques/T1021/007/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.defense-evasion
- attack.lateral-movement
- attack.t1021.007
logsource:
  category: cloud
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - StopLogging
    - DeleteTrail
    - UpdateTrail
    - PutEventSelectors
    eventSource: cloudtrail.amazonaws.com
  condition: selection
falsepositives:
- Planned trail reconfiguration during an approved migration window
level: critical

