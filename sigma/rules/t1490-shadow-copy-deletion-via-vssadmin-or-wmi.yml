title: Shadow Copy Deletion via Vssadmin or WMI
id: b8f1a2c3-4d5e-4f60-9a1b-2c3d4e5f6070
status: experimental
description: Detects deletion of Volume Shadow Copies with vssadmin.exe or wmic.exe, a classic ransomware precursor that removes
  local restore points before encryption.
references:
- https://attack.mitre.org/techniques/T1490/
- https://www.cisa.gov/stopransomware
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection_vss:
    EventID: 1
    Image|endswith: \vssadmin.exe
    CommandLine|contains|all:
    - delete
    - shadows
  selection_wmic:
    EventID: 1
    Image|endswith: \wbem\WMIC.exe
    CommandLine|contains|all:
    - shadowcopy
    - delete
  condition: 1 of selection_*
fields:
- CommandLine
- ParentImage
- User
- Hostname
falsepositives:
- Storage or desktop administrators cleaning old shadow copies during approved maintenance
level: high
tags:
- attack.t1490
