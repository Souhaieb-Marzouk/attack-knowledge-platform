title: RDP Successful Logon After Failed Attempts from Same Source
id: c91d4f27-8e15-4b3a-9d06-4c2e8b1a6f33
status: stable
description: 'Correlates failed RDP logons (4625) with a successful RDP logon (4624, Type 10) from the
  same source IP within 30 minutes. This shows a password guess that worked and must be treated as a possible
  incident. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json
  before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.credential-access
- attack.lateral-movement
- attack.t1021.001
logsource:
  product: windows
  service: security
detection:
  failed:
    EventID: 4625
    LogonType: 10
  success:
    EventID: 4624
    LogonType: 10
  condition: failed and success
  timeframe: 30m
falsepositives:
- Users who mistype their password a few times and then succeed
level: critical
