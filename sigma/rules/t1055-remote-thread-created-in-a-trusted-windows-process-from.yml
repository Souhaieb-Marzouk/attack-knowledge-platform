title: Remote thread created in a trusted Windows process from outside C:\Windows
id: e3e07939-810d-4049-9945-9c651d70f210
status: experimental
description: Detects Sysmon EventID 8 where a remote thread is created in a high-value trusted process (svchost, explorer,
  lsass, winlogon) by a process outside C:\Windows. Matches T1055-style injection used by C2 implants. ATT&CK v20 renamed
  tactic TA0005 from Defense Evasion to Stealth; the Sigma tactic tag attack.defense_evasion keeps the older tag name.
references:
- https://attack.mitre.org/techniques/T1055/
- https://github.com/SigmaHQ/sigma
- https://learn.microsoft.com/sysinternals/downloads/sysmon
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
  definition: Sysmon configuration must include EventID 8 (CreateRemoteThread)
detection:
  selection:
    EventID: 8
    TargetImage|endswith:
    - \svchost.exe
    - \explorer.exe
    - \lsass.exe
    - \winlogon.exe
  filter_legit_source:
    SourceImage|startswith: C:\Windows\
  condition: selection and not filter_legit_source
fields:
- EventID
- SourceImage
- TargetImage
- StartModule
- StartFunction
- User
falsepositives:
- Legitimate installation or update frameworks that inject helper libraries
- Developer tools and debuggers run by engineers
- Security agents that instrument processes from unusual paths
level: high
tags:
- attack.t1055
