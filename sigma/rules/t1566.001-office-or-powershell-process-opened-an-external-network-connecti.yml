title: Office or PowerShell Process Opened an External Network Connection
id: 2e4c6a81-7b3d-4f56-a9c8-e0f1a2b3c605
status: experimental
description: Detects Office applications or PowerShell initiating outbound network connections to non-private addresses. Payload download (T1105) and C2 beaconing (T1071.001) after a spearphishing attachment (T1566.001) both look like this.
references:
- https://attack.mitre.org/techniques/T1566/001/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.initial-access
- attack.command-and-control
- attack.t1566.001
- attack.t1071.001
- attack.t1105
logsource:
  product: windows
  category: network_connection
detection:
  selection_process:
    Image|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \OUTLOOK.EXE
    - \ONENOTE.EXE
    - \powershell.exe
    - \pwsh.exe
    Initiated: 'true'
  filter_local_ranges:
    DestinationIp|startswith:
    - '10.'
    - 172.16.
    - 172.17.
    - 172.18.
    - 172.19.
    - 172.20.
    - 172.21.
    - 172.22.
    - 172.23.
    - 172.24.
    - 172.25.
    - 172.26.
    - 172.27.
    - 172.28.
    - 172.29.
    - 172.30.
    - 172.31.
    - 192.168.
    - '127.'
    - 169.254.
  filter_microsoft_endpoints:
    DestinationHostname|endswith:
    - .microsoft.com
    - .msocdn.com
    - .office.com
    - .office.net
    - .azureedge.net
    - .windowsupdate.com
  condition: selection_process and not filter_local_ranges and not filter_microsoft_endpoints
falsepositives:
- Office telemetry, update checks, and add-in web calls. Keep the vendor domain allowlist current; review new external destinations.
level: high

