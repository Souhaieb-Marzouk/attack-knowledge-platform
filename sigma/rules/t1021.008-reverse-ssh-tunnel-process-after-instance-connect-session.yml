title: Reverse SSH Tunnel Process After Instance Connect Session
id: c4f1a8e2-6d9b-43e5-8c7a-2b5e9d1f4a68
status: stable
description: Detects an ssh process started with a reverse tunnel flag (-R) on a Linux instance, which
  is a common way for attackers to call home after gaining a shell through Instance Connect. For environments
  without endpoint telemetry, watch netflow for long-lived high-byte outbound sessions right after a SendSSHPublicKey
  event.
references:
- https://attack.mitre.org/techniques/T1021/008/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021.008
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: /ssh
  selection_flag:
    CommandLine|contains: ' -R '
  condition: selection_img and selection_flag
falsepositives:
- Legitimate support tunnels created by engineers (usually documented)
level: high
