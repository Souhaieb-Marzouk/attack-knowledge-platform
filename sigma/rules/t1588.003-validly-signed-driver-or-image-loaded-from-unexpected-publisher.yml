title: Validly Signed Driver or Image Loaded from Unexpected Publisher
id: d1e15e9b-bd6a-450e-88a2-84528d372a2d
status: experimental
description: Detects kernel driver loads (Sysmon event 6) and DLL or executable image loads (Sysmon event 7) whose signature status is valid but whose signer is not on a short list of expected publishers. Stolen or abused code signing certificates (MITRE ATT&CK T1588.003) produce exactly this pattern, and CodeIntegrity events 3076 and 3077 record the same anomaly on hosts with application control policy.
references:
- https://attack.mitre.org/techniques/T1588/003/
- https://attack.mitre.org/techniques/T1553/002/
- https://learn.microsoft.com/sysinternals/downloads/sysmon
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.003
- attack.t1553.002
logsource:
  product: windows
  service: sysmon
detection:
  selection_events:
    EventID:
    - 6
    - 7
    Signed: 'true'
    SignatureStatus: Valid
  filter_publishers:
    Signature|contains:
    - Microsoft
    - Intel
    - AMD
    - NVIDIA
    - VMware
  condition: selection_events and not 1 of filter_*
fields:
- Image
- ImageLoaded
- Signature
- SignatureStatus
- Hashes
falsepositives:
- Legitimate vendors missing from the publisher list; extend the list, do not disable the rule
- Internal enterprise signers; add your own signing identities to the filter
level: critical

