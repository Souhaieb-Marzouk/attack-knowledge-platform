title: Proxy Traffic to Brand Lookalike Domain from CT Enrichment
id: e2aae971-36da-445d-8697-0168a6899609
status: experimental
description: Detects web traffic to a domain whose certificate transparency record matches a brand keyword and whose registration is fresh. The enriched fields brand_hit and domain_age_days come from a CT pipeline that joins the CT stream with registration data (MITRE ATT&CK T1588.004).
references:
- https://attack.mitre.org/techniques/T1588/004/
- https://attack.mitre.org/techniques/T1588/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource-development
- attack.t1588
- attack.t1588.004
logsource:
  category: proxy
detection:
  selection_brand:
    brand_hit: 'true'
  selection_young:
    domain_age_days|lte: 30
  condition: selection_brand and selection_young
fields:
- c-uri
- r-dns
- brand_hit
- domain_age_days
- ct_not_before
falsepositives:
- Legitimate partner or marketing sites that contain the brand word
- New product domains launched by your own organization
level: high

