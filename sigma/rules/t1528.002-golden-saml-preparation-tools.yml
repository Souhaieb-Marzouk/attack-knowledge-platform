title: Golden SAML Preparation - ADFS Certificate Dump or Export Tools
id: c3d4e5f6-7a8b-4c9d-8e0f-1a2b3c4d5e6f
status: stable
description: Someone runs known tools or commands used to read or export the AD FS token-signing certificate and its keys. With this certificate an attacker can forge SAML tokens for any user (T1528.002, Golden SAML).
references:
  - https://attack.mitre.org/techniques/T1528/
  - https://www.cyberark.com/resources/the-threat-research-blog/golden-saml
author: "Souhaieb Marzouk"
date: 2026-09-27
tags:
  - attack.t1528.002
  - attack.credential_access
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool_names:
    CommandLine|contains:
      - 'ADFSDump'
      - 'ADFSCollector'
      - 'SharpADFS'
      - 'FoggyWeb'
  selection_certutil_export:
    CommandLine|contains|all:
      - 'certutil'
      - 'exportPFX'
  condition: 1 of selection_*
falsepositives:
  - Legitimate ADFS certificate lifecycle work by the identity team.
  - Approved certificate export during planned rotation.
level: critical