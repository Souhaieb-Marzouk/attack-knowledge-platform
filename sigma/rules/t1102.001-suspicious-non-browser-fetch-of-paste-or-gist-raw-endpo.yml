title: Suspicious Non-Browser Fetch of Paste or Gist Raw Endpoint
id: 5d1f8a2e-3b6c-4e97-9a41-8c2f0d6e5b73
status: experimental
description: 'Detects an HTTP GET to the raw view of a paste or gist endpoint from a client that does not look like a normal
  browser. Malware abuses these pages as dead drop resolvers (MITRE ATT&CK T1102.001): the page holds an encoded blob that
  points to the real C2 server.'
references:
- https://attack.mitre.org/techniques/T1102/001/
- https://attack.mitre.org/techniques/T1102/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: proxy
  product: zscaler
detection:
  selection:
    cs-method: GET
    cs-host|endswith:
    - pastebin.com
    - gist.githubusercontent.com
    - pastes.io
    - hastebin.com
    c-uri|contains:
    - /raw/
    - /downloads/
  filter_browsers:
    cs-useragent|startswith:
    - Mozilla/5.0 (Windows NT
    - Mozilla/5.0 (Macintosh
    - Mozilla/5.0 (X11; Linux
  condition: selection and not 1 of filter_*
fields:
- src_ip
- user
- cs-host
- c-uri
- cs-method
- cs-useragent
- bytes-in
- bytes-out
falsepositives:
- Developers and CI jobs fetching public snippets or scripts
- IT automation pulling configuration text from paste sites
- Users opening paste links from chat or email in a normal browser
level: high
tags:
- attack.t1102.001
