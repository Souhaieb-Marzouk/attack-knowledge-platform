title: Job Offer Mail from New External Domain
id: 29c2644f-3af4-4d31-9946-cb4074a9409b
status: experimental
description: Looks for a clean inbound job-offer email from a domain not on the recruiting allowlist. Most of these are harmless; review the domain and the request.
references:
- https://attack.mitre.org/techniques/T1598/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1598.001
logsource:
  category: email
  product: proofpoint
detection:
  selection_subject:
    subject|contains:
    - job offer
    - offer letter
    - career opportunity
    - interview scheduling
  selection_inbound:
    direction: inbound
  selection_clean:
    verdict: clean
  filter_known:
    sender_domain|endswith:
    - northwind-labs.example
    - wellknown-agency.example
  condition: selection_subject and selection_inbound and selection_clean and not filter_known
fields:
- direction
- sender_domain
- subject
- verdict
falsepositives:
- New recruiting agency
- HR forwarding a candidate email
- Job board with a new domain
level: medium

