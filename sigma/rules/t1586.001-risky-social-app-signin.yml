title: Risky Social App Sign-In
id: 9ad950f0-74f6-4820-b792-4f502dc4c7ac
status: experimental
description: Detects a risky sign-in to a social or code platform that is linked to the corporate identity. Check whether the user was traveling or the session was replayed.
references:
- https://attack.mitre.org/techniques/T1586/001/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.resource-development
- attack.t1586.001
logsource:
  product: azure
  service: signinlogs
detection:
  selection_app:
    appDisplayName|endswith:
    - LinkedIn
    - Twitter
    - Facebook
    - GitHub
  selection_risk:
    riskLevelDuringSignIn:
    - high
    - medium
  condition: selection_app and selection_risk
fields:
- appDisplayName
- riskLevelDuringSignIn
falsepositives:
- User logging in from a new country
- Approved social media management tool
- LinkedIn Sales Navigator SSO
level: high

