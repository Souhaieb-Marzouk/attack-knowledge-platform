title: VNC Password Brute Force Indicators
id: e4a17b62-9f30-4c58-b7d9-3a8c1e6f2d05
status: experimental
description: 'Detects 20 or more connections to VNC port 5900 from one source within 10 minutes. Classic VNC authentication has no lockout, so password guessers reconnect in a tight loop and the firewall is the only witness. Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip) >= 20 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/005/
author: Souhaieb Marzouk
date: '2026-10-27'
tags:
- attack.lateral-movement
- attack.credential-access
- attack.t1021.005
- attack.t1110
logsource:
  category: network
  service: netflow
detection:
  selection:
    dst_port: 5900
  condition: selection
falsepositives:
- A monitoring or load-test tool that polls 5900 deliberately
- A file transfer job misconfigured to the VNC port
level: medium

