title: Netsh Portproxy Forwarding Rule Added on Endpoint or Server
id: 7c1e9a2f-3b4d-4e5f-8a6b-9c0d1e2f3a4b
status: experimental
description: Detects creation of a Windows port forwarding rule with 'netsh interface portproxy add'. Attackers use this built-in
  feature to turn a compromised host into an internal proxy that forwards C2 between network segments (MITRE ATT&CK T1090.001).
  The rule is stored in the registry and survives reboots.
references:
- https://attack.mitre.org/techniques/T1090/001/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 1
    Image|endswith: \netsh.exe
    CommandLine|contains|all:
    - interface
    - portproxy
    - add
  filter_admin:
    User|startswith: CORP\SVC-SYNDIAG
  condition: selection and not filter_admin
fields:
- Computer
- User
- ParentImage
- CommandLine
falsepositives:
- Documented administrative port forwarding on designated NAT or jump hosts
- Legacy application redirection deployed by IT through management tooling
level: critical
tags:
- attack.t1090.001
