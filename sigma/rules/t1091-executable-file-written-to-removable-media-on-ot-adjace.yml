title: Executable File Written to Removable Media on OT-Adjacent Host
id: 97c3d5a1-68e2-4b70-9d34-2f5a8c0e1b96
status: experimental
description: Detects executable or archive files written to removable media paths on hosts near OT/air-gapped zones. Legitimate
  transfers only happen at dedicated transfer stations, so any other media write is a policy violation and a possible worm
  staging event.
references:
- https://attack.mitre.org/techniques/T1091/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: file_event
  product: windows
  service: sysmon
detection:
  selection_drive:
    TargetFilename|re: ^[D-Z]:\\.*
  selection_ext:
    TargetFilename|endswith:
    - .exe
    - .dll
    - .ps1
    - .bat
    - .vbs
    - .lnk
    - .zip
    - .7z
  filter_transfer_station:
    Computer|startswith: TRANSFER-KIOSK
  condition: selection_drive and selection_ext and not filter_transfer_station
fields:
- Computer
- Image
- TargetFilename
- Hash
falsepositives:
- Approved workflows not yet registered to a transfer station
level: high
tags:
- attack.t1091
