title: Process Execution Directly from Removable Drive Path
id: 3346b204-670c-4919-a732-37c906106ea6
status: experimental
description: Detects processes executed directly from drive-letter paths typical of removable media. With storage device control in place, any such execution is suspicious and often marks an infected USB initial-access attempt.
references:
- https://attack.mitre.org/techniques/T1200/
- https://attack.mitre.org/techniques/T1091/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.t1200
- attack.t1091
- attack.tactic.initial-access
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection:
    Image|re: ^[D-Z]:\\.*\.(exe|bat|ps1|vbs|js|hta)$
  condition: selection
fields:
- Image
- CommandLine
- User
falsepositives:
- Approved portable tools (inventory them and allow-list by hash)
level: low

