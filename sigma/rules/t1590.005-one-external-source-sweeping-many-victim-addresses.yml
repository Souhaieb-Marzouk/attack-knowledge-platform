title: One External Source Sweeping Many Victim Addresses
id: 3f7a1c2e-8b4d-4e9a-9c1f-6d2e8a5b7c01
status: stable
description: 'Detects one external source contacting more than 15 distinct destination IP addresses within
  five minutes in the connection states S0 or REJ. Wide sweeps of a whole address block are a classic
  preparation step before active scanning and initial access (MITRE ATT&CK T1590.005). Detection note:
  apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/005/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.005
logsource:
  category: network
  product: zeek
  service: connection
detection:
  selection:
    connection_state:
    - S0
    - REJ
  timeframe: 5m
  condition: selection
falsepositives:
- an approved external vulnerability scanner
- a monitoring service that checks many hosts from one address
level: high
