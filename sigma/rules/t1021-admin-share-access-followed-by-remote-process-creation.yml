title: Admin Share Access Followed by Remote Process Creation
id: 18da9a35-755b-48a9-b262-b590734ab467
status: experimental
description: 'Correlates an ADMIN$ share access (Event 5145) with a process creation (4688) or service install (7045) on the same host within 10 minutes. This shows the classic copy-then-execute lateral movement step over SMB. Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1021/002/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.lateral-movement
- attack.t1021
- attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection_share:
    EventID: 5145
    ShareName|contains: ADMIN$
  selection_exec:
    EventID:
    - 4688
    - 7045
  condition: selection_share and selection_exec
falsepositives:
- Configuration management tools (SCCM, Ansible) writing and executing remotely
- Administrators running approved update scripts
level: high

