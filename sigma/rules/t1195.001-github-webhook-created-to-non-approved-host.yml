title: GitHub Webhook Created to Non-Approved Host
id: 308359d1-8586-42bf-9d66-2dc23578ed3a
status: experimental
description: Webhooks push repository events, including source code metadata, to external services. Attackers with forge access use them for quiet exfiltration. Only approved integration hosts should ever appear.
references:
- https://attack.mitre.org/techniques/T1195/001/
- https://docs.github.com/en/webhooks
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.exfiltration
- attack.t1567
- attack.persistence
- attack.t1505
- attack.initial_access
- attack.t1195.001
logsource:
  product: github
  service: github.audit
detection:
  selection:
    action: hook.create
  filter_approved:
    hook_url|endswith:
    - ci.corp.internal
    - hooks.slack.com
    - chat.corp.internal
  condition: selection and not filter_approved
fields:
- action
- actor
- repo
- hook_url
- events
- created_at
falsepositives:
- New integrations onboarding; require a ticket before adding hosts to the approved list.
level: high

