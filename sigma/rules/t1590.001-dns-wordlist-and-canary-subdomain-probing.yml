title: DNS Wordlist and Canary Subdomain Probing
id: 8c3f1d62-94a7-4e25-b1c9-6f0d8a47e253
status: stable
description: 'Detects a source asking for common service names such as vpn, mail, staging or test under
  the victim domain, or any query for the canary subdomain. This covers threat 2 of section 5.3, hidden
  portal discovery. A canary hit alone is a strong recon signal with almost no noise. Adjust the name
  list to your zone. Detection note: this is the event-level half. Apply the SIEM threshold count(src_ip)
  > 10 within 5m before alerting.'
references:
- https://attack.mitre.org/techniques/T1590/001/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.001
logsource:
  category: dns
  product: linux
  service: named
detection:
  selection_wordlist:
    qname|endswith: .example.com
    qname|contains:
    - vpn.
    - mail.
    - staging.
    - test.
  selection_canary:
    qname|startswith: canary.
  condition: selection_wordlist or selection_canary
falsepositives:
- Approved vulnerability scanners that probe the same names
- Monitoring tools that check VPN and mail names on a schedule
level: high
