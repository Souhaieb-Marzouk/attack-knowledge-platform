title: Security Service Stopped via Service Control Manager
id: 7c1d4a2e-9f3b-4e86-a1d5-3b2c8f9e0a11
status: experimental
description: Detects stop events for security and monitoring services such as Sysmon, Windows Defender and EDR agents, which
  attackers stop to remove visibility before the main attack.
references:
- https://attack.mitre.org/techniques/T1489/
- https://www.cisa.gov/stopransomware
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7036
    param1|contains:
    - Sysmon
    - WinDefend
    - Defender
    - Falcon
    - Sentinel
    - Carbon Black
    - CrowdStrike
    - EDR
    param2|contains: stopped
  condition: selection
fields:
- EventID
- param1
- param2
- Computer
falsepositives:
- Planned upgrades or reboots performed by security administrators inside change windows
level: high
tags:
- attack.t1489
