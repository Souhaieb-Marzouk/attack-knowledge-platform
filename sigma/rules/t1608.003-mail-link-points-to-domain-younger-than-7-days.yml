title: Mail Link Points to Domain Younger Than 7 Days
id: 501de76a-1aef-4b36-8767-858901adbdca
status: experimental
description: Detects mail-gateway URL rewrite or click events where the target domain is younger than 7 days according to a newly-observed-domain enrichment lookup. Attackers who install a fresh TLS certificate (ATT&CK T1608.003) almost always deliver the link by mail, so click-time age scoring catches the certificate abuse even when the message text looks clean.
references:
- https://attack.mitre.org/techniques/T1608/003/
- https://attack.mitre.org/techniques/T1566/002/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.resource_development
- attack.t1608
- attack.t1608.003
- attack.initial_access
- attack.t1566.002
logsource:
  category: proxy
  product: mail_gateway
detection:
  selection:
    event_type: mail_gateway_url
    domain_age_days|lt: 7
  filter_rewritten:
    verdict|contains: blocked
  condition: selection and not filter_rewritten
fields:
- url_domain
- url
- recipient
- from_domain
- domain_age_days
- verdict
falsepositives:
- Legitimate new SaaS launches your users adopt in their first week.
- Marketing domains registered shortly before a campaign.
level: high

