title: OTP Request Velocity Spike from a Single ASN
id: 7d65841b-3457-48e5-955c-0af9af13fbcb
status: experimental
description: Detects an hourly OTP aggregate in which one source ASN sends far more requests than the endpoint baseline while
  almost none of the passcodes are verified. This is the access pattern of SMS pumping (ATT&CK T1496.003) against public signup
  and verification forms on SaaS platforms.
references:
- https://attack.mitre.org/techniques/T1496/003/
- https://attack.mitre.org/techniques/T1496/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: application
  product: api-gateway
detection:
  selection_otp_path:
    endpoint|contains:
    - /otp
    - /verify
    - /send-code
  selection_volume:
    requests|gt: 300
  selection_low_verify:
    otp_verified_share|lt: 0.1
  condition: selection_otp_path and selection_volume and selection_low_verify
fields:
- endpoint
- source_asn
- requests
- requests_per_hour_baseline
- uniq_source_ips
- requested_dest_prefixes
- otp_verified_share
falsepositives:
- A viral signup campaign that drives many real users from one region (verified share stays normal)
- Load tests from known ranges (tag and exclude those ASNs)
level: critical
tags:
- attack.t1496.003
