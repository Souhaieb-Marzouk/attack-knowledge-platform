title: Management Port Sweep across Edge Appliances
id: e4713b8a-2d56-4c93-9f07-8b52d6a1c405
status: test
description: Detects one source touching management ports (22, 23, 443, 8443) on several edge appliances
  in a short window (T1590.006).
references:
- https://attack.mitre.org/techniques/T1590/006/
author: Detection Engineering Team
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.006
logsource:
  category: firewall
  product: pfsense
  service: filterlog
detection:
  sel_ports:
    dstport:
    - 22
    - 23
    - 443
    - 8443
  filter_mgmt:
    srcip|startswith: 10.10.
  condition: sel_ports and not filter_mgmt
falsepositives:
- Approved configuration management hosts
- Vendor support sessions booked through change management
level: medium
