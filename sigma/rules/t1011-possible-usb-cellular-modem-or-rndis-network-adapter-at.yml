title: Possible USB Cellular Modem or RNDIS Network Adapter Attached
id: 1b7e2f3a-9c4d-4e28-a6f1-53b90c7d2e44
status: experimental
description: Detects the load of RNDIS or USB NCM network drivers. These drivers appear when a phone tether or a USB cellular
  modem is attached. Attackers use such adapters to send data over a cellular link that bypasses corporate egress monitoring.
  This rule covers threat 1 of the T1011 ranking.
references:
- https://attack.mitre.org/techniques/T1011/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: driver_load
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 6
    ImageLoaded|contains:
    - \rndis
    - \usbncm
  condition: selection
fields:
- EventID
- ImageLoaded
- Computer
- User
falsepositives:
- Legitimate phone tethering approved by IT
- Approved USB mobile broadband adapters that use the same drivers
level: high
tags:
- attack.t1011
