title: DNS Zone Transfer (AXFR) Attempt
id: 4a9f2c31-6b7e-4d2a-9f41-8c3e5b7d1a02
status: experimental
description: Detects attempts to perform a DNS zone transfer (AXFR) against an authoritative name server. A successful transfer hands the attacker the full list of records of the zone, so every attempt is worth an alert.
references:
- https://attack.mitre.org/techniques/T1590/002/
author: Souhaieb Marzouk
date: '2026-09-29'
tags:
- attack.reconnaissance
- attack.t1590.002
logsource:
  category: dns
  product: bind
  service: xfer
detection:
  keywords:
  - AXFR
  - zone transfer
  condition: keywords
falsepositives:
- Approved secondary name servers pulling the zone on schedule
- DNS health monitors that test transfers on purpose
level: high

