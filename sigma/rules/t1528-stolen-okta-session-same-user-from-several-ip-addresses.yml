title: Stolen Okta Session - Same User From Several IP Addresses
id: 8b9c0d1e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
status: experimental
description: 'One Okta user completes SSO from more than one IP address inside a short time window. This can mean that a session token was stolen and replayed from another machine (T1528.004). Detection note: apply the SIEM aggregation described in tests/sigma_cases/thresholds.json before alerting.'
references:
- https://attack.mitre.org/techniques/T1528/
author: Souhaieb Marzouk
date: '2026-09-25'
tags:
- attack.t1528.004
- attack.credential-access
- attack.t1528
logsource:
  product: okta
  service: okta
detection:
  selection:
    eventtype: user.authentication.sso
    outcome.result: SUCCESS
  timeframe: 10m
  condition: selection
falsepositives:
- Users moving between office, VPN, and mobile networks.
level: medium

