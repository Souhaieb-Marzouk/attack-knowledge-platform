title: SSH Public Key Login from Unusual Source Subnet
id: 8f4c2d9a-3b71-4e65-9c2d-77a0e5b41f30
status: experimental
description: Detects a successful SSH login with a public key whose source IP is not an approved bastion or admin subnet. Stolen keys are usually used from workstations, build servers, or cloud hosts that the account never used.
references:
- https://attack.mitre.org/techniques/T1021/004/
author: Souhaieb Marzouk
date: '2026-10-26'
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1078
logsource:
  product: linux
  service: auth
detection:
  selection:
    message|contains: Accepted publickey
  filter_bastion_ips:
    src_ip:
    - 10.0.20.11
    - 10.0.20.12
  filter_bastion_subnet:
    src_ip|cidr:
    - 10.0.20.0/24
  condition: selection and not 1 of filter_*
falsepositives:
- A new admin workstation or bastion that is not on the allow list yet
- Planned break-glass access from a documented jump host
level: high

