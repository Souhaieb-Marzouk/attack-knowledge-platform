title: Secure Delete or Wipe Utility Execution
id: 3c7a1f62-9b4d-4e18-a52f-6d08e1b47c93
status: experimental
description: Detects execution of SDelete or cipher with the overwrite flag, the two most common secure-delete tools on Windows.
  Wipers and careful intruders use them to make deleted data unrecoverable.
references:
- https://attack.mitre.org/techniques/T1485/
- https://www.cisa.gov/stopransomware
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  product: windows
  service: sysmon
detection:
  selection_sdelete:
    EventID: 1
    Image|contains: \sdelete
  selection_cipher:
    EventID: 1
    Image|endswith: \cipher.exe
    CommandLine|contains|all:
    - /w
    - ':'
  condition: 1 of selection_*
fields:
- CommandLine
- ParentImage
- User
- Hostname
falsepositives:
- Approved disk disposal or wipe jobs by storage teams, mapped to change tickets
level: critical
tags:
- attack.t1485
