title: GitHub Secret Scanning Alert
id: 1a4a53aa-e115-4000-b86e-d7fa552524ef
status: experimental
description: Detects GitHub secret scanning alerts. A secret in a repo is not always live; check whether the key is valid and rotate if needed.
references:
- https://attack.mitre.org/techniques/T1593/003/
author: Souhaieb Marzouk
date: '2026-10-20'
tags:
- attack.reconnaissance
- attack.t1593.003
logsource:
  product: github
  service: audit
detection:
  selection:
    action: secret_scanning_alert.create
  condition: selection
fields:
- action
falsepositives:
- Test repo with fake keys
- Rotated key
- Secret scanner test
level: high

