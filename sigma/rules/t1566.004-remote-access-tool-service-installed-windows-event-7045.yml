title: Remote Access Tool Service Installed (Windows Event 7045)
id: 3bb2be89-7312-4a93-afc3-e695f2d826ae
status: experimental
description: Detects installation of a Windows service for remote access software. Service installation makes the attacker's tool survive reboots and is a strong persistence signal in vishing incidents.
references:
- https://attack.mitre.org/techniques/T1566/004/
- https://attack.mitre.org/techniques/T1543/003/
author: Souhaieb Marzouk
date: '2026-10-22'
tags:
- attack.persistence
- attack.t1543.003
- attack.initial_access
- attack.t1566.004
logsource:
  product: windows
  service: system
detection:
  selection_eventid:
    EventID: 7045
  selection_name:
    ServiceName|contains:
    - AnyDesk
    - TeamViewer
    - RustDesk
    - ScreenConnect
    - ConnectWise
    - UltraViewer
  condition: selection_eventid and selection_name
fields:
- ServiceName
- ImagePath
- StartType
- AccountName
- Computer
falsepositives:
- Managed deployment of approved remote support tools
level: high

