title: Possible DNS Tunneling Exfiltration with Long Labels and High Volume
id: 8f4a9c3e-2d71-4b6a-9e05-3c8f1d27a5b4
status: experimental
description: Detects one client sending many DNS queries whose names carry very long encoded labels. Attackers use this pattern
  to move stolen data out through DNS.
references:
- https://attack.mitre.org/techniques/T1048/
- https://attack.mitre.org/techniques/T1048/003/
author: Souhaieb Marzouk
date: '2026-10-23'
logsource:
  category: network
  product: zeek
  service: dns
detection:
  selection_long_label:
    query|re: (?i)([a-z0-9]{32,}\.)+[a-z]{2,}
  filter_known_good:
    query|endswith:
    - .corp.example.com
    - .in-addr.arpa
  condition: selection_long_label and not filter_known_good
fields:
- id.orig_h
- query
- qtype_name
- answers
falsepositives:
- Security scanners and asset discovery tools that use generated hostnames
- Content delivery networks with long generated labels
level: high
tags:
- attack.t1048
