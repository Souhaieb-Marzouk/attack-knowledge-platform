<!DOCTYPE html>
<!-- ==================================================================
     TECHNIQUE PAGE TEMPLATE — copy me to techniques/TXXXX.XXX.html
     (official ATT&CK casing; GitHub Pages is case-sensitive).

     HOW TO USE THIS FILE
     1. Copy it and rename the copy to the technique ID + ".html".
     2. Replace every {{TECHNIQUE_ID}} / {{TECHNIQUE_NAME}} marker.
     3. Paste YOUR OWN sections into the MAIN CONTENT block below —
        hero, animated simulation, red-team view, blue-team view,
        detection-engineering deep-dive, real-world case study.
        The platform never authors technique content (constraint #2).
     4. Set data-technique on #atk-header to the real technique ID —
        breadcrumbs, cross-link chips and prev/next are computed from
        data/techniques.json automatically.
     5. Add/update the row in data/techniques.json (status implemented,
        page set), run scripts/validate_data.py, commit.
     ================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TECHNIQUE_NAME}} — ATT&amp;CK Knowledge Platform</title>
  <meta name="description" content="{{TECHNIQUE_NAME}}: hand-written deep-dive — simulation, red-team view, blue-team view, detection engineering and a real-world case study.">
  <link rel="canonical" href="https://{{GITHUB_USERNAME}}.github.io/attack-knowledge-platform/techniques/{{TECHNIQUE_ID}}.html">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TECHNIQUE_NAME}} — ATT&amp;CK Knowledge Platform">
  <meta property="og:description" content="Hand-written deep-dive: simulation, red/blue views, detection engineering, real-world case study.">
  <meta property="og:url" content="https://{{GITHUB_USERNAME}}.github.io/attack-knowledge-platform/techniques/{{TECHNIQUE_ID}}.html">
  <meta property="og:image" content="https://{{GITHUB_USERNAME}}.github.io/attack-knowledge-platform/assets/img/social.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <script>(function(){try{var t=localStorage.getItem('atk-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>

  <!-- Optional but recommended: your page's own stylesheet. Your styles
       always win inside your content — platform styles only touch
       atk-* classes and the injected chrome. -->
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
<body>
  <a class="atk-skip" href="#main">Skip to content</a>

  <!-- PLATFORM INTEGRATION — data-technique powers breadcrumbs, the
       Relations block and prev/next. Mounts below are optional but
       recommended placement anchors; without them the platform picks
       sensible defaults (breadcrumbs after the header, relations and
       prev/next at the end of <main>). -->
  <div id="atk-header" data-technique="{{TECHNIQUE_ID}}"></div>

  <!-- Recommended: breadcrumb anchor (auto-filled from JSON) -->
  <div class="atk-main">
    <div id="atk-breadcrumbs"></div>

    <main id="main">
      <!-- ============================================================
           MAIN CONTENT GOES HERE — paste your own sections:
           hero, animated attack simulation, red-team view,
           blue-team view, detection-engineering deep-dive
           (embed your example Sigma rule), real-world case study.
           ============================================================ -->

      <!-- Recommended: Relations anchor (Used by / Mitigated by /
           Detected by chips — auto-filled from JSON) -->
      <div id="atk-relations"></div>

      <!-- Recommended: prev/next chain anchor (auto-filled from JSON) -->
      <div id="atk-prevnext"></div>
    </main>
  </div>

  <div id="atk-footer"></div>

  <!-- ==== PLATFORM INTEGRATION SCRIPT (required, exactly this) ==== -->
  <script src="../assets/js/platform.js" defer></script>
  <!-- search.js is lazy-loaded by platform.js on first Ctrl+K — that is
       by design, so your page ships zero extra bytes until needed. -->
</body>
</html>
