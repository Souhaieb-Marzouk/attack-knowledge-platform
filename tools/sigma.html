<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sigma Rule Library — ATT&amp;CK Knowledge Platform</title>
  <meta name="description" content="Every Sigma rule in the knowledge base: level, logsource, tactics, linked technique, and one-click Copy YAML. All rules validated by CI.">
  <link rel="canonical" href="https://souhaieb-marzouk.github.io/attack-knowledge-platform/tools/sigma.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sigma Rule Library — ATT&amp;CK Knowledge Platform">
  <meta property="og:description" content="Validated Sigma rules with one-click Copy YAML.">
  <meta property="og:url" content="https://souhaieb-marzouk.github.io/attack-knowledge-platform/tools/sigma.html">
  <meta property="og:image" content="https://souhaieb-marzouk.github.io/attack-knowledge-platform/assets/img/social.png">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <script>(function(){try{var t=localStorage.getItem('atk-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/platform.css">
</head>
<body>
  <a class="atk-skip" href="#main">Skip to content</a>
  <div id="atk-header"></div>
  <main id="main" class="atk-main">
    <h1>Sigma Rule Library</h1>
    <p class="atk-lede">Every rule is validated by CI (positive and negative tests) before it lands here. Copy any rule straight into your SIEM pipeline.</p>

    <div id="atk-sigma-banner" class="atk-sigma-banner">Loading rule index…</div>

    <div class="atk-sigma-filters">
      <div id="atk-sigma-tactics" class="atk-chips" role="group" aria-label="Filter by tactic"></div>
      <label class="atk-visually-hidden" for="atk-sigma-product">Filter by logsource product</label>
      <select id="atk-sigma-product" class="atk-sigma-product"></select>
    </div>

    <div id="atk-sigma-grid" class="atk-grid"></div>
    <p id="atk-sigma-empty" class="atk-hub-error" hidden>No rules match the current filters.</p>
  </main>
  <div id="atk-footer"></div>
  <script src="../assets/js/platform.js" defer></script>
  <script src="../assets/js/search.js" defer></script>
  <script src="../assets/js/sigma-library.js" defer></script>
</body>
</html>
