name: New technique guide
description: Request or propose a new ATT&CK technique deep-dive.
title: "[technique] TXXXX — "
labels: ["new-technique"]
body:
  - type: input
    id: technique
    attributes:
      label: ATT&CK technique ID and name
      placeholder: T1566.001 — Phishing: Spearphishing Attachment
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official ATT&CK URL
      placeholder: https://attack.mitre.org/techniques/T1566/001/
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this technique next?
      description: Reader value, incident prevalence, detection gap, or a source you can cite.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I can help write or review the guide.
        - label: I have log samples or a lab I can share safely.
