name: Sigma rule fix
description: A rule is wrong, noisy, or missing a test.
title: "[sigma] "
labels: ["rule-fix"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule file
      placeholder: sigma/rules/t1566.001-outlook-child-process.yml
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - False positive
        - False negative
        - Invalid schema or conversion
        - Missing positive/negative log test
        - Wrong ATT&CK mapping
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log event (redact secrets), test output, or a public reference.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: Include a condition change or a new JSONL fixture if possible.
