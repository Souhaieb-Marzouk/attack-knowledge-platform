name: Bug report
description: Something on the site is broken, wrong, or inconsistent.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page or URL
      placeholder: https://souhaieb-marzouk.github.io/attack-knowledge-platform/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the browser, theme, and any console output.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the page in both light and dark mode.
        - label: I searched existing issues first.
