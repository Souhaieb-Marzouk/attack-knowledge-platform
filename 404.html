<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — ATT&amp;CK Knowledge Platform</title>
  <meta name="description" content="This page does not exist. Search the knowledge base instead.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://{{GITHUB_USERNAME}}.github.io/attack-knowledge-platform/404.html">
  <script>
    /* Depth-proof asset loader. Pages serves this file for every dead URL,
     * so 'assets/css/platform.css' would resolve against the dead URL (e.g.
     * /techniques/assets/... -> 404). Derive the real root instead: on
     * github.io project pages it is always the FIRST path segment
     * (/repo-name/); local preview servers run from the repo root, so
     * localhost keeps root = "/". */
    (function () {
      var root = '/';
      if (!/^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname)) {
        var seg = decodeURIComponent(location.pathname.replace(/^\/+/, '').split('/')[0]);
        if (seg) root = '/' + seg + '/';
      }
      window.__atkRoot = root;
      document.write('<link rel="icon" type="image/svg+xml" href="' + root + 'assets/img/favicon.svg">');
      document.write('<link rel="stylesheet" href="' + root + 'assets/css/platform.css">');
    })();
  </script>
  <script>(function(){try{var t=localStorage.getItem('atk-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
  <noscript>
    <!-- JS-off fallback: correct at root-level dead URLs; deep dead URLs
         stay readable but unstyled - acceptable degradation. -->
    <link rel="stylesheet" href="assets/css/platform.css">
  </noscript>
</head>
<body data-atk-auto-search="true">
  <a class="atk-skip" href="#main">Skip to content</a>
  <div id="atk-header"></div>
  <main id="main" class="atk-main">
    <h1>404 — this page went dark</h1>
    <p class="atk-lede">The address <code id="atk-dead-url"></code> does not exist on this site. The search box should already be open — type a technique ID (like <code>T1566</code>), an actor name, or a Sigma rule title.</p>
    <p>
      <a class="atk-btn atk-btn-primary" id="atk-404-techniques" href="techniques/">Browse all techniques</a>
      <a class="atk-btn atk-btn-ghost" id="atk-404-home" href="./">Go home</a>
    </p>
  </main>
  <div id="atk-footer"></div>
  <script>
    /* Load the platform with the derived root, fix the two static buttons
     * the same way, and show the dead path so the visitor can spot typos.
     * search.js is lazy-loaded by platform.js when the auto-search (or
     * Ctrl+K) first fires - no second script tag needed. */
    (function () {
      var root = window.__atkRoot || '/';
      var home = document.getElementById('atk-404-home');
      if (home) home.href = root;
      var tech = document.getElementById('atk-404-techniques');
      if (tech) tech.href = root + 'techniques/';
      var s = document.createElement('script');
      s.src = root + 'assets/js/platform.js';
      s.defer = true;
      document.body.appendChild(s);
      var el = document.getElementById('atk-dead-url');
      if (el) el.textContent = decodeURIComponent(window.location.pathname);
    })();
  </script>
</body>
</html>
